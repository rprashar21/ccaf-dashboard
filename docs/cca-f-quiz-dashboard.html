ded fields capture multiple values, each with source location and effective\ndate."}, {"k": "D", "v": "Add prompt instructions to always extract the most recent amendment value and ignore superseded original\nterms."}], "a": "C", "e": "A. Preprocess documents with a classifier that identifies and removes superseded sections before the main\nextraction step. ❌ Incorrect.\nThis is brittle and risky—accurately identifying and removing superseded clauses is complex and may lead to\nloss of important context.\nB. Implement post-extraction validation using pattern matching to detect amendments and flag those\nextractions for manual review. ❌ Incorrect.\nThis increases manual review but does not improve extraction accuracy or resolve ambiguity.\nC. Redesign the schema so amended fields capture multiple values, each with source location and effective\ndate. ✅ Correct.\nThis preserves both original and amended values with context, enabling accurate interpretation and avoiding\nambiguity about which value applies.\nD. Add prompt instructions to always extract the most recent amendment value and ignore superseded\noriginal terms. ❌ Incorrect.\nThis relies on model judgment, which is inconsistent, and loses traceability of how values changed over time."}, {"n": 35, "q": "Your system must extract event details from calendar invitations and output JSON that strictly conforms to a\nschema with fields for title, date, time, location, and attendees. Downstream reject any malformed or non-\nconformant JSON. What approach provides the most reliable schema compliance?", "o": [{"k": "A", "v": "Define a tool with your target schema as input parameters and have Claude call it with the extracted data."}, {"k": "B", "v": "Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the\nresponse."}, {"k": "C", "v": "Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry logic to\nre-prompt when JSON parsing fails."}, {"k": "D", "v": "Include detailed JSON formatting instructions and the target schema in your prompt, then parse Claude's\ntext response as JSON."}], "a": "A", "e": "A. Define a tool with your target schema as input parameters and have Claude call it with the extracted\ndata. ✅ Correct.\nTool use enforces strict schema compliance at generation time, ensuring valid, structured JSON that\ndownstream systems can reliably consume.\nB. Pre-fill Claude's response with an opening brace to force JSON output, then complete and parse the\nresponse. ❌ Incorrect.\nThis is a fragile workaround and does not guarantee valid or schema-compliant JSON.\nC. Append instructions like \"Output only valid JSON matching the schema exactly\" and implement retry\nlogic to re-prompt when JSON parsing fails. ❌ Incorrect.\nHelpful but not reliable—models can still produce malformed or non-conformant JSON.\nD. Include detailed JSON formatting instructions and the target schema in your prompt, then parse\nClaude's text response as JSON. ❌ Incorrect.\nPrompt-based formatting alone cannot guarantee strict compliance, especially in edge cases."}, {"n": 36, "q": "Your schema includes a skills: string[] field. Production monitoring reveals three consistency issues: (1) compound\nphrases like \"Python and SQL\" are sometimes kept as one entry, sometimes split; (2) implied but unstated skills\noccasionally appear in extractions; (3) similar documents produce wildly different array lengths (5-10 vs 40+\nentries). Your prompt currently says \"Extract skills mentioned.\" What's the most effective improvement?", "o": [{"k": "A", "v": "Add constraints: \"Extract 10-20 skills maximum, one skill per entry, only explicitly named skills.\""}, {"k": "B", "v": "Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar entries."}, {"k": "C", "v": "Enrich the schema to [scondidering] to capture extraction metadata."}, {"k": "D", "v": "Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and appropriate\nentry granularity."}], "a": "D", "e": "A. Add constraints: \"Extract 10–20 skills maximum, one skill per entry, only explicitly named skills.\" ❌\nIncorrect.\nThis enforces limits but is arbitrary and may exclude valid skills or still leave ambiguity in how to split\nphrases.\nB. Add post-extraction normalization that maps skills to a canonical taxonomy and deduplicates similar\nentries. ❌ Incorrect.\nHelpful downstream, but it does not fix inconsistent extraction behavior at the source.\nC. Enrich the schema to capture extraction metadata. ❌ Incorrect.\nAdds complexity but does not directly address inconsistency in skill identification and formatting.\nD. Add few-shot examples demonstrating compound phrase handling, explicit mention criteria, and\nappropriate entry granularity. ✅ Correct.\nExamples directly guide the model on how to split, what to include, and the expected level of detail,\naddressing all three issues effectively."}, {"n": 37, "q": "Your pipeline uses a tool called extract_metadata with a JSON schema for paper details. You've also defined\nlookup_citations and verify_doi tools for enrichment. During testing, you notice that when users include requests\nlike \"extract the metadata and tell me how cited it is,\" Claude sometimes calls lookup_citations first, which fails\nbecause it needs the DOI that extract_metadata would provide. What's the most effective way to ensure\nstructured metadata extraction happens first?", "o": [{"k": "A", "v": "Set tool choice to (\"type\": \"tool\", \"name\": \"extract_metadata\") and process the enrichment requests in\nsubsequent turns after receiving the extracted metadata."}, {"k": "B", "v": "Set tool choice to \"any\" so Claude must use a tool, combined with system prompt instructions prioritizing\nextract_metadata."}, {"k": "C", "v": "Set tool choice to (\"type\": \"tool\", \"name\": \"extract_metadata\") for every API call in the pipeline, ensuring\nClaude always extracts metadata before any enrichment can occur."}, {"k": "D", "v": "Set tool choice to \"auto\" and reorder the tool definitions so extract_metadata appears first in the tools array,\nsince Claude prioritizes earlier-listed tools."}], "a": "A", "e": "A. Set tool choice to (\"type\": \"tool\", \"name\": \"extract_metadata\") and process the enrichment requests in\nsubsequent turns after receiving the extracted metadata. ✅ Correct.\nThis enforces the correct execution order, ensuring required data (like DOI) is available before dependent\ntools are called.\nB. Set tool choice to \"any\" so Claude must use a tool, combined with system prompt instructions\nprioritizing extract_metadata. ❌ Incorrect.\nThis does not guarantee ordering—Claude may still choose the wrong tool first.\nC. Set tool choice to (\"type\": \"tool\", \"name\": \"extract_metadata\") for every API call in the pipeline,\nensuring Claude always extracts metadata before any enrichment can occur. ❌ Incorrect.\nThis is too rigid and prevents legitimate use of other tools in later steps.\nD. Set tool choice to \"auto\" and reorder the tool definitions so extract_metadata appears first in the tools\narray, since Claude prioritizes earlier-listed tools. ❌ Incorrect.\nTool ordering does not reliably control selection or execution order."}, {"n": 38, "q": "Your system has been operating with 100% human review for 3 months. Analysis shows that extractions with\nmodel confidence >90% have 97% accuracy overall. To reduce reviewer workload, you plan to automate high-\nconfidence extractions. Before deploying, what validation step is most critical?", "o": [{"k": "A", "v": "Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted data."}, {"k": "B", "v": "Analyze accuracy by document type and field to verify high-confidence extractions perform consistently\nacross all segments, not just in aggregate."}, {"k": "C", "v": "Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that\nmaximizes automation while minimizing errors."}, {"k": "D", "v": "Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and\nmonitor error reports."}], "a": "B", "e": "A. Verify that 97% accuracy meets requirements for all downstream systems that consume the extracted\ndata. ❌ Incorrect.\nImportant, but it doesn’t ensure the confidence signal is reliable across different cases—it only checks\noverall acceptability.\nB. Analyze accuracy by document type and field to verify high-confidence extractions perform consistently\nacross all segments, not just in aggregate. ✅ Correct.\nAggregate accuracy can hide weak spots. You need to ensure confidence >90% is trustworthy across all\nsegments, otherwise automation may introduce systematic errors.\nC. Compare accuracy at different confidence thresholds (85%, 90%, 95%) to find the optimal cutoff that\nmaximizes automation while minimizing errors. ❌ Incorrect.\nUseful for tuning, but only after confirming the confidence signal is consistent and reliable across segments.\nD. Run a two-week pilot routing 25% of high-confidence extractions directly to downstream systems and\nmonitor error reports. ❌ Incorrect.\nA pilot is valuable, but deploying without validating segment-level reliability first introduces avoidable risk."}, {"n": 39, "q": "Your extraction system uses tool_use with a JSON schema containing 12 fields and detailed descriptions, totaling\napproximately 2,500 tokens for the complete tool definition. Processing documents under 150K tokens yields 98%\naccuracy. For documents between 175-190K tokens, accuracy drops to 71%, with information from the final third\nconsistently missed. The model's context window is 200K tokens. What is the most likely cause?", "o": [{"k": "A", "v": "Tool definitions consume input context tokens. Combined with system prompts and document content, the\ntotal approaches the context limit, degrading end-of-document processing."}, {"k": "B", "v": "Very long documents exceed the model's effective attention span regardless of context limits, causing\naccuracy degradation for content farther from the prompt instructions."}, {"k": "C", "v": "The model distributes attention proportionally across input length, causing fields mentioned only once near\nthe document's end to receive insufficient processing focus."}, {"k": "D", "v": "Schemas exceeding 8-10 fields increase decision complexity during parameter generation, reducing\nextraction accuracy independent of document length."}], "a": "A", "e": "A. Tool definitions consume input context tokens. Combined with system prompts and document content,\nthe total approaches the context limit, degrading end-of-document processing. ✅ Correct.\nThe tool schema (~2,500 tokens) plus system prompts and large documents push total input close to the\n200K context limit, causing truncation or reduced attention to the final portion—hence missed information in\nthe last third.\nB. Very long documents exceed the model's effective attention span regardless of context limits, causing\naccuracy degradation for content farther from the prompt instructions. ❌ Incorrect.\nWhile attention can vary, the sharp drop near the context boundary strongly indicates a context limit issue,\nnot general attention decay.\nC. The model distributes attention proportionally across input length, causing fields mentioned only once\nnear the document's end to receive insufficient processing focus. ❌ Incorrect.\nThis is a weaker effect and does not explain the consistent failure in the final third tied to document size\nthresholds.\nD. Schemas exceeding 8–10 fields increase decision complexity during parameter generation, reducing\nextraction accuracy independent of document length. ❌ Incorrect.\nSchema size is constant across cases; it does not explain why accuracy drops only for longer documents."}, {"n": 40, "q": "Your extraction pipeline processes invoices and extracts line items, subtotals, tax amounts, and grand totals.\nDuring evaluation, you discover that in 18% of extractions, the sum of extracted line item amounts doesn't match\nthe extracted grand total—sometimes due to OCR errors in the source document, sometimes due to extraction\nmistakes by the model. Downstream accounting systems reject records with mismatched totals. What's the most\neffective approach to improve extraction reliability?", "o": [{"k": "A", "v": "Add a \"calculated total\" field where the model sums extracted line items alongside a \"stated_total\" field.\nFlag records for human review when values differ."}, {"k": "B", "v": "Extract line items and totals independently, then use a separate validation model to reconcile discrepancies\nby determining which extracted values are most likely correct."}, {"k": "C", "v": "Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated total,\nencouraging the model to produce mathematically consistent extractions."}, {"k": "D", "v": "Implement post-processing that automatically adjusts line item amounts proportionally when their sum\ndoesn't match the stated total."}], "a": "A", "e": "A. Add a \"calculated total\" field where the model sums extracted line items alongside a \"stated_total\"\nfield. Flag records for human review when values differ. ✅ Correct.\nThis preserves both sources of truth and enables reliable validation. Discrepancies can be flagged explicitly,\nimproving accuracy without silently altering financial data.\nB. Extract line items and totals independently, then use a separate validation model to reconcile\ndiscrepancies by determining which extracted values are most likely correct. ❌ Incorrect.\nThis adds complexity and uncertainty—“guessing” which value is correct can introduce errors in financial\ndata.\nC. Add few-shot examples demonstrating invoices where extracted line items sum correctly to the stated\ntotal, encouraging the model to produce mathematically consistent extractions. ❌ Incorrect.\nHelpful but insufficient—does not handle OCR errors or real inconsistencies in source documents.\nD. Implement post-processing that automatically adjusts line item amounts proportionally when their sum\ndoesn't match the stated total. ❌ Incorrect.\nThis modifies financial data artificially, which is risky and unacceptable for accounting accuracy."}, {"n": 41, "q": "Your extraction system processes two document types: standard monthly reports (archived after processing) and\nurgent exception reports (must trigger business alerts within 30 minutes of receipt). Both use the same JSON\nschema. You want to minimize API costs while meeting latency requirements. How should you architect the\nprocessing pipeline?", "o": [{"k": "A", "v": "Submit all documents to the Batch API with custom ids for tracking. When results arrive, immediately\nprocess urgent documents and trigger delayed alerts for exceptions."}, {"k": "B", "v": "Submit all documents to the real-time Messages API to ensure consistent processing latency across\ndocument types."}, {"k": "C", "v": "Queue all documents and submit hourly batches, flagging urgent documents for expedited handling when\nbatch results return."}, {"k": "D", "v": "Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the\nreal-time Messages API."}], "a": "D", "e": "A. Submit all documents to the Batch API with custom ids for tracking. When results arrive, immediately\nprocess urgent documents and trigger delayed alerts for exceptions. ❌ Incorrect.\nBatch processing introduces delays that can exceed the 30-minute requirement, making it unsuitable for\nurgent reports.\nB. Submit all documents to the real-time Messages API to ensure consistent processing latency across\ndocument types. ❌ Incorrect.\nThis meets latency needs but is unnecessarily expensive for standard reports that don’t require real-time\nprocessing.\nC. Queue all documents and submit hourly batches, flagging urgent documents for expedited handling\nwhen batch results return. ❌ Incorrect.\nHourly batching further increases delay and cannot meet urgent processing requirements.\nD. Route standard reports to the Batch API for 50% cost savings, and route urgent exception reports to the\nreal-time Messages API. ✅ Correct.\nThis balances cost efficiency and latency requirements, ensuring urgent reports are processed quickly while\noptimizing cost for non-urgent ones."}, {"n": 42, "q": "The extraction pipeline receives documents of varying types—some are invoices, others are contracts, and some\nare receipts. You've defined separate extraction tools, each with its own schema tailored to the document type.\nDuring testing, you observe that with tool_choice: \"auto\", Claude sometimes returns conversational text instead of\ncalling an extraction tool, causing downstream parsing failures. You need guaranteed structured output without\nknowing the document type in advance. What's the most effective approach?", "o": [{"k": "A", "v": "Consolidate all document types into a single unified-schema extraction tool and force that tool."}, {"k": "B", "v": "Keep tool_choice: \"auto\" with system prompt instructions requiring tool use."}, {"k": "C", "v": "Set tool_choice: \"any\" with all extraction tools defined."}, {"k": "D", "v": "Add a preliminary classification call, then make a second call with tool_choice forced to the identified\nextraction tool."}], "a": "C", "e": "A. Consolidate all document types into a single unified-schema extraction tool and force that tool. ❌\nIncorrect.\nThis reduces extraction accuracy and creates an overly complex schema that doesn’t fit all document types\nwell.\nB. Keep tool_choice: \"auto\" with system prompt instructions requiring tool use. ❌ Incorrect.\nInstructions alone are not enforceable, which is exactly why the issue occurs.\nC. Set tool_choice: \"any\" with all extraction tools defined. ✅ Correct.\nThis guarantees that a tool will always be called, eliminating conversational text responses. While tool\nselection may not always be perfect, it ensures structured output every time, which is the primary\nrequirement.\nD. Add a preliminary classification call, then make a second call with tool_choice forced to the identified\nextraction tool. ❌ Incorrect.\nWhile more precise, this adds extra latency and complexity. The question prioritizes guaranteed structured\noutput, which C achieves more directly."}, {"n": 43, "q": "Monitoring shows 12% of extractions fall Pydantic validation with specific errors like \"expected float for quantity,\ngot '2 to 3\". Retrying these requests without modification produces failures. What's the most effective approach to\nrecover from these validation failures?", "o": [{"k": "A", "v": "Set temperature to 0 to eliminate output variability and ensure consistent formatting"}, {"k": "B", "v": "Send a follow-up request including the validation error, asking the model to correct its output"}, {"k": "C", "v": "Pre-process source documents to standardize problematic formats before sending them for extraction"}, {"k": "D", "v": "Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation"}], "a": "B", "e": "A. Set temperature to 0 to eliminate output variability and ensure consistent formatting ❌ Incorrect.\nThis reduces randomness but won’t fix systematic extraction errors like misinterpreting ranges (“2 to 3”).\nB. Send a follow-up request including the validation error, asking the model to correct its output ✅\nCorrect.\nProviding specific validation feedback allows the model to correct the exact issue (e.g., convert “2 to 3” into a\nvalid float), making recovery highly effective.\nC. Pre-process source documents to standardize problematic formats before sending them for extraction\n❌ Incorrect.\nHelpful in some cases, but not scalable or sufficient for diverse real-world variations.\nD. Implement a secondary pipeline using a larger model tier to reprocess documents that fail validation ❌\nIncorrect.\nMore expensive and not necessary—targeted correction is more efficient and effective."}, {"n": 44, "q": "After three months of weekly sessions, your conversation history has grown to 85,000 tokens. When users ask\n\"What did we conclude about the theme of isolation?\", the assistant provides generic literary analysis rather than\nreferencing the group's specific insights from earlier sessions. Discussions often build on previous meetings'\nconclusions, so maintaining narrative context is important. What's the most effective approach?", "o": [{"k": "A", "v": "Add structured XML tags to mark significant discussion conclusions throughout the conversation history."}, {"k": "B", "v": "Use semantic embedding to index the full conversation history and retrieve only relevant past exchanges for\neach user query, replacing the linear conversation format with retrieved segments."}, {"k": "C", "v": "Implement rolling window truncation to keep only the most recent 25,000 tokens."}, {"k": "D", "v": "Implement progressive summarization where older conversation blocks are replaced with concise summaries\nthat explicitly extract key conclusions, decisions, and recurring themes, keeping recent exchanges verbatim."}], "a": "D", "e": "A. Add structured XML tags to mark significant discussion conclusions throughout the conversation\nhistory. ❌ Incorrect.\nTagging helps organization, but it doesn’t solve the context length limitation or ensure relevant retrieval at\nquery time.\nB. Use semantic embedding to index the full conversation history and retrieve only relevant past\nexchanges for each user query, replacing the linear conversation format with retrieved segments. ❌\nIncorrect.\nPowerful for retrieval, but replacing the conversation entirely loses narrative continuity, which is important\nfor ongoing discussions.\nC. Implement rolling window truncation to keep only the most recent 25,000 tokens. ❌ Incorrect.\nThis discards earlier insights, which are critical for referencing past conclusions.\nD. Implement progressive summarization where older conversation blocks are replaced with concise\nsummaries that explicitly extract key conclusions, decisions, and recurring themes, keeping recent\nexchanges verbatim. ✅ Correct.\nThis preserves long-term context and key insights while staying within token limits, enabling the assistant to\nreference past conclusions effectively."}, {"n": 45, "q": "After a 40-minute session helping plan a dinner party, the conversation has grown to 78,000 tokens. The history\nincludes: (1) the user mentioning a guest has a severe shellfish allergy, (2) measurements for scaling recipes to 8\nservings, (3) the user's clarification that \"room temperature butter\" means 68°F in their kitchen, and (4) general\nback-and-forth about meal timing and presentation. You need to implement context management before the\nwindow limit is reached. What approach best balances information preservation with token reduction?", "o": [{"k": "A", "v": "Summarize the entire conversation history into a concise summary capturing main topics discussed, then\nappend new messages going forward."}, {"k": "B", "v": "Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state\nimportant information when relevant."}, {"k": "C", "v": "Store the full conversation externally and use semantic search to retrieve relevant portions for each turn,\nloading only matching segments into context."}, {"k": "D", "v": "Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference\nsection, summarize general discussion, and retain recent exchanges verbatim."}], "a": "D", "e": "A. Summarize the entire conversation history into a concise summary capturing main topics discussed, then\nappend new messages going forward. ❌ Incorrect.\nThis risks losing critical details like allergies and precise measurements that must remain exact.\nB. Implement a sliding window retaining only the most recent 20,000 tokens relying on users to re-state\nimportant information when relevant. ❌ Incorrect.\nThis discards essential context (e.g., allergy info), which is unsafe and unreliable.\nC. Store the full conversation externally and use semantic search to retrieve relevant portions for each\nturn, loading only matching segments into context. ❌ Incorrect.\nHelpful for retrieval, but may miss important persistent constraints (like allergies) if not explicitly retrieved\nevery time.\nD. Extract critical structured data (allergies, serving counts, user-defined terms) into a compact reference\nsection, summarize general discussion, and retain recent exchanges verbatim. ✅ Correct.\nThis preserves high-priority facts exactly, reduces tokens efficiently, and maintains conversational\ncontinuity."}, {"n": 46, "q": "You're Implementing a feature where users refine their playlist preferences through multiple conversation turns.\nAfter deploying, you notice Claude's responses don't reflect what us earlier in the same conversation—for\nexample, a user says they love jazz, but two messages later Claude asks what genres they enjoy. What is the most\nlikely cause?", "o": [{"k": "A", "v": "The model's context window has been exceeded by the conversation length"}, {"k": "B", "v": "The Claude API requires a session_id parameter that you haven't configured"}, {"k": "C", "v": "Claude requires a vector database connection to maintain conversation memory"}, {"k": "D", "v": "Your application isn't including prior messages in the messages array"}], "a": "D", "e": "A. The model's context window has been exceeded by the conversation length ❌ Incorrect.\nThis would only happen in very long conversations, and the issue appears early within just a few turns.\nB. The Claude API requires a session_id parameter that you haven't configured ❌ Incorrect.\nThere is no required session_id—context must be explicitly managed by the application.\nC. Claude requires a vector database connection to maintain conversation memory ❌ Incorrect.\nA vector database is optional for retrieval, not required for basic conversation memory.\nD. Your application isn't including prior messages in the messages array ✅ Correct.\nClaude does not retain memory between calls—if previous messages aren’t included, it cannot recall earlier\nuser preferences."}, {"n": 47, "q": "Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a\nbeginner, provide step-by-step form instructions. If they use term 'progressive overload' or 'superset', respond\nconcisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation, you find\nthe assistant correct explicit expertise declarations but struggles when users don't clearly state their level-often\ndefaulting to overly detailed responses regardless of contextual cues like technical te\nWhich change to the system prompt would most directly address this failure to pick up on implicit expertise\nsignals?", "o": [{"k": "A", "v": "Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise,\nmirroring their terminology.\" Keep only the safety-critical conditional abou consultations."}, {"k": "B", "v": "Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep\nranges or asks about periodization, treat as advanced.\""}, {"k": "C", "v": "Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into\nthe system prompt as context for all subsequent responses."}, {"k": "D", "v": "Add an explicit instruction for the model to ask a clarifying question about experience level whenever the\nuser's expertise isn't immediately clear from their first message."}], "a": "A", "e": "A. Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise,\nmirroring their terminology.\" Keep only the safety-critical conditional about consultations. ✅ Correct.\nThis shifts from brittle rule-based logic to a flexible heuristic, enabling the model to infer expertise from\nsubtle cues like terminology and tone.\nB. Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific\nrep ranges or asks about periodization, treat as advanced.\" ❌ Incorrect.\nThis increases complexity and brittleness—edge cases will still be missed.\nC. Implement a pre-conversation intake that asks users to rate their experience level, then inject that\nrating into the system prompt as context for all subsequent responses. ❌ Incorrect.\nUseful, but doesn’t solve the issue of interpreting implicit signals during conversation.\nD. Add an explicit instruction for the model to ask a clarifying question about experience level whenever\nthe user's expertise isn't immediately clear from their first message. ❌ Incorrect.\nThis adds friction and interrupts flow instead of improving implicit understanding."}, {"n": 48, "q": "During initial testing, you notice that Claude doesn't seem to remember vocabulary words from earlier in the\nconversation. When a student asks \"Can you quiz me on those words?\", responds as if no words have been\ndiscussed. What is the most likely explanation?", "o": [{"k": "A", "v": "Your system prompt needs explicit instructions telling Claude to remember information from earlier turns."}, {"k": "B", "v": "You're not including prior messages in each API request—the stateless API doesn't retain conversation\nhistory."}, {"k": "C", "v": "You need to enable conversation persistence by passing a session ID parameter with each API call."}, {"k": "D", "v": "The model's context window has filled up, causing earlier conversation content to be dropped."}], "a": "B", "e": "A. Your system prompt needs explicit instructions telling Claude to remember information from earlier\nturns. ❌ Incorrect.\nInstructions alone don’t give the model memory—context must be provided with each request.\nB. You're not including prior messages in each API request—the stateless API doesn't retain conversation\nhistory. ✅ Correct.\nClaude is stateless. If earlier messages aren’t passed in the request, it has no awareness of prior vocabulary.\nC. You need to enable conversation persistence by passing a session ID parameter with each API call. ❌\nIncorrect.\nThere’s no required session ID—memory is handled by including past messages.\nD. The model's context window has filled up, causing earlier conversation content to be dropped. ❌\nIncorrect.\nThis would only happen in very long conversations, not typical early testing scenarios."}, {"n": 49, "q": "Your home renovation planning assistant uses a system prompt defining an expert contractor persona with specific\nguidelines: always ask about budget, suggest alternatives at multiple price points, and confirm timeline\nrequirements. During testing, responses follow these guidelines for turns 1-4, but by turn 7, the assistant gives\ngeneric advice without asking about budget or timeline. The conversation totals only 2,500 tokens. What is the\nmost likely cause?", "o": [{"k": "A", "v": "System prompts only establish initial behavior and don't persist across all turns."}, {"k": "B", "v": "The system prompt is only sent with the first API request."}, {"k": "C", "v": "The assistant's accumulated responses are diluting the system prompt's influence."}, {"k": "D", "v": "The model's attention on system prompt instructions naturally weakens as turns accumulate."}], "a": "C", "e": "A. System prompts only establish initial behavior and don't persist across all turns. ❌ Incorrect.\nSystem prompts do persist as long as they are included in each request.\nB. The system prompt is only sent with the first API request. ❌ Incorrect.\nIf this were the case, the behavior would degrade immediately after the first turn—not gradually by turn 7.\nC. The assistant's accumulated responses are diluting the system prompt's influence. ✅ Correct.\nAs the conversation grows, the model must balance more context. Even within a small token count, recent\nconversational patterns can outweigh earlier instructions, causing drift from the original system prompt.\nD. The model's attention on system prompt instructions naturally weakens as turns accumulate. ❌\nIncorrect.\nThis is too vague—it's not just “natural weakening,” but specifically the increasing influence of\nconversational context relative to the system prompt."}, {"n": 50, "q": "Users report that during extended conversations, the AI loses track of specific topics, examples, and preferences\nthey mentioned earlier in the session. Your current implementation uses a sliding window that keeps only the most\nrecent 25 message pairs to stay within context limits. What's the most effective approach to maintain awareness\nof earlier conversation content while managing context size?", "o": [{"k": "A", "v": "Replace the sliding window with a hybrid approach: summarize older messages while keeping recent\nmessages verbatim."}, {"k": "B", "v": "Implement vector similarity search over the full conversation history, retrieving relevant past messages for\neach user query."}, {"k": "C", "v": "Increase the window size to 50 message pairs to retain more conversation history before truncation."}, {"k": "D", "v": "Add a separate API call each turn to summarize messages being dropped, prepending this running summary\nto the conversation."}], "a": "A", "e": "A. Replace the sliding window with a hybrid approach: summarize older messages while keeping recent\nmessages verbatim. ✅ Correct.\nThis preserves long-term context in a compressed form while keeping recent interactions intact, maintaining\ncontinuity without exceeding token limits.\nB. Implement vector similarity search over the full conversation history, retrieving relevant past messages\nfor each user query. ❌ Incorrect.\nWhile powerful, this is more complex and better suited for large-scale or cross-session retrieval, not\nnecessarily the most direct fix for in-session context loss.\nC. Increase the window size to 50 message pairs to retain more conversation history before truncation. ❌\nIncorrect.\nThis only delays the issue and increases token usage without fundamentally solving it.\nD. Add a separate API call each turn to summarize messages being dropped, prepending this running\nsummary to the conversation. ❌ Incorrect.\nThis can lead to summary drift and compounding errors, reducing reliability over time."}, {"n": 51, "q": "Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count,\nor budget. Your evaluation shows the assistant asks an average of 4 questions before taking any action, causing\n35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive\nrecommendations that don't preferences. What's the most effective approach to improve this trade-off?", "o": [{"k": "A", "v": "Implement a structured intake form that collects all required parameters (date, guest count, budget, venue\ntype) upfront before the assistant begins providing any recommendation"}, {"k": "B", "v": "Configure the assistant to proceed with reasonable defaults (medium sized venue, next weekend, moderate\nbudget) without explicitly stating these assumptions, allowing users to corrections if results don't match\nexpectations"}, {"k": "C", "v": "Instruct the assistant to state explicit assumptions based on conversation status proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only Irreversible actions like\nconfirming bookings."}, {"k": "D", "v": "Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What\ndate, guest count, and budget are you considering?\") to reduce the total"}], "a": "C", "e": "A. Implement a structured intake form that collects all required parameters (date, guest count, budget,\nvenue type) upfront before the assistant begins providing any recommendation ❌ Incorrect.\nThis ensures completeness but adds high friction, increasing drop-off before any value is delivered.\nB. Configure the assistant to proceed with reasonable defaults (medium sized venue, next weekend,\nmoderate budget) without explicitly stating these assumptions, allowing users to correct them if results\ndon't match expectations ❌ Incorrect.\nHidden assumptions can lead to misalignment and confusion, reducing trust.\nC. Instruct the assistant to state explicit assumptions based on conversation status, proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only for irreversible actions\nlike confirming bookings. ✅ Correct.\nThis balances speed and accuracy—users get immediate value, assumptions are transparent, and friction is\nminimized.\nD. Configure the assistant to consolidate all clarifying questions into a single compound question (e.g.,\n\"What date, guest count, and budget are you considering?\") to reduce the total ❌ Incorrect.\nThis reduces question count but still creates front-loaded friction without delivering immediate value."}, {"n": 52, "q": "During QA testing, you notice that Claude follows your system prompt guidelines consistently in the first 10-15\nturns, but by turn 25-30, responses begin deviating—using informal tone when formality was specified,\noccasionally skipping required formatting, or providing information types the guidelines restrict. Conversation\nlength is well within context limits (typically 30,000 tokens out of 200,000 available). What's the most effective\napproach to maintain consistent behavior throughout extended conversations?", "o": [{"k": "A", "v": "Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints, especially\nbefore complex requests."}, {"k": "B", "v": "Implement post-response validation that regenerates each response until it conforms to the specified\nguidelines."}, {"k": "C", "v": "Automatically start a new conversation after 20 turns, passing a summary of the prior context to maintain\ncontinuity."}, {"k": "D", "v": "Move behavioral guidelines from the system prompt into the first user message."}], "a": "A", "e": "A. Insert user-role messages that reinforce critical guidelines at natural conversation breakpoints,\nespecially before complex requests. ✅ Correct.\nThis combats instruction drift by periodically refreshing key constraints within the active context, keeping\nbehavior aligned over long conversations.\nB. Implement post-response validation that regenerates each response until it conforms to the specified\nguidelines. ❌ Incorrect.\nThis is costly and reactive, and can create loops without addressing the root cause of drift.\nC. Automatically start a new conversation after 20 turns, passing a summary of the prior context to\nmaintain continuity. ❌ Incorrect.\nSummarization can lose detail and doesn’t directly reinforce behavioral rules.\nD. Move behavioral guidelines from the system prompt into the first user message. ❌ Incorrect.\nUser messages carry less weight than system prompts and are more likely to be overridden during the\nconversation."}, {"n": 53, "q": "Performance analysis reveals your context is composed of accumulated RAG results from all previous queries,\nwhich is crowding out conversation history and causing coherence degradation after 15+ turns. Which approach\nbest addresses this issue?", "o": [{"k": "A", "v": "Implement semantic deduplication to identify and remove redundant information across the accumulated\nRAG results and conversation turns"}, {"k": "B", "v": "Implement a sliding window for RAG results from the last 2-3 queries while preserving conversation history"}, {"k": "C", "v": "Shift context budget to favor RAG results while reducing conversation history allocation"}, {"k": "D", "v": "Compress all RAG results into a consolidated summary document that updates incrementally after each\nretrieval"}], "a": "B", "e": "A. Implement semantic deduplication to identify and remove redundant information across the\naccumulated RAG results and conversation turns ❌ Incorrect.\nThis reduces redundancy but doesn’t solve the core issue of unbounded accumulation of RAG context.\nB. Implement a sliding window for RAG results from the last 2–3 queries while preserving conversation\nhistory ✅ Correct.\nThis directly addresses context crowding by limiting RAG growth while keeping conversation continuity\nintact.\nC. Shift context budget to favor RAG results while reducing conversation history allocation ❌ Incorrect.\nThis worsens coherence by sacrificing conversation context.\nD. Compress all RAG results into a consolidated summary document that updates incrementally after each\nretrieval ❌ Incorrect.\nThis can introduce information loss and summary drift, especially across many turns."}, {"n": 54, "q": "Your music discovery assistant should consistently maintain an enthusiastic tone, explain its reasoning for each\nrecommendation, and ask clarifying questions to better understand user preferences. You want this behavior to\npersist reliably across all user interactions. Where should you define these behavioral guidelines?", "o": [{"k": "A", "v": "In the first assistant message, instructing Claude to follow these guidelines going forward"}, {"k": "B", "v": "Prepended to each user message before sending to the API"}, {"k": "C", "v": "In the system prompt"}, {"k": "D", "v": "In environmental variables that your application passes to the API client"}], "a": "C", "e": "A. In the first assistant message, instructing Claude to follow these guidelines going forward ❌ Incorrect.\nAssistant messages don’t reliably control future behavior and can be overridden by later context.\nB. Prepended to each user message before sending to the API ❌ Incorrect.\nUser messages carry less authority than system-level instructions and are less reliable for enforcing behavior.\nC. In the system prompt ✅ Correct.\nThe system prompt is the highest-priority instruction layer, making it the most reliable place to enforce\nconsistent tone, reasoning style, and questioning behavior.\nD. In environmental variables that your application passes to the API client ❌ Incorrect.\nEnvironment variables are not part of the model’s context and have no effect on behavior unless explicitly\nincluded in the prompt."}, {"n": 55, "q": "During a conversation about order tracking, your external system receives a webhook indicating the user's\npackage has shipped. The user is actively chatting and will likely send a follow-up message soon. You want the\nassistant to naturally incorporate this status change in its next response. What's the most effective approach?", "o": [{"k": "A", "v": "Immediately send an API request with the update as a synthetic user message, generating an unsolicited\nassistant response."}, {"k": "B", "v": "Append the status update as a prefix to the next user message before calling the API."}, {"k": "C", "v": "Configure the assistant to call a get_order_status tool at the start of every response."}, {"k": "D", "v": "Add the current shipping status to the system prompt before the next API call."}], "a": "D", "e": "A. Immediately send an API request with the update as a synthetic user message, generating an unsolicited\nassistant response. ❌ Incorrect.\nThis creates an unsolicited interruption, which can feel unnatural and confusing in an active conversation.\nB. Append the status update as a prefix to the next user message before calling the API. ❌ Incorrect.\nThis pollutes the user message and mixes system state with user intent, which can lead to misinterpretation.\nC. Configure the assistant to call a get_order_status tool at the start of every response. ❌ Incorrect.\nThis is inefficient and unnecessary, especially when you already have the update via webhook.\nD. Add the current shipping status to the system prompt before the next API call. ✅ Correct.\nThis cleanly injects up-to-date system state into context, allowing the assistant to naturally incorporate it\ninto the next response without disrupting the conversation flow."}, {"n": 56, "q": "A new user's first message is \"Set up my focus music,\" This could mean configure preferences, create a playlist, or\nplay music immediately. Your system supports all three actions. What's the effective approach?", "o": [{"k": "A", "v": "Create a new \"Focus\" playlist with curated tracks and notify the user it's ready."}, {"k": "B", "v": "Ask one clarifying question about action type: play now or configure for later"}, {"k": "C", "v": "Play popular focus tracks Immediately and let the user redirect if needed"}, {"k": "D", "v": "Start preference configuration by asking about genres, temps, and artists they prefer for focus."}], "a": "B", "e": "A. Create a new \"Focus\" playlist with curated tracks and notify the user it's ready. ❌ Incorrect.\nThis assumes intent and may do the wrong action, frustrating users.\nB. Ask one clarifying question about action type: play now or configure for later ✅ Correct.\nThis minimizes friction while resolving ambiguity, enabling the assistant to take the right action quickly.\nC. Play popular focus tracks immediately and let the user redirect if needed ❌ Incorrect.\nActs prematurely and may not match user intent.\nD. Start preference configuration by asking about genres, tempo, and artists ❌ Incorrect.\nToo heavy upfront—adds unnecessary friction before confirming intent."}, {"n": 57, "q": "Users report that responses feel repetitive across turns—each message begins with phrases like \"Certainly!\" or\n\"I'd be happy to help!\" even deep into conversations. You want responses to feel more natural, without these\nrepetitive openers. What's the most effective approach?", "o": [{"k": "A", "v": "Implement post-processing to detect and strip common greeting phrases from response beginnings"}, {"k": "B", "v": "Add system prompt instructions specifying phrases to avoid, such as \"Never begin responses with 'Certainly'\nor similar affirmations\""}, {"k": "C", "v": "Lower the temperature parameter to make response openings more deterministic and less variable"}, {"k": "D", "v": "Append a partial assistant message with a direct response opening that the model will continue from"}], "a": "D", "e": "D. Append a partial assistant message with a direct response opening that the model will continue from.\nThis technique, often referred to as \"Pre-filling\" or \"Response Steering,\" is a powerful way to control the style\nand tone of an LLM. By providing the first few words of the assistant's response in the API call, you force the\nmodel to continue from that point, bypassing its internal \"politeness\" training or RLHF-induced habit of\nstarting every turn with a greeting."}, {"n": 58, "q": "Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count,\nor budget. Your evaluation shows the assistant asks an average of 4 questions before taking any action, causing\n35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes receive\nrecommendations that don't preferences. What's the most effective approach to improve this trade-off?", "o": [{"k": "A", "v": "Implement a structured intake form that collects all required parameters (date, guest count, budget, venue\ntype) upfront before the assistant begins providing any recommendation"}, {"k": "B", "v": "Configure the assistant to proceed with reasonable defaults (medium sized venue, next weekend, moderate\nbudget) without explicitly stating these assumptions, allowing users to corrections if results don't match\nexpectations"}, {"k": "C", "v": "Instruct the assistant to state explicit assumptions based on conversation status proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only Irreversible actions like\nconfirming bookings."}, {"k": "D", "v": "Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What\ndate, guest count, and budget are you considering?\") to reduce the total"}], "a": "C", "e": "A. Implement a structured intake form that collects all required parameters (date, guest count, budget,\nvenue type) upfront before the assistant begins providing any recommendation ❌ Incorrect.\nThis ensures completeness but adds high friction, increasing drop-off before any value is delivered.\nB. Configure the assistant to proceed with reasonable defaults (medium sized venue, next weekend,\nmoderate budget) without explicitly stating these assumptions, allowing users to correct them if results\ndon't match expectations ❌ Incorrect.\nHidden assumptions can lead to misalignment and confusion, reducing trust.\nC. Instruct the assistant to state explicit assumptions based on conversation status, proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only for irreversible actions\nlike confirming bookings. ✅ Correct.\nThis balances speed and accuracy—users get immediate value, assumptions are transparent, and friction is\nminimized.\nD. Configure the assistant to consolidate all clarifying questions into a single compound question (e.g.,\n\"What date, guest count, and budget are you considering?\") to reduce the total ❌ Incorrect.\nThis reduces question count but still creates front-loaded friction without delivering immediate value."}, {"n": 59, "q": "Your process refund tool returns two types of errors: technical errors (\"503 Service Unavailable\", \"Connection\ntimeout\") that are transient (5% of calls), and business errors (\"Order exceeds 3 day return window\", \"item already\nrefunded\") that are permanent (12% of calls). Monitoring shows the agent wastes 3-4 turns retrying business\nerrors that can never succeed. Currently, both error types return only a plain text message to Claude.\nWhat's the most effective way to reduce wasted retries while improving customer-facing response quality?", "o": [{"k": "A", "v": "Add few-shot examples showing how to distinguish retriable from non-retriable errors by parsing error\nmessage text."}, {"k": "B", "v": "Add a check refund eligibility tool that must be called before process refund to prevent business rule\nviolations."}, {"k": "C", "v": "Implement automatic retry logic at the tool level for technical errors only, passing business errors to Claude\nwithout retries."}, {"k": "D", "v": "Return structured error responses with retriable false for business errors and a customer-friendly\nexplanation for Claude to use."}], "a": "D", "e": "A. Add few-shot examples showing how to distinguish retriable from non-retriable errors by parsing error\nmessage text. ❌ Incorrect.\nParsing plain text error messages is brittle and unreliable compared to explicit structured signals.\nB. Add a check refund eligibility tool that must be called before process refund to prevent business rule\nviolations. ❌ Incorrect.\nThis may reduce some failures, but business errors can still occur and it adds extra tool calls and latency.\nC. Implement automatic retry logic at the tool level for technical errors only, passing business errors to\nClaude without retries. ❌ Incorrect.\nThis improves handling of transient failures, but Claude may still retry permanent business errors because it\nlacks explicit retryability information.\nD. Return structured error responses with retriable: false for business errors and a customer-friendly\nexplanation for Claude to use. ✅ Correct.\nStructured error metadata lets the agent reliably distinguish permanent vs. transient failures, preventing\nwasted retries while improving user-facing responses."}, {"n": 60, "q": "Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response\nincludes 40+ fields (items, shipping details, payment inf outputs now represent the majority of the conversation's\ncontext. The customer mentions two more orders they want to discuss. What's the most effective approach before\nlookups?", "o": [{"k": "A", "v": "Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the\nconversation continues"}, {"k": "B", "v": "Extract only return-relevant fields (items, purchase date, return window, status) from each existing order\nresponse, removing verbose details"}, {"k": "C", "v": "Have the model generate a natural language summary of each order's key details, replacing structured\nresponses with prose descriptions"}, {"k": "D", "v": "Proceed with additional lookups without modifying the existing tool output context"}], "a": "B", "e": "A. Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the\nconversation continues ❌ Incorrect.\nThis adds unnecessary infrastructure complexity for a short-lived conversational context problem.\nB. Extract only return-relevant fields (items, purchase date, return window, status) from each existing\norder response, removing verbose details ✅ Correct.\nThis preserves the information needed for the current task while significantly reducing context bloat before\nadditional lookups.\nC. Have the model generate a natural language summary of each order's key details, replacing structured\nresponses with prose descriptions ❌ Incorrect.\nNatural language summaries are less compact and may omit structured details needed for accurate return\nhandling.\nD. Proceed with additional lookups without modifying the existing tool output context ❌ Incorrect.\nThis worsens context crowding and increases the risk of degraded performance."}, {"n": 61, "q": "During a billing dispute resolution, your agent successfully retrieves customer info via get_customer and order\ndetails via lookup_order, but when attempting to call process_refund, the tool returns a timeout error. The agent\nhas enough information to explain the charges and verify refund eligibility, but cannot actually process the refund\ndue to the backend failure. What approach best balances first-contact resolution with appropriate error handling?", "o": [{"k": "A", "v": "Confirm the refund will be processed and close the conversation, since the system has all necessary\ninformation to complete it automatically"}, {"k": "B", "v": "Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate\nprocessing, and offer escalation or retry later"}, {"k": "C", "v": "Escalate immediately to a human agent since the refund action cannot be completed"}, {"k": "D", "v": "Implement automatic retries with exponential backoff for process_refund, keeping the conversation open\nuntil the refund is successfully processed"}], "a": "B", "e": "A. Confirm the refund will be processed and close the conversation, since the system has all necessary\ninformation to complete it automatically ❌ Incorrect.\nThe refund was not actually processed. Confirming success would be inaccurate and misleading.\nB. Explain the billing, confirm refund eligibility, acknowledge the system issue preventing immediate\nprocessing, and offer escalation or retry later ✅ Correct.\nThis maximizes first-contact value by resolving what can be resolved, while transparently handling the\nbackend failure.\nC. Escalate immediately to a human agent since the refund action cannot be completed ❌ Incorrect.\nEscalation may be unnecessary if the issue is temporary and the agent can still provide useful assistance.\nD. Implement automatic retries with exponential backoff for process_refund, keeping the conversation\nopen until the refund is successfully processed ❌ Incorrect.\nRetries are useful for transient failures, but indefinitely blocking the conversation creates poor user\nexperience and doesn’t guarantee success."}, {"n": 62, "q": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute\ninvolves a promotional pricing error requiring manager approval—beyond the agent's authorization level. How\nshould the workflow handle this mid-process escalation?", "o": [{"k": "A", "v": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with\na reference I"}, {"k": "D", "v": "Compile a structured handoff with customer details, order info, and the identified issue before calling\nescalate_to_human."}, {"k": "B", "v": "Call escalate_to_human passing only the customer's original message."}, {"k": "C", "v": "Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction."}], "a": "D", "e": "A. Persist the complete conversation and tool response history to a database, then call escalate_to_human\nwith a reference ID. ❌ Incorrect.\nUseful operationally, but the human agent still needs a concise, actionable summary rather than raw logs\nalone.\nB. Call escalate_to_human passing only the customer's original message. ❌ Incorrect.\nThis loses the investigation work already completed and forces the human agent to repeat steps.\nC. Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.\n❌ Incorrect.\nThis violates authorization boundaries and business policy.\nD. Compile a structured handoff with customer details, order info, and the identified issue before calling\nescalate_to_human. ✅ Correct.\nA structured handoff preserves context, reduces repetition, and enables efficient continuation by the human\nagent."}, {"n": 63, "q": "Production logs reveal inconsistent error handling: when lookup_order fails, the agent sometimes retries 5+ times\n(wasteful when the order ID doesn't exist), sometimes escalates immediately (premature for temporary network\nissues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error).\nInvestigation shows your MCP tool returns uniform error responses: \"isError\": true, \"content\": [ \"type\": \"text\",\n\"text\": \"Operation failed\" ] . The agent cannot distinguish between error types. What's the most effective\nimprovement?", "o": [{"k": "A", "v": "Enhance error responses with structured metadata: include errorCategory (transient/validation/permission),\nisRetryable boolean, and a description of what caused the failure."}, {"k": "B", "v": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only\nafter retries are exhausted."}, {"k": "C", "v": "Add few-shot examples to the system prompt demonstrating how to interpret error message patterns and\nselect appropriate responses for each."}, {"k": "D", "v": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and\nrecommended action."}], "a": "A", "e": "A. Enhance error responses with structured metadata: include errorCategory\n(transient/validation/permission), isRetryable boolean, and a description of what caused the failure. ✅\nCorrect.\nStructured error metadata gives the agent clear signals for deciding whether to retry, escalate, or ask the\nuser for clarification, leading to consistent and appropriate handling.\nB. Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent\nonly after retries are exhausted. ❌ Incorrect.\nRetrying all errors wastes resources and still doesn’t help the agent distinguish permanent failures like\nvalidation or permission errors.\nC. Add few-shot examples to the system prompt demonstrating how to interpret error message patterns\nand select appropriate responses for each. ❌ Incorrect.\nParsing generic text errors is brittle and unreliable compared to explicit structured metadata.\nD. Create an analyze_error MCP tool the agent calls after any failure to determine the error category and\nrecommended action. ❌ Incorrect.\nThis adds unnecessary complexity and extra tool calls when the information should already be present in the\noriginal error response."}, {"n": 64, "q": "A customer raises three separate issues during one session: a refund inquiry (turns 1-15), a subscription question\n(turns 16-30), and a payment method update (turns 31-45). At turn 48, the customer asks \"What happened with my\nrefund?\" The conversation is approaching context limits. What strategy best maintains the agent's ability to\naddress all issues throughout the session?", "o": [{"k": "A", "v": "Implement sliding window context that retains the most recent 30 turns."}, {"k": "B", "v": "Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer."}, {"k": "C", "v": "Rely on MCP tools to re-fetch relevant information on demand when the customer references earller issues."}, {"k": "D", "v": "Summarize earlier turns into a narrative description, preserving full message history only for the active issue."}], "a": "B", "e": "A. Implement sliding window context that retains the most recent 30 turns. ❌ Incorrect.\nThis would likely drop the earlier refund discussion entirely, preventing accurate follow-up handling.\nB. Extract and persist structured issue data (order IDs, amounts, statuses) into a separate context layer. ✅\nCorrect.\nStructured persistence preserves critical state across multiple concurrent issues while minimizing context\nusage and enabling reliable recall later in the session.\nC. Rely on MCP tools to re-fetch relevant information on demand when the customer references earlier\nissues. ❌ Incorrect.\nTools can retrieve system data, but not the conversational context, decisions, or prior explanations from\nearlier turns.\nD. Summarize earlier turns into a narrative description, preserving full message history only for the active\nissue. ❌ Incorrect.\nNarrative summaries may omit important structured details needed to accurately resume earlier issues."}, {"n": 65, "q": "Your update_user_profile tool accepts a user_id (required) and an optional fields_to_update object. In testing,\nClaude frequently omits user_id or passes incorrectly structured data. What is most critical for helping Claude\nunderstand what parameter values to provide?", "o": [{"k": "A", "v": "Clear parameter descriptions explaining expected format, such as \"user_id : UUID of the user to update\n(required)\""}, {"k": "B", "v": "Verbose parameter names encoding format hints, such as user_id_string_uuid_format"}, {"k": "C", "v": "Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an object\ntype"}, {"k": "D", "v": "Detailed error responses explaining why invalid parameter values were rejected"}], "a": "A", "e": "A. Clear parameter descriptions explaining expected format, such as \"user_id: UUID of the user to update\n(required)\" ✅ Correct.\nClear, human-readable descriptions are the most important guidance for helping Claude understand what\nvalues to provide and how parameters should be structured.\nB. Verbose parameter names encoding format hints, such as user_id_string_uuid_format ❌ Incorrect.\nOverly verbose names reduce readability and are less effective than proper descriptions.\nC. Strict JSON Schema type constraints marking user_id as required and defining fields_to_update as an\nobject type ❌ Incorrect.\nSchema constraints help validation, but they don’t sufficiently explain semantic expectations like the required\nUUID format.\nD. Detailed error responses explaining why invalid parameter values were rejected ❌ Incorrect.\nHelpful after failure, but not the most critical factor for preventing mistakes initially."}, {"n": 66, "q": "Production monitoring shows your search_catalog tool fails 12% of the time: 8% are network timeouts that\nsucceed when immediately retried, while 4% are query syntax errors from malformed user-provided filters that\nnever succeed regardless of retry attempts. Currently, both error types are returned to the agent identically,\ncausing it to waste turns retrying syntax errors and telling users to \"try again later\" for timeouts. How should you\nmodify the tool's error handling?", "o": [{"k": "A", "v": "Apply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily\nunavailable\" message after max retries are exhausted."}, {"k": "B", "v": "Return all errors with a retryable boolean flag and error type details."}, {"k": "C", "v": "Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors\nimmediately with parameter validation details."}, {"k": "D", "v": "Add few-shot examples to your system prompt demonstrating how to distinguish network errors from syntax\nerrors and handle each case appropriately."}], "a": "C", "e": "A. Apply exponential backoff retry logic to all errors uniformly, returning a generic \"service temporarily\nunavailable\" message after max retries are exhausted. ❌ Incorrect.\nThis wastes retries on non-recoverable syntax errors and hides useful diagnostic information from the agent.\nB. Return all errors with a retryable boolean flag and error type details. ❌ Incorrect.\nThis improves clarity, but still pushes retry logic to the agent, which leads to inconsistent handling and wasted\nturns.\nC. Implement automatic retry with backoff for network timeouts inside the tool; return syntax errors\nimmediately with parameter validation details. ✅ Correct.\nThis cleanly separates responsibilities:\nTool handles transient failures (timeouts)\nTool immediately exposes non-retryable syntax errors with actionable feedback\nThis prevents wasted retries and improves user-facing behavior.\nD. Add few-shot examples to your system prompt demonstrating how to distinguish network errors from\nsyntax errors and handle each case appropriately. ❌ Incorrect.\nPrompt-based reasoning is unreliable for error handling compared to explicit tool-level logic separation."}, {"n": 67, "q": "Users frequently send ambiguous requests like \"book a venue for the party\" without specifying date, guest count,\nor budget. Your evaluation shows the assistant asks an average of 4.2 clarifying questions before taking any\naction, causing 35% of users to abandon mid-conversation. However, when you reduce questions, users sometimes\nreceive recommendations that don't match their preferences. What's the most effective approach to improve this\ntrade-off?", "o": [{"k": "A", "v": "Instruct the assistant to state explicit assumptions based on conversation history, proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only for irreversible actions like\nconfirming bookings."}, {"k": "B", "v": "Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend, moderate\nbudget) without explicitly stating these assumptions, allowing users to provide corrections if results don't\nmatch expectations."}, {"k": "C", "v": "Implement a structured intake form that collects all required parameters (date, guest count, budget, venue\ntype) upfront before the assistant begins providing any recommendations."}, {"k": "D", "v": "Configure the assistant to consolidate all clarifying questions into a single compound question (e.g., \"What\ndate, guest count, and budget are you considering?\") to reduce the total number of conversational turns."}], "a": "D", "e": "A. Instruct the assistant to state explicit assumptions based on conversation history, proceed with\nrecommendations while inviting corrections, and reserve clarifying questions only for irreversible actions\nlike confirming bookings. ❌ Incorrect.\nThis improves transparency, but it still relies on assumptions that may not fully align with user intent, leading\nto partial mismatches.\nB. Configure the assistant to proceed with reasonable defaults (medium-sized venue, next weekend,\nmoderate budget) without explicitly stating these assumptions, allowing users to provide corrections if\nresults don't match expectations. ❌ Incorrect.\nHidden defaults can reduce trust and lead to user confusion when outputs don’t match expectations.\nC. Implement a structured intake form that collects all required parameters (date, guest count, budget,\nvenue type) upfront before the assistant begins providing any recommendations. ❌ Incorrect.\nThis ensures accuracy but introduces too much friction early in the flow, increasing drop-off.\nD. Configure the assistant to consolidate all clarifying questions into a single compound question (e.g.,\n\"What date, guest count, and budget are you considering?\") to reduce the total number of conversational\nturns. ✅ Correct.\nThis reduces user fatigue while still explicitly capturing required constraints, improving both completion rates\nand recommendation accuracy without over-questioning."}, {"n": 68, "q": "Your document extraction tool uses ML models to extract invoice fields (vendor, amount, date). The models return\nconfidence scores (0.0-1.0) for each extracted field. In production, you observe:\n(1) the agent proceeds with low-confidence extractions that are incorrect 23% of the time, and (2) the agent\nrequests unnecessary human review for 31% of extractions that were actually correct. How should you restructure\nthe tool's output?", "o": [{"k": "A", "v": "Return fields with their raw confidence scores and add detailed few-shot examples to your system prompt\ndemonstrating how to interpret different confidence ranges and when to request human review."}, {"k": "B", "v": "Compute an aggregate extraction quality score across all fields and return it alongside the extracted values.\nInclude a text summary describing the overall extraction reliability."}, {"k": "C", "v": "Return fields with confidence scores, plus a requires_review boolean computed using your tested confidence\nthresholds, along with a review_reasons array explaining which fields triggered review."}, {"k": "D", "v": "Return fields organized into verified and needs_verification objects based on confidence thresholds."}], "a": "C", "e": "A. Return fields with their raw confidence scores and add detailed few-shot examples to your system\nprompt demonstrating how to interpret different confidence ranges and when to request human review. ❌\nIncorrect.\nThis still leaves the decision logic ambiguous and pushes critical operational behavior into prompt\ninterpretation, which is inconsistent and hard to control in production.\nB. Compute an aggregate extraction quality score across all fields and return it alongside the extracted\nvalues. Include a text summary describing the overall extraction reliability. ❌ Incorrect.\nA single aggregate score hides per-field uncertainty, which is exactly what is needed to avoid both false\napprovals and unnecessary reviews.\nC. Return fields with confidence scores, plus a requires_review boolean computed using your tested\nconfidence thresholds, along with a review_reasons array explaining which fields triggered review. ✅\nCorrect.\nThis directly encodes decision logic into structured output, ensuring consistent behavior while still preserving\nexplainability at the field level.\nD. Return fields organized into verified and needs_verification objects based on confidence thresholds. ❌\nIncorrect.\nThis improves structure, but it hides the underlying confidence signals and reduces flexibility for downstream\nsystems that may need finer-grained control or auditability."}, {"n": 69, "q": "Your agent includes an update_game_score tool that accepts game_date (string), home_team (string), and\naway_team (string) parameters. Production logs reveal recurring issues: the agent uses team nicknames instead of\nofficial names, applies inconsistent date formats, and selects the wrong game when teams have rematches in the\nsame season. What tool interface change would effectively prevent these errors?", "o": [{"k": "A", "v": "Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns the\nresolved game details for the agent to verify before the score is committed."}, {"k": "B", "v": "Add detailed examples to the tool description showing the required date format and complete list of official\nteam names."}, {"k": "C", "v": "Add enum constraints listing valid team names for both team parameters, and add a regex pattern enforcing\nISO 8601 format for the date parameter."}, {"k": "D", "v": "Replace the three parameters with a single game_id parameter and a separate search_games lookup tool\nthat returns matching game IDs."}], "a": "D", "e": "A. Add a season parameter to disambiguate rematches, and add a confirm_before_update flag that returns\nthe resolved game details for the agent to verify before the score is committed. ❌ Incorrect.\nThis improves safety via confirmation, but it still leaves ambiguity in identifying the correct game as a core\nissue.\nB. Add detailed examples to the tool description showing the required date format and complete list of\nofficial team names. ❌ Incorrect.\nExamples help, but they don’t reliably prevent structural errors like wrong team identity or ambiguous match\nselection.\nC. Add enum constraints listing valid team names for both team parameters, and add a regex pattern\nenforcing ISO 8601 format for the date parameter. ❌ Incorrect.\nThis improves input validation, but it still does not solve the deeper problem of disambiguating multiple\ngames between the same teams.\nD. Replace the three parameters with a single game_id parameter and a separate search_games lookup\ntool that returns matching game IDs. ✅ Correct.\nThis removes ambiguity entirely by forcing the agent to resolve the exact entity first, then operate on a unique\nidentifier, eliminating nickname errors, date mismatches, and rematch confusion."}, {"n": 70, "q": "Your resource allocation tool returns a simple acknowledgment message after provisioning is requested. Users\nfrequently approve allocations and immediately ask \"how much did that cost?\" or \"which project was that?\" -\nindicating they confirmed without understanding the request. What tool design change would most effectively\naddress this?", "o": [{"k": "A", "v": "Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to only\nset it after the user explicitly confirms they reviewed the details"}, {"k": "B", "v": "Implement a 60-second hold before execution completes, allowing users time to review pending allocations\nand cancel if needed"}, {"k": "C", "v": "Add a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much context the\nagent presents in confirmations"}, {"k": "D", "v": "Return structured data including cost estimate, target project, resource specifications, and impact summary\nin the tool response"}], "a": "D", "e": "A. Add a user_acknowledged: boolean parameter that must be set true, with instructions for the agent to\nonly set it after the user explicitly confirms they reviewed the details ❌ Incorrect.\nThis relies on agent discipline and is easy to bypass or mis-handle; it doesn’t guarantee users actually see or\nunderstand key details.\nB. Implement a 60-second hold before execution completes, allowing users time to review pending\nallocations and cancel if needed ❌ Incorrect.\nDelays alone don’t improve understanding; they only slow execution and may frustrate users without ensuring\ninformed approval.\nC. Add a detail_level parameter with options \"minimal\" or \"comprehensive\" that controls how much\ncontext the agent presents in confirmations ❌ Incorrect.\nThis improves formatting flexibility but does not ensure critical cost and impact information is consistently\nsurfaced before approval.\nD. Return structured data including cost estimate, target project, resource specifications, and impact\nsummary in the tool response ✅ Correct.\nThis ensures that every allocation includes explicit, structured, reviewable details, reducing uninformed\napprovals and enabling users to understand cost and impact before proceeding."}, {"n": 71, "q": "Your conversation history includes two types of content: persistent story elements (character backgrounds, plot\nstructure, world rules) that must remain consistent throughout, and extensive brainstorming discussion that's\nmostly ephemeral. After 40+ turns, you're hitting context limits and users report the assistant \"forgets\"\nestablished character traits, breaking narrative consistency.\nWhich approach best ensures persistent story elements remain available to the model while reclaiming context\nspace?", "o": [{"k": "A", "v": "Separate persistent story elements into a retained \"story bible\" section at context start, applying trimming\nor summarization only to brainstorming discussion."}, {"k": "B", "v": "Store all history in a vector database and retrieve semantically similar passages for each new message,\nreplacing conversation history with retrieved chunks."}, {"k": "C", "v": "Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer earlier\ncontext from recent discussion flow."}, {"k": "D", "v": "Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full\nhistory to free up tokens."}], "a": "A", "e": "A. Separate persistent story elements into a retained \"story bible\" section at context start, applying\ntrimming or summarization only to brainstorming discussion. ✅ Correct.\nThis directly solves the problem by preserving high-value, invariant narrative constraints (characters, rules,\ncanon) while allowing lower-value conversational content to be compressed. It maintains continuity without\nlosing essential story logic.\nB. Store all history in a vector database and retrieve semantically similar passages for each new message,\nreplacing conversation history with retrieved chunks. ❌ Incorrect.\nThis risks missing globally important story rules because retrieval is similarity-based, not constraint-aware.\nCore canon details may not always be retrieved.\nC. Apply a sliding-window approach keeping only the most recent 25 turns, relying on the model to infer\nearlier context from recent discussion flow. ❌ Incorrect.\nThis will almost certainly break long-range consistency, since key character and world rules will be dropped.\nD. Summarize the entire conversation history into a condensed synopsis every 20 turns, replacing the full\nhistory to free up tokens. ❌ Incorrect.\nGeneral summarization tends to lose fine-grained canonical details, which are exactly what must remain\nstable for narrative consistency."}, {"n": 72, "q": "Your conversational assistant frequently generates multiple clarifying questions when users make ambiguous\nrequests. When a user asks \"Can you help me with the report?\", the assistant responds: \"I'd be happy to help!\nCould you tell me: 1) Which report? 2) What kind of help—drafting, reviewing, or formatting? 3) What's your\ndeadline?\" User analytics show a 40% conversation abandonment rate after these multi-question responses.\nWhat's the most effective way to reduce friction while appropriately handling ambiguity?", "o": [{"k": "A", "v": "Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers over\nmultiple exchanges rather than requesting everything upfront."}, {"k": "B", "v": "Modify the system prompt to instruct the assistant to make reasonable assumptions from available context,\nstate those assumptions explicitly, and offer to adjust if the interpretation is wrong."}, {"k": "C", "v": "Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing high-\nambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant."}, {"k": "D", "v": "Create a lookup table of common request
