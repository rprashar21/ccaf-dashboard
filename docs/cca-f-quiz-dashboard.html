tching bugs, while the developer's request was too\ngeneral"}, {"k": "C", "v": "Claude retains context about its prior reasoning in the session, making it less likely to question its own\ndecisions"}, {"k": "D", "v": "The extended session length caused the context window to fill with conversation history, leaving less room\nfor thorough analysis"}], "a": "C", "e": "C. Claude retains context about its prior reasoning in the session, making it less likely to question its own\ndecisions. ✅ Correct\nWhy C is correct:\nWhen Claude reviews code in the same session where it created or refactored the code, it retains its earlier\nreasoning and assumptions. This can lead to confirmation bias, making it less likely to critically re-evaluate its\nown changes. A fresh CI review starts with no prior attachment to those decisions and may identify issues that\nthe same-session review misses.\nA. The CI environment has access to the full codebase context while the local session only sees the current\nfile ❌ Incorrect\nLocal sessions can also access the codebase using file-reading and navigation tools; this is not the primary\nreason for the discrepancy.\nB. The CI review uses a more specific prompt tailored for catching bugs, while the developer's request was\ntoo general ❌ Incorrect\nPrompt quality can affect results, but the key issue described is reviewing code within the same session that\ngenerated it.\nD. The extended session length caused the context window to fill with conversation history, leaving less\nroom for thorough analysis ❌ Incorrect\nLong conversations may affect context management, but this is not the main explanation for missing bugs\nthat a fresh review catches."}, {"n": 140, "q": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic\ncorrectness. Your evaluation suite shows strong recall for API design findings (82%) but poor recall for business\nlogic edge cases in quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall\nimproves to 41% but API design recall drops to 68%. How should you address this trade-off to improve detection\nacross both categories?", "o": [{"k": "A", "v": "Split the review into separate focused prompts — one for security and API design, another for business logic\n— each with dedicated examples, then consolidate findings before posting."}, {"k": "B", "v": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as\ndivision-by-zero In score calculations and boundary conditions in grading thresholds."}, {"k": "C", "v": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single\nprompt and eliminate the recall trade-off."}], "a": "A", "e": "A. Split the review into separate focused prompts — one for security and API design, another for business\nlogic — each with dedicated examples, then consolidate findings before posting. ✅ Correct\nWhy A is correct:\nCombining multiple review objectives in a single prompt creates context competition, where adding examples\nfor one category can reduce performance in another. Separate, focused prompts allow each review type to\nhave its own instructions and examples, improving recall across categories without sacrificing performance.\nB. Replace the few-shot examples with a detailed checklist of specific logic edge cases ❌ Incorrect\nA checklist may help business logic detection but still forces multiple concerns into one prompt and does not\neliminate the trade-off.\nC. Upgrade to a more capable model tier ❌ Incorrect\nA stronger model may improve overall performance, but it does not guarantee removal of prompt interference\nbetween different review objectives."}, {"n": 141, "q": "Your codebase exploration tool stores session IDs to allow engineers to continue investigations across work\nsessions. An engineer spent an hour yesterday analyzing a legacy authentication module, building context about\nits architecture and dependencies. They want to continue today. The session ID is valid, but version control shows 3\nof the 12 files the agent previously read were modified overnight by a teammate's merge. What approach best\nbalances efficiency and accuracy?", "o": [{"k": "A", "v": "Resume the session and immediately have the agent re-read all 12 previously analyzed files to ensure\ncomplete alignment."}, {"k": "B", "v": "Resume the session without informing the agent about the changed files, allowing it to naturally detect\ndiscrepancies during execution."}, {"k": "C", "v": "Resume the session and inform the agent which specific files changed for targeted re-analysis while\nretaining context on the unchanged files."}, {"k": "D", "v": "Start a fresh session to ensure the agent works with current codebase state without stale assumptions from\nthe previous day."}], "a": "C", "e": "C. Resume the session and inform the agent which specific files changed for targeted re-analysis while\nretaining context on the unchanged files. ✅ Correct\nWhy C is correct:\nThis approach preserves the valuable context built during the previous session while ensuring accuracy by re-\nanalyzing only the files that changed. It balances efficiency and correctness by avoiding unnecessary re-\nreading of unchanged files and preventing stale assumptions.\nA. Resume the session and immediately have the agent re-read all 12 previously analyzed files to ensure\ncomplete alignment. ❌ Incorrect\nEnsures freshness but is inefficient because nine files remain unchanged.\nB. Resume the session without informing the agent about the changed files, allowing it to naturally detect\ndiscrepancies during execution. ❌ Incorrect\nRisks relying on outdated assumptions and missing the impact of recent changes.\nD. Start a fresh session to ensure the agent works with current codebase state without stale assumptions\nfrom the previous day.❌ Incorrect\nGuarantees fresh context but discards an hour of useful analysis and is unnecessarily inefficient."}, {"n": 142, "q": "An engineer sees an unfamiliar error message \"SYNC_CONFLICT: entity version mismatch detected\" in production\nlogs but doesn't know which of the 12 services in the codebase generates it. They ask the agent to help locate the\nsource code. What exploration approach will most efficiently find the responsible code?", "o": [{"k": "A", "v": "Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity version\nmismatch\"), then Read the matching files to understand context."}, {"k": "B", "v": "Use Glob to find files in directories commonly associated with error handling (such as errors/, exceptions/, or\nhandlers/) across services, then Read each matching file."}, {"k": "C", "v": "Use Grep to find all files that import the project's error handling module, then Read those files to locate\ncustom error definitions."}, {"k": "D", "v": "Read the project's README and service configuration files to understand the architecture, then\nsystematically Read source files in service directory."}], "a": "A", "e": "A. Use Grep to search for distinctive text from the error message (like \"SYNC_CONFLICT\" or \"entity\nversion mismatch\"), then Read the matching files to understand context. ✅ Correct\nWhy A is correct:\nSearching for unique strings in the error message is the fastest and most direct way to locate the source code\nthat generates the error. Grep quickly identifies matching files, and Read provides the surrounding context to\ndetermine which service is responsible.\nB. Use Glob to find files in error-related directories ❌ Incorrect\nError messages may not be defined in dedicated error directories, making this approach inefficient and\nincomplete.\nC. Use Grep to find all files that import the project's error handling module ❌ Incorrect\nMany files may import the error module, creating numerous irrelevant matches and increasing investigation\ntime.\nD. Read the project's README and service configuration files ❌ Incorrect\nProvides architectural context but is a slow, indirect approach for locating a specific error message."}, {"n": 143, "q": "You've configured your Claude agent with three MCP servers: one for git operations, one for Jira ticket\nmanagement, and one for documentation search. When a user asks the agent to \"create a branch for JIRA-123 and\nadd documentation links to the ticket,\" how does the agent access tools across these servers?", "o": [{"k": "A", "v": "The agent queries each server sequentially to determine which handles each tool, routing calls based on tool\nname prefixes."}, {"k": "B", "v": "Tools from all configured MCP servers are discovered at connection time and available simultaneously to the\nagent."}, {"k": "C", "v": "You must specify which MCP server to use for each turn, and the agent can only access one server's tools at\na time."}, {"k": "D", "v": "The agent automatically selects the most relevant server based on the request and loads only that server's\ntools."}], "a": "B", "e": "B. Tools from all configured MCP servers are discovered at connection time and available simultaneously to\nthe agent. ✅ Correct\nWhy B is correct:\nWhen multiple MCP servers are configured, the agent discovers and loads tools from all connected servers\nduring initialization. It can then use tools across servers in a single request—for example, using the Git server\nto create a branch, the Jira server to update the ticket, and the Documentation server to retrieve links.\nA. The agent queries each server sequentially ❌ Incorrect\nThe agent does not probe servers one by one for every request or rely on tool name prefixes.\nC. You must specify which MCP server to use for each turn ❌ Incorrect\nThe agent can access tools from multiple servers simultaneously and does not require manual server\nselection per turn.\nD. The agent automatically selects one server and loads only that server's tools ❌ Incorrect\nTools from all configured servers remain available; the agent is not limited to a single server per request."}, {"n": 144, "q": "Compliance requires that refunds exceeding $500 must automatically escalate to a human agent-this rule cannot\nbe left to model discretio Despite clear system prompt instructions, production logs show the agent occasionally\nprocesses high-value refunds directly (3% failure rate) How should you achieve guaranteed compliance?", "o": [{"k": "A", "v": "Modify the refund tool to return an error with message \"Amount exceeds policy limit please escalate\" when\nthreshold is exceeded."}, {"k": "B", "v": "Implement a hook to intercept tool calls when the refund process amount exceeds $500, block it and invoke\nhuman escalation."}, {"k": "C", "v": "Strengthen the system prompt with emphatic language: \"CRITICAL POLICY! Refunds over $500 MUST\ntrigger human escalation. NEVER process these directly!\""}, {"k": "D", "v": "Add few-shot examples to the prompt showing correct escalation behavior at various refund amounts ($40,\n$500, $600)."}], "a": "B", "e": "B. Implement a hook to intercept tool calls when the refund process amount exceeds $500, block it and\ninvoke human escalation. ✅ Correct\nWhy B is correct:\nCompliance requirements need deterministic enforcement, not model judgment. A hook that intercepts\nrefund tool calls and blocks any refund over $500 guarantees that prohibited actions cannot occur and\nautomatically triggers human escalation.\nA. Modify the refund tool to return an error message ❌ Incorrect\nAn error message depends on the model interpreting and handling it correctly and does not provide\nguaranteed enforcement.\nC. Strengthen the system prompt ❌ Incorrect\nPrompts improve behavior but cannot guarantee 100% compliance, as shown by the existing 3% failure rate.\nD. Add few-shot examples ❌ Incorrect\nExamples may improve adherence but remain probabilistic and cannot enforce a hard compliance rule."}, {"n": 145, "q": "Production logs reveal inconsistent error handling: when tool_code fails, the agent sometimes retries 5 times (even\nif the tool_id doesn't exist), sometimes escalates immediately (premature for temporary network issues), and\nsometimes adds user-friendly explanation (inappropriate when the issue is a backend permission error).\nInvestigation shows four MCP tool returns uniform error responses: \"status\": \"error\", \"content\": \" \"type\": \"Error\",\n\"message\": \"Operation failed.\" \" . The agent learns different types.\nWhat's the most effective improvement?", "o": [{"k": "A", "v": "Implement retry logic with exponential backoff in your MCP server for all errors, returning to the agent only\nafter retries are exhausted."}, {"k": "B", "v": "Create an analyze_error MCP tool the agent calls after any failure to determine the error category and\nrecommended action."}, {"k": "C", "v": "Add a few-shot examples to the system prompt demonstrating how to interpret error message patterns and\nselect appropriate responses for each."}, {"k": "D", "v": "Enhance error responses with structured metadata. Include error_category (transient/retriable/permission),\nreason, and a description of what caused the failure."}], "a": "D", "e": "D. Enhance error responses with structured metadata. Include error_category\n(transient/retriable/permission), reason, and a description of what caused the failure. ✅ Correct\nWhy D is correct:\nThe current error responses are generic (\"Operation failed.\"), giving the agent no information to distinguish\nbetween transient network issues, invalid tool IDs, or permission errors. Structured metadata enables the\nagent to take the appropriate action—retry, escalate, or inform the user—consistently and correctly.\nA. Implement retry logic with exponential backoff for all errors ❌ Incorrect\nNot all errors are retriable. Retrying permission or invalid-tool errors wastes time and can worsen behavior.\nB. Create an analyze_error MCP tool ❌ Incorrect\nAdds extra complexity and latency. The root problem is that the original errors lack sufficient information.\nC. Add few-shot examples to the system prompt ❌ Incorrect\nExamples cannot reliably infer error types from identical, generic error messages."}, {"n": 146, "q": "Production logs reveal inconsistent error handling. When looking up facts, the agent sometimes retries 5+ times\n(sadly, when the outer ID doesn't exist), sometimes escalates immediately (prematurely for temporary network\nissues), and sometimes asks users for clarification (inappropriate when the issue is a backend permission error).\nInvestigation shows your MCP tool returns uniform error responses (\"isError\": true, \"context\": \"type\": \"text\", \"text\":\n\"Operation failed.\" ). The agent cannot distinguish between error types.\nWhat's the most effective improvement?", "o": [{"k": "A", "v": "Implement retry logic with exponential backoff in your MCP service for all errors returning to the agent only\nafter retries are exhausted."}, {"k": "B", "v": "Create an analyze_error MCP tool that the agent calls after any failure to determine the error category and\nrecommended action."}, {"k": "C", "v": "Add ten shot examples to the system's conduct_demo training to interpret error message context and select\nappropriate responses for each."}, {"k": "D", "v": "Return structured error metadata in MCP responses."}], "a": "D", "e": "D. Return structured error metadata in MCP responses. ✅ Correct\nWhy D is correct:\nThe agent receives the same generic error (\"Operation failed.\") for every failure, so it cannot determine whether\nit should retry, escalate, or inform the user. Returning structured metadata (for example, error_category,\nreason, retriable, and permission_denied) enables consistent and appropriate error handling.\nA. Implement retry logic with exponential backoff for all errors ❌ Incorrect\nNot all errors are retriable. Retrying invalid IDs or permission errors wastes time and may cause repeated\nfailures.\nB. Create an analyze_error MCP tool ❌ Incorrect\nAdds extra complexity and latency. The root issue is insufficient information in the original error response.\nC. Add ten-shot examples to training ❌ Incorrect\nExamples cannot reliably infer different error types from identical, generic error messages."}, {"n": 147, "q": "After expanding the agent's MCP tools with delivery-specific capabilities [apply_promo_code,\nupdate_delivery_address, reconcile_delivery], the total tool count has grown from 1 to 7. We have observed that\nthe agent now shows tool selection accuracy has dropped from 86% to 71%. Log analysis reveals the majority of\nerrors involve the agent selecting between semantically overlapping tools — calling issue_credit when\nprocess_refund was correct, and calling check_delivery_status when looking\norder_allready_returns_the_needed_data. Which approach structurally eliminate the semantic overlap identified in\nthe error source?", "o": [{"k": "A", "v": "Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single\nhandle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an\noptional include_tracking flag."}, {"k": "B", "v": "Enable the tool search tool with defer_loading on the six new tools, keeping the original two always loaded,\nso the agent dynamically discovers specialized tools only when needed."}, {"k": "C", "v": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool, such\nas showing when issue_credit applies versus when process_refund is appropriate."}, {"k": "D", "v": "Split the tools across two sub-agents — a 'financial resolution' agent with issue_credit, process_refund,\nreturn_order, and apply_promo_code and a 'delivery operations' agent with the remaining delivery tools — with\na coordinating routing between them."}], "a": "A", "e": "A. Consolidate semantically overlapping tools – merge issue_credit and process_refund into a single\nhandle_promotions tool with an action parameter and fold check_delivery_status into lookup_order with an\noptional include_tracking flag. ✅ Correct\nWhy A is correct:\nThe primary issue is semantic overlap between tools. When multiple tools perform similar functions or return\noverlapping information, the agent struggles to choose correctly. Consolidating overlapping tools into unified\ninterfaces removes ambiguity and structurally improves tool selection accuracy.\nB. Enable tool search with defer_loading ❌ Incorrect\nReduces the number of simultaneously loaded tools but does not eliminate the underlying semantic overlap.\nC. Add few-shot examples ❌ Incorrect\nExamples may improve selection temporarily, but they do not address the root cause of overlapping tool\ncapabilities.\nD. Split tools across two sub-agents ❌ Incorrect\nDomain separation can help organization, but overlap still exists within domains (for example, issue_credit vs.\nprocess_refund), so ambiguity remains."}, {"n": 148, "q": "You're implementing the escalation logic for when the agent should call a human. Your team processes for\ndifferent approaches for triggering escalation. Which approach will most reliably identify cases that genuinely\nrequire human intervention?", "o": [{"k": "A", "v": "Instruct the agent to escalate when the customer requests a human. When the issue requires policy\nexceptions, or the agent can not make meaningful progress."}, {"k": "B", "v": "Configure the agent to escalate after three consecutive tools fails to resolve the customer's stated issue,\nensuring a reasonable attempt before involving a human."}, {"k": "C", "v": "Build a rules engine that maps specific issue types, customer segments and product categories to escalation\ndecisions, removing the need for model judgment calls."}, {"k": "D", "v": "Implement sentiment analysis that monitors for frustration indicators (e.g., all-caps, repeated questions,\nexclamations) and trigger escalation when the frustration score exceeds a configured threshold."}], "a": "A", "e": "A. Instruct the agent to escalate when the customer requests a human, when the issue requires policy\nexceptions, or when the agent cannot make meaningful progress. ✅ Correct\nWhy A is correct:\nThis approach directly identifies situations that genuinely require human intervention. It covers customer\npreference, requests that need policy exceptions or discretionary decisions, and cases where the agent is\nunable to make meaningful progress. It provides a balanced and reliable escalation strategy.\nB. Configure the agent to escalate after three consecutive tool failures ❌ Incorrect\nTool failures do not always mean a human is needed, and some cases require immediate escalation without\nwaiting for multiple failures.\nC. Build a rules engine that maps issue types, customer segments, and product categories to escalation\ndecisions ❌ Incorrect\nA rigid rules engine is difficult to maintain and cannot capture all situations that require human judgment or\ncustomer preference.\nD. Implement sentiment analysis that triggers escalation based on frustration indicators ❌ Incorrect\nFrustration may indicate dissatisfaction, but it is not a reliable indicator that human intervention is necessary.\nThank you\nThank you for being so interested in the premium exam material.\nI'm glad to hear that you found it informative and helpful.\nIf you have any feedback or thoughts on the bumps, I would love to hear them.\nYour insights can help me improve our writing and better understand our readers.\nBest of Luck\nYou have worked hard to get to this point, and you are well-prepared for the exam\nKeep your head up, stay positive, and go show that exam what you're made of!\nFeedback More Papers\n148 Questions\nTotal:\nLink: https://certyiq.com/papers/anthropic/claude-certified-architect"}];

let order = QUESTIONS.map((q,i)=>i); // indices into QUESTIONS, current display order
let currentPos = 0; // position within `order` (or within filtered list)
let filter = 'all';
const state = {}; // key: q.n -> {selected: 'A', bookmarked: bool}
QUESTIONS.forEach(q => state[q.n] = {selected:null, bookmarked:false});

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function filteredIndices(){
  return order.filter(i => {
    const q = QUESTIONS[i];
    const s = state[q.n];
    if(filter==='all') return true;
    if(filter==='unanswered') return !s.selected;
    if(filter==='correct') return s.selected === q.a;
    if(filter==='incorrect') return s.selected && s.selected !== q.a;
    if(filter==='bookmarked') return s.bookmarked;
    return true;
  });
}

function stats(){
  let answered=0, correct=0;
  QUESTIONS.forEach(q=>{
    const s = state[q.n];
    if(s.selected){ answered++; if(s.selected===q.a) correct++; }
  });
  return {answered, correct, total: QUESTIONS.length};
}

function renderStats(){
  const {answered, correct, total} = stats();
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statAcc').textContent = answered ? Math.round(100*correct/answered)+'%' : '—';
  const incorrect = answered - correct;
  document.getElementById('pfGood').style.width = (100*correct/total)+'%';
  document.getElementById('pfBad').style.width = (100*incorrect/total)+'%';
}

function renderGrid(){
  const grid = document.getElementById('qgrid');
  grid.innerHTML = '';
  const fIdx = filteredIndices();
  document.getElementById('gridLabel').textContent = `Question map — showing ${fIdx.length} of ${QUESTIONS.length}`;
  fIdx.forEach((i)=>{
    const q = QUESTIONS[i];
    const s = state[q.n];
    const dot = document.createElement('div');
    let cls = 'qdot';
    if(s.selected){ cls += (s.selected===q.a) ? ' correct' : ' incorrect'; }
    if(i === order[currentPos]) cls += ' current';
    dot.className = cls;
    dot.textContent = q.n;
    dot.style.position='relative';
    if(s.bookmarked){
      const star = document.createElement('div');
      star.textContent='★';
      star.style.position='absolute'; star.style.top='-6px'; star.style.right='-4px';
      star.style.fontSize='9px'; star.style.color='var(--amber)';
      dot.appendChild(star);
    }
    dot.onclick = ()=>{ jumpToIndex(i); };
    grid.appendChild(dot);
  });
}

function jumpToIndex(i){
  const pos = order.indexOf(i);
  if(pos>=0){ currentPos = pos; renderCard(); renderGrid(); }
}

function currentFilteredList(){
  return filteredIndices();
}

function renderCard(){
  const host = document.getElementById('cardHost');
  const list = currentFilteredList();
  if(list.length===0){
    host.innerHTML = `<div class="card"><div class="empty-state"><div class="big">Nothing here</div>Try a different filter.</div></div>`;
    return;
  }
  // clamp currentPos to something visible in filtered list; find nearest index in `order`
  let idx = order[currentPos];
  if(!list.includes(idx)){
    idx = list[0];
    currentPos = order.indexOf(idx);
  }
  const q = QUESTIONS[idx];
  const s = state[q.n];
  const posInList = list.indexOf(idx);

  const optsHtml = q.o.map(opt=>{
    let cls = 'opt';
    let mark = '';
    if(s.selected){
      cls += ' locked';
      if(opt.k === q.a){ cls += ' reveal-correct'; mark = '✓ correct'; }
      if(opt.k === s.selected && s.selected !== q.a){ cls += ' selected-wrong'; mark = '✗ your pick'; }
    }
    return `<div class="opt ${cls}" data-k="${opt.k}">
      <span class="k">${opt.k}</span>
      <span>${escapeHtml(opt.v)}</span>
      ${mark ? `<span class="mark" style="color:${opt.k===q.a?'var(--good)':'var(--bad)'}">${mark}</span>` : ''}
    </div>`;
  }).join('');

  host.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="qnum">Q${q.n} <span style="color:var(--text-dim)">/ ${QUESTIONS.length}</span> &nbsp;·&nbsp; <span style="color:var(--text-dim)">viewing ${posInList+1} of ${list.length}</span></div>
        <button class="bookmark-toggle ${s.bookmarked?'on':''}" id="bmBtn">${s.bookmarked?'★':'☆'}</button>
      </div>
      <p class="stem">${escapeHtml(q.q)}</p>
      <div class="options" id="optsHost">${optsHtml}</div>
      <div class="explain ${s.selected?'show':''}" id="explainBox">
        <span class="et">Explanation</span>${escapeHtml(q.e)}
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" ${posInList<=0?'disabled':''}>← Prev</button>
        <div style="display:flex;gap:8px;">
          <button class="nav-btn" id="skipBtn">Skip</button>
          <button class="nav-btn primary" id="nextBtn" ${posInList>=list.length-1?'disabled':''}>Next →</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('bmBtn').onclick = ()=>{
    s.bookmarked = !s.bookmarked;
    renderCard(); renderGrid();
  };

  if(!s.selected){
    host.querySelectorAll('.opt').forEach(el=>{
      el.onclick = ()=>{
        s.selected = el.getAttribute('data-k');
        renderCard(); renderGrid(); renderStats();
      };
    });
  }

  document.getElementById('prevBtn').onclick = ()=>{
    const li = list.indexOf(idx);
    if(li>0){ currentPos = order.indexOf(list[li-1]); renderCard(); renderGrid(); }
  };
  document.getElementById('nextBtn').onclick = ()=>{
    const li = list.indexOf(idx);
    if(li<list.length-1){ currentPos = order.indexOf(list[li+1]); renderCard(); renderGrid(); }
  };
  document.getElementById('skipBtn').onclick = ()=>{
    const li = list.indexOf(idx);
    if(li<list.length-1){ currentPos = order.indexOf(list[li+1]); renderCard(); renderGrid(); }
  };
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.getAttribute('data-f');
    currentPos = 0;
    const list = currentFilteredList();
    if(list.length){ currentPos = order.indexOf(list[0]); }
    renderCard(); renderGrid();
  };
});

document.getElementById('shuffleBtn').onclick = ()=>{
  order = shuffleArr(order);
  currentPos = 0;
  renderCard(); renderGrid();
};

document.getElementById('resetBtn').onclick = ()=>{
  if(!confirm('Clear all answers and bookmarks?')) return;
  QUESTIONS.forEach(q=> state[q.n] = {selected:null, bookmarked:false});
  order = QUESTIONS.map((q,i)=>i);
  currentPos = 0;
  filter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.filter-btn[data-f="all"]').classList.add('active');
  renderCard(); renderGrid(); renderStats();
};

renderCard();
renderGrid();
renderStats();
</script>
</body>
</html>
