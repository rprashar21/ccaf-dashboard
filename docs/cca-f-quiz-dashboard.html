ce requirements before\nimplementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with each\nrefinement request."}, {"k": "B", "v": "Provide Claude with a detailed natural language specification of the algorithm, including all requirements\nand edge cases. Review each output manually and provide descriptive feedback on what behavior needs to\nchange."}, {"k": "C", "v": "Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to\nmatch your codebase style and add the required edge case handling, comparing outputs against the reference."}, {"k": "D", "v": "Have Claude extensively research the algorithm and create a detailed implementation plan using extended\nthinking, then implement the complete solution based on that plan."}], "a": "A", "e": "A. Write a test suite covering expected behavior, edge cases, and performance requirements before\nimplementation. Ask Claude to write code that passes the tests, then iterate by sharing test failures with\neach refinement request. ✅ (Correct)\nFor a complex graph traversal problem with edge cases like cycles, disconnected nodes, and weighted edges,\nthe most effective workflow is test-driven iteration. Defining a test suite upfront creates a precise\ncorrectness target, ensures all edge cases are explicitly covered, and allows each iteration to be validated\nobjectively. This reduces ambiguity and makes progressive refinement efficient and measurable.\nB. Provide Claude with a detailed natural language specification of the algorithm, including all\nrequirements and edge cases. Review each output manually and provide descriptive feedback on what\nbehavior needs to change. ❌ (Incorrect)\nThis relies too heavily on subjective interpretation and manual review, making iteration slower and less\nprecise than test-driven validation.\nC. Provide Claude with a reference implementation from documentation, then ask it to rewrite the code to\nmatch your codebase style and add the required edge case handling, comparing outputs against the\nreference. ❌ (Incorrect)\nA reference implementation helps, but it does not guarantee correctness for custom edge cases or\nperformance constraints.\nD. Have Claude extensively research the algorithm and create a detailed implementation plan using\nextended thinking, then implement the complete solution based on that plan. ❌ (Incorrect)\nPlanning is useful, but without executable tests, correctness across iterations is harder to validate and refine."}, {"n": 109, "q": "Your team is configuring MCP servers in Claude Code. You want to add a shared venue lookup server that all team\nmembers should have access to, and you personally want to add an experimental music playlist server that only\nyou are testing. Which configuration approach correctly applies MCP server scopes?", "o": [{"k": "A", "v": "Add venue server to .mcp.json and playlist server to ~/.claude.json"}, {"k": "B", "v": "Add both servers to the project-level .mcp.json file"}, {"k": "C", "v": "Add venue server to ~/.claude.json and playlist server to .mcp.json"}, {"k": "D", "v": "Add both servers to your local ~/.claude.json"}], "a": "A", "e": "A. Add venue server to .mcp.json and playlist server to ~/.claude.json ✅ (Correct)\nProject-level configuration (.mcp.json) is used for shared team servers, ensuring everyone working in the\nrepository has access to the same MCP tools (like the venue lookup server). User-level configuration\n(~/.claude.json) is used for personal or experimental servers, such as a music playlist server that only you\nwant to test locally.\nB. Add both servers to the project-level .mcp.json file ❌ (Incorrect)\nThis would expose the experimental playlist server to the entire team, which is not intended.\nC. Add venue server to ~/.claude.json and playlist server to .mcp.json ❌ (Incorrect)\nThis reverses the correct scoping: shared tools should not be user-only, and experimental tools should not be\nproject-wide.\nD. Add both servers to your local ~/.claude.json ❌ (Incorrect)\nThis would prevent the team from accessing the shared venue server, breaking collaboration."}, {"n": 110, "q": "Your infrastructure-as-code repository includes Terraform modules (/terraform/), Kubernetes manifests\n(/kubernetes/), and CI/CD pipeline scripts (/pipelines/). Each requires different conventions, but your single root\nCLAUDE.md has grown to 500+ lines. When developers work on Kubernetes files, Terraform-specific rules load\ninto context unnecessarily, consuming tokens. What is the best approach to reorganize so only relevant guidance\nloads when editing specific file types?", "o": [{"k": "A", "v": "Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform\nConventions\"), improving organization and readability."}, {"k": "B", "v": "Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so\nClaude loads directory-specific guidance."}, {"k": "C", "v": "Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance files\nfrom separate documents."}, {"k": "D", "v": "Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading\nrules only when editing matching files."}], "a": "D", "e": "D. Create files in .claude/rules/ with YAML frontmatter path-scoping (e.g., paths: [\"terraform/**/*\"]), loading\nrules only when editing matching files. ✅ (Correct)\nThis approach enables context-aware rule loading, ensuring that only relevant guidance is injected based on\nthe files being edited. Terraform rules apply only in /terraform, Kubernetes rules only in /kubernetes, and CI/CD\nrules only in /pipelines, which significantly reduces unnecessary token usage while keeping governance\nprecise and scalable.\nA. Restructure the root CLAUDE.md into clearly labeled sections with headers (e.g., \"## Terraform\nConventions\"), improving organization and readability. ❌ (Incorrect)\nThis improves readability but does not solve the core issue of unnecessary context loading.\nB. Split content into subdirectory CLAUDE.md files (/terraform/CLAUDE.md, /kubernetes/CLAUDE.md), so\nClaude loads directory-specific guidance. ❌ (Incorrect)\nWhile modular, it does not guarantee selective loading based on file type or path matching.\nC. Keep the root CLAUDE.md and use @path/to/import syntax to modularly include tool-specific guidance\nfiles from separate documents. ❌ (Incorrect)\nThis still risks pulling unrelated context into memory even when it is not needed."}, {"n": 111, "q": "Your team frequently migrates React components to Vue. You've written a step-by-step workflow for Claude Code\nto follow during each migration, and you want every developer on the team to invoke it by typing /migrate-\ncomponent. The workflow should stay in sync as the team iterates on it. Where should you place the skill file?", "o": [{"k": "A", "v": "In ~/.claude/skills/migrate-component/SKILL.md on each developer's machine"}, {"k": "B", "v": "In the project's .claude/settings.json using a skillOverrides entry to register and define the workflow"}, {"k": "C", "v": "In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control"}, {"k": "D", "v": "As a detailed instruction block in the project's root CLAUDE.md file"}], "a": "C", "e": "C. In .claude/skills/migrate-component/SKILL.md at the project root, committed to version control ✅\n(Correct)\nA shared team workflow like /migrate-component should live in the project-level skills directory under version\ncontrol. This ensures:\nEvery developer automatically gets the same workflow\nUpdates are tracked via git\nThe skill stays consistent and evolves with the codebase\nThe /migrate-component command is available project-wide\nA. In ~/.claude/skills/migrate-component/SKILL.md on each developer's machine ❌ (Incorrect)\nThis makes the workflow local and inconsistent across the team, and it won’t stay in sync.\nB. In .claude/settings.json using a skillOverrides entry to register and define the workflow ❌ (Incorrect)\nSettings files are for configuration, not defining reusable workflow skills.\nD. As a detailed instruction block in the project's root CLAUDE.md file ❌ (Incorrect)\nCLAUDE.md is for general guidance, not structured, reusable slash-command skills."}, {"n": 112, "q": "A critical bug is affecting production users. Error logs show exceptions in the OrderProcessing module with a clear\nstack trace pointing to a specific function. You haven't worked with this module before. What's the most effective\napproach?", "o": [{"k": "A", "v": "Start with direct execution to gather initial information, then switch to plan mode to design a comprehensive\nsolution before implementing any changes."}, {"k": "B", "v": "Use plan mode to analyze the error in context of the module's design, enumerate potential root causes, and\nprioritize fixes systematically."}, {"k": "C", "v": "Enter plan mode to explore the module's architecture and dependencies before attempting any fixes."}, {"k": "D", "v": "Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you\nidentify the root cause."}], "a": "D", "e": "D. Use direct execution to examine the stack trace, read the relevant code, and implement a fix once you\nidentify the root cause. ✅ (Correct)\nSince the issue already has a clear stack trace pointing to a specific function, the fastest and most effective\napproach is to directly investigate the referenced code path, understand the failure, and apply a targeted fix.\nThis minimizes overhead and is appropriate when the failure location is already well-identified.\nA. Start with direct execution to gather initial information, then switch to plan mode to design a\ncomprehensive solution before implementing any changes. ❌ (Incorrect)\nThis adds unnecessary planning overhead for a bug that already has a clearly identified source.\nB. Use plan mode to analyze the error in context of the module's design, enumerate potential root causes,\nand prioritize fixes systematically. ❌ (Incorrect)\nOver-analysis is unnecessary because the stack trace already localizes the issue.\nC. Enter plan mode to explore the module's architecture and dependencies before attempting any fixes. ❌\n(Incorrect)\nArchitecture-level exploration is too broad for a clearly localized production bug."}, {"n": 113, "q": "You're implementing a new payment processing module that must follow your project's established patterns for\ndatabase transactions, error handling, and audit logging.\nYou've identified three existing modules that exemplify these patterns: db_utils.py, error_handlers.py, and\naudit_logger.py. This is a one-off integration task—these patterns are well-documented in your team wiki and\ndon't need additional project-level documentation. What's the most effective approach?", "o": [{"k": "A", "v": "Describe the patterns from the three modules in natural language in your prompt, explaining the transaction\nhandling approach, error format, and logging conventions Claude should follow."}, {"k": "B", "v": "Use @references to include the three modules directly in your prompt, giving Claude concrete code\nexamples of the patterns to follow."}, {"k": "C", "v": "Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging\npatterns before generating the new module."}, {"k": "D", "v": "Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions that\nClaude will apply automatically."}], "a": "B", "e": "B. Use @references to include the three modules directly in your prompt, giving Claude concrete code\nexamples of the patterns to follow. ✅ (Correct)\nFor a one-off implementation that must strictly follow existing patterns, the most effective approach is to\nprovide direct, concrete code references. Including db_utils.py, error_handlers.py, and audit_logger.py ensures\nClaude can accurately replicate transaction handling, error formats, and logging conventions without relying\non abstraction or interpretation.\nA. Describe the patterns from the three modules in natural language in your prompt, explaining the\ntransaction handling approach, error format, and logging conventions Claude should follow. ❌ (Incorrect)\nNatural language descriptions are prone to ambiguity and may miss subtle implementation details present in\nthe actual code.\nC. Ask Claude to explore your codebase to find and understand the transaction, error handling, and logging\npatterns before generating the new module. ❌ (Incorrect)\nWhile exploration helps, it is less precise and less reliable than explicitly providing the canonical examples.\nD. Add documentation of each pattern to your CLAUDE.md file, establishing them as project conventions\nthat Claude will apply automatically. ❌ (Incorrect)\nThis is unnecessary overhead for a one-off task and does not guarantee accurate replication of nuanced\nimplementation details."}, {"n": 114, "q": "You've asked Claude to write a data migration script, but the initial output doesn't correctly handle records with\nnull values in required fields. What's the most effective way to iterate toward a working solution?", "o": [{"k": "A", "v": "Provide a test case with example input containing null values and the expected output, then ask Claude to fix\nit."}, {"k": "B", "v": "Manually edit the generated code to fix the null handling, then continue working with Claude on other parts."}, {"k": "C", "v": "Describe the null value problem in detail and ask Claude to regenerate the entire script with improved edge\ncase handling."}, {"k": "D", "v": "Add \"think harder about edge cases\" to your prompt and request a complete rewrite of the migration logic."}], "a": "A", "e": "A. Provide a test case with example input containing null values and the expected output, then ask Claude\nto fix it. ✅ (Correct)\nThe most effective iterative approach is to make the failure explicit and verifiable. By providing concrete\ninput/output examples for null-handling edge cases, you give a precise contract for the expected behavior.\nThis allows Claude to adjust the implementation accurately and testably, rather than relying on vague\ndescriptions or full rewrites.\nB. Manually edit the generated code to fix the null handling, then continue working with Claude on other\nparts. ❌ (Incorrect)\nManual fixes break the iterative feedback loop and make it harder for Claude to learn from structured\ncorrection signals.\nC. Describe the null value problem in detail and ask Claude to regenerate the entire script with improved\nedge case handling. ❌ (Incorrect)\nRegenerating the full script is inefficient and risks introducing regressions in already correct parts of the\nlogic.\nD. Add \"think harder about edge cases\" to your prompt and request a complete rewrite of the migration\nlogic. ❌ (Incorrect)\nThis is too vague and does not provide actionable guidance or measurable correctness criteria."}, {"n": 115, "q": "You've documented API error handling conventions in a CLAUDE.md file at your project root, specifying that\nendpoint handlers should use a custom ApiError class. After several sessions, you notice Claude Code sometimes\nfollows these conventions and sometimes uses generic try/catch blocks with string messages. The inconsistency\nappears random across different coding sessions. What's the most efficient first diagnostic step?", "o": [{"k": "A", "v": "Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for\ndifferent endpoint types."}, {"k": "B", "v": "Run /memory to check which memory files are loaded and verify your CLAUDE.md is included."}, {"k": "C", "v": "Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your\nproject conventions."}, {"k": "D", "v": "Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error handling\ninstructions to your API handler files."}], "a": "B", "e": "B. Run /memory to check which memory files are loaded and verify your CLAUDE.md is included. ✅\n(Correct)\nThe first and most efficient diagnostic step is to confirm whether the expected project-level context is\nactually being loaded. Since behavior is inconsistent across sessions, the most likely issue is not the rule\ncontent itself but context loading or memory inclusion. Checking /memory verifies whether CLAUDE.md and\nother relevant rules are being applied in the current session.\nA. Add more detailed code examples to your CLAUDE.md showing the exact ApiError usage pattern for\ndifferent endpoint types. ❌ (Incorrect)\nThis addresses rule clarity, but the issue is not necessarily lack of detail—it may be missing or conflicting\ncontext.\nC. Search for conflicting instructions in ~/.claude/CLAUDE.md or ~/.claude/rules/ that might override your\nproject conventions. ❌ (Incorrect)\nThis is a valid next step, but premature before confirming whether the project rules are even being loaded.\nD. Create path-specific rules in claude/rules/handlers.md with YAML frontmatter scoping the error\nhandling instructions to your API handler files. ❌ (Incorrect)\nThis is a structural fix, not a diagnostic step. You should first identify why the inconsistency is happening."}, {"n": 116, "q": "Your monorepo contains shared coding standards in /docs/standards/security-rules.md (for services handling user\ndata), testing-patterns.md (for all packages), and api-conventions.md (for API-facing services). Your 15 packages\nare organized by feature domain (/packages/auth/, /packages/billing/, /packages/notifications/, etc.) without\nnaming conventions indicating which handle user data or expose APIs. Package maintainers are expected to\nconfigure their own local development settings, as they understand their package's domain requirements.\nCurrently, all package CLAUDE.md files duplicate all three standards, applying irrelevant guidance. What's the\nmost effective approach?", "o": [{"k": "A", "v": "Create claude/rules/ files for each standard with YAML frontmatter paths listing every package directory\nwhere that standard should apply."}, {"k": "B", "v": "Create a shared-standards.nd that uses @imports to combine all three standards, then have each package's\nCLAUDE.md import that combined file."}, {"k": "C", "v": "Put all standards in the root CLAUDE.md with override instructions like \"ignore security-rules.md when\nworking in packages that don't handle user data.\""}, {"k": "D", "v": "Use @imports in each package's CLAUDE.md to reference only the specific standard files relevant to that\npackage, based on the maintainer's domain knowledge."}], "a": "D", "e": "D. Use @imports in each package's CLAUDE.md to reference only the specific standard files relevant to\nthat package, based on the maintainer's domain knowledge. (Correct)\nSince the package structure does not inherently indicate which standards apply, and maintainers are\nexpected to understand their package's requirements, the most effective approach is for each package's\nCLAUDE.md to import only the relevant standards. This eliminates duplication, keeps guidance targeted, and\navoids loading irrelevant instructions while leveraging the maintainers' domain expertise.\nA. Create .claude/rules/ files for each standard with YAML frontmatter paths listing every package\ndirectory where that standard should apply. (Incorrect)\nThis requires centrally maintaining package-to-standard mappings, which is difficult when applicability\ndepends on domain knowledge rather than directory structure.\nB. Create a shared-standards.md that uses @imports to combine all three standards, then have each\npackage's CLAUDE.md import that combined file. (Incorrect)\nThis continues loading irrelevant standards into every package, which is the problem being solved.\nC. Put all standards in the root CLAUDE.md with override instructions like \"ignore security-rules.md when\nworking in packages that don't handle user data.\" (Incorrect)\nThis increases context size and complexity, forcing Claude to process and ignore unnecessary guidance\nrather than loading only what is needed."}, {"n": 117, "q": "The system processes product reviews using tool use with a defined schema: rating (integer 1-5), pros (string\narray), cons (string array), and overall_sentiment (enum: positive, negative, mixed). Testing reveals two issues with\nbrief or ambiguous reviews (~20% of the dataset): (1) for reviews like \"Great product!\", Claude fabricates specific\npros and cons rather than indicating this information isn't explicitly stated, and (2) for sarcastic reviews like \"Well\nthat was... interesting\", Claude picks sentiment arbitrarily since there's no option for ambiguous cases. What\nschema modification best addresses both issues?", "o": [{"k": "A", "v": "Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls\nbelow a threshold."}, {"k": "B", "v": "Allow null values for pros/cons, and add \"unclear\" to the sentiment enum."}, {"k": "C", "v": "Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum."}, {"k": "D", "v": "Make pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum."}], "a": "C", "e": "C. Allow empty arrays for pros/cons as valid output, and add \"unclear\" to the sentiment enum. ✅ (Correct)\nThis directly addresses both problems:\nFor reviews like \"Great product!\", there may be no explicitly stated pros or cons. Allowing empty arrays lets\nthe model accurately represent that no specific pros or cons were mentioned, instead of hallucinating details.\nFor ambiguous or sarcastic reviews like \"Well that was... interesting\", adding \"unclear\" to the sentiment\nenum provides a valid option when sentiment cannot be determined reliably from the text.\nA. Add an extraction_confidence field (0.0-1.0) for each value, and filter outputs where any confidence falls\nbelow a threshold. ❌ (Incorrect)\nConfidence scores do not solve the underlying schema problem. The model may still fabricate pros/cons or\nguess sentiment.\nB. Allow null values for pros/cons, and add \"unclear\" to the sentiment enum. ❌ (Incorrect)\nNull suggests the fields are missing rather than that no pros/cons were explicitly stated. Empty arrays more\naccurately represent \"none identified.\"\nD. Make pros and cons optional fields, and add \"neutral\" and \"unclear\" to the sentiment enum. ❌\n(Incorrect)\nOptional fields can lead to inconsistent outputs. \"Neutral\" is different from \"unclear\" and does not address\nambiguity in determining sentiment."}, {"n": 118, "q": "After your daily batch of 10,000 documents completes, 300 documents (3%) failed with\n\"context_length_exceeded\" errors. The results file identifies each failure by custom_id. What's the most cost-\neffective approach to process these failures?", "o": [{"k": "A", "v": "Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with\nidentical system prompts"}, {"k": "B", "v": "Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the partial\nextractions"}, {"k": "C", "v": "Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch"}, {"k": "D", "v": "Resubmit the entire 10,000 document batch using a model tier with a larger context window"}], "a": "B", "e": "B. Resubmit only the 300 failed documents after chunking them into smaller pieces, then combine the\npartial extractions. ✅ (Correct)\nThe failures are specifically due to context_length_exceeded, meaning the documents are too large for the\nmodel's context window. The most cost-effective solution is to retry only the failed 300 documents, split\nthem into smaller chunks that fit within context limits, and then merge the results. This avoids reprocessing\nthe 9,700 documents that already succeeded.\nA. Reprocess the entire batch with prompt caching enabled to reduce the cost of retrying requests with\nidentical system prompts ❌ (Incorrect)\nPrompt caching may reduce costs, but it does not solve the context-length issue and unnecessarily\nreprocesses successful documents.\nC. Increase the max_tokens parameter for the 300 failed documents and resubmit them in a new batch ❌\n(Incorrect)\nmax_tokens controls output length, not input context capacity. It will not resolve context_length_exceeded\nerrors.\nD. Resubmit the entire 10,000 document batch using a model tier with a larger context window ❌\n(Incorrect)\nThis is significantly more expensive and unnecessary when only 3% of documents failed."}, {"n": 119, "q": "The system needs to extract candidate information (name, contact details, skills, work experience, education) from\nuploaded resumes. The extracted data must strictly conform to a predefined JSON schema, as missing required\nfields or incorrect data types will cause downstream validation failures. What is the most reliable approach to\nensure Claude's output consistently matches the schema?", "o": [{"k": "A", "v": "Define a tool with an input schema matching your required JSON structure and extract the data from\nClaude's tool_use response."}, {"k": "B", "v": "Include detailed JSON formatting instructions and a template example in the system prompt, asking Claude\nto output only valid JSON."}, {"k": "C", "v": "Parse Claude's text response with regex patterns to extract JSON objects, using retry logic for malformed\nresponses."}, {"k": "D", "v": "Make two separate API calls—first extracting information as text, then asking Claude to format that text as\nJSON."}], "a": "A", "e": "A. Define a tool with an input schema matching your required JSON structure and extract the data from\nClaude's tool_use response. ✅ (Correct)\nUsing tool use with a defined schema is the most reliable way to ensure the extracted candidate information\nconforms to the required JSON structure. The schema enforces field names, required properties, data types,\nand allowed values, significantly reducing validation failures and eliminating the need to parse free-form text.\nB. Include detailed JSON formatting instructions and a template example in the system prompt, asking\nClaude to output only valid JSON. ❌ (Incorrect)\nPrompt instructions improve consistency but cannot guarantee strict schema compliance.\nC. Parse Claude's text response with regex patterns to extract JSON objects, using retry logic for\nmalformed responses. ❌ (Incorrect)\nRegex-based parsing is brittle and does not ensure required fields or correct data types.\nD. Make two separate API calls—first extracting information as text, then asking Claude to format that\ntext as JSON. ❌ (Incorrect)\nThis adds complexity and still does not provide the schema enforcement that tool use offers.\\"}, {"n": 120, "q": "After deploying automated code review, developers report that approximately 35% of flagged findings are false\npositives falling into consistent patterns: style suggestion contradicting team conventions, security warnings for\npatterns safe in your deployment context, and performance suggestions that would degrade your specific use ca.\nYou want to reduce false positives while maintaining the ability to catch genuine issues. Which approach best\nenables the model to generalize its judgment to novel co patterns it hasn't seen before?", "o": [{"k": "A", "v": "Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable\npatterns from genuine issues in each category."}, {"k": "B", "v": "Implement post-processing that uses keyword matching to filter out findings containing terms like\n\"convention,\" \"context-dependent,\" or \"trade-off.\""}, {"k": "C", "v": "Add instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider that\nsome patterns may be intentional.\""}, {"k": "D", "v": "Create a comprehensive written specification of all patterns that should not be flagged, then include this full\ndocumentation in the system prompt."}], "a": "A", "e": "A. Include few-shot examples in your prompt showing annotated code snippets that distinguish acceptable\npatterns from genuine issues in each category. (Correct)\nFew-shot examples teach the model the underlying distinctions between acceptable and problematic\npatterns, allowing it to generalize to new, unseen code scenarios. By demonstrating how team conventions,\ndeployment-specific security considerations, and performance trade-offs should be evaluated, the model\nlearns the decision-making criteria rather than memorizing specific cases. This is the most effective approach\nfor reducing systematic false positives while preserving the ability to identify genuine issues.\nB. Implement post-processing that uses keyword matching to filter out findings containing terms like\n\"convention,\" \"context-dependent,\" or \"trade-off.\" (Incorrect)\nKeyword filtering is brittle and may suppress legitimate findings that happen to contain those terms while\nfailing to address the root cause of incorrect model reasoning.\nC. Add instructions to your system prompt to \"be conservative,\" \"only flag definite issues,\" and \"consider\nthat some patterns may be intentional.\" (Incorrect)\nGeneral instructions may reduce the number of findings but do not provide enough contextual guidance for\ndistinguishing acceptable patterns from genuine issues, especially in novel situations.\nD. Create a comprehensive written specification of all patterns that should not be flagged, then include this\nfull documentation in the system prompt. (Incorrect)\nA long list of rules is difficult for the model to apply consistently and may not help it generalize to new\npatterns. Examples are typically more effective at teaching nuanced judgment than exhaustive\ndocumentation alone."}, {"n": 121, "q": "After expanding the agent's MCP tools with delivery-specific capabilities (check_delivery_status, contact_driver,\nissue_credit, apply_promo_code, update_delivery_address, reschedule_delivery), the total tool count has grown\nfrom 4 to 10. Your evaluation suite shows tool selection accuracy has dropped to 71%. Log analysis reveals the\nmajority of errors involve the agent selecting between semantically overlapping tools-calling issue_credit when\nprocess_refund is correct, and calling check_delivery_status when lookup_order already returns the needed data.\nWhich approach structurally eliminates the semantic overlaps that are being logged as the error source?", "o": [{"k": "A", "v": "Split the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit, and\napply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator routing\nbetween them."}, {"k": "B", "v": "Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool pair,\nsuch as showing when issue_credit or process_refund is appropriate."}, {"k": "C", "v": "Consolidate semantically overlapping tools-merge issue_credit and process_refund into a single\nresolve_compensation tool with an optional include_tracking flag."}, {"k": "D", "v": "Enable the tool search tool with defer_loading on the six new tools, keeping the original four always loaded,\nso the agent dynamically calls it when needed."}], "a": "C", "e": "C. Consolidate semantically overlapping tools—merge issue_credit and process_refund into a single\nresolve_compensation tool with an optional include_tracking flag. (Correct)\nThe logged errors stem from semantic overlap between tools, where multiple tools can satisfy similar intents.\nConsolidating overlapping tools removes the ambiguity entirely, eliminating the need for the model to choose\nbetween near-equivalent actions. By designing tools around distinct user intents rather than overlapping\nimplementations, tool selection becomes simpler and more reliable.\nA. Split the tools across two sub-agents - a \"financial resolution\" agent with process_refund, issue_credit,\nand apply_promo_code, and a \"delivery\" agent with the remaining delivery tools - with a coordinator\nrouting between them. ❌ (Incorrect)\nThis reduces the number of tools visible to each agent but does not eliminate overlap within a domain. The\nfinancial agent would still need to choose between issue_credit and process_refund.\nB. Add few-shot examples to the system prompt demonstrating correct selection for each ambiguous tool\npair, such as showing when issue_credit or process_refund is appropriate. (Incorrect)\nFew-shot examples can improve accuracy but do not remove the underlying ambiguity. The model must still\nmake a difficult distinction between overlapping tools.\nD. Enable the tool search tool with defer_loading on the six new tools, keeping the original four always\nloaded, so the agent dynamically calls it when needed. (Incorrect)\nDeferred loading reduces the number of immediately available tools but does not address the root cause of\nerrors: overlapping tool semantics. Once loaded, the same ambiguity remains."}, {"n": 122, "q": "Anthropic's tool use documentation states: \"Write instructive error messages. Instead of generic errors like 'failed',\ninclude what went wrong and what Claude should try next.\" A billing dispute agent uses lookup_order, which\ncatches all exceptions and returns a tool_result with is_error: true and the message \"execution failed\". Monitoring\nshows two failure modes: the agent retries the identical call until hitting the turn limit, or it immediately calls\nescalate_to_human without trying alternative tools. Which change follows the documented recommendation and\ngives Claude the information it needs to select the correct recovery action for each error type?", "o": [{"k": "A", "v": "Implement retry logic with exponential backoff inside each tool implementation so transient errors are\nresolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop."}, {"k": "B", "v": "Return error-type-specific messages with is_error: true, e.g., \"order not found-try get_customer to search by\nphone\" for data errors and \"Database timeout (transient)-retry should succeed\" for infrastructure errors."}, {"k": "C", "v": "Remove is_error: true and return the error details as normal tool content, so Claude reasons about the\nresponse as data rather than treating it as a flagged failure condition that biases retry behavior."}, {"k": "D", "v": "Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them, tags\neach as \"retry\" \"try_alternative,\" or \"escalate,\" and adds that recommendation to the tool result."}], "a": "B", "e": "B. Return error-type-specific messages with is_error: true, e.g., \"order not found—try get_customer to\nsearch by phone\" for data errors and \"Database timeout (transient)—retry should succeed\" for\ninfrastructure errors. (Correct)\nAnthropic's recommendation is to provide instructive error messages that explain both what went wrong and\nwhat action Claude should take next. Error-specific messages give the model the context needed to\ndistinguish between failures that warrant a retry and failures that require trying a different tool. This directly\naddresses the observed behaviors of repeated identical retries and premature escalation.\nA. Implement retry logic with exponential backoff inside each tool implementation so transient errors are\nresolved transparently within the tool before any failure result is surfaced to Claude in the agentic loop.\n(Incorrect)\nInternal retries can help with transient failures, but they do not solve the problem of providing actionable\nguidance when an error is ultimately returned to Claude.\nC. Remove is_error: true and return the error details as normal tool content, so Claude reasons about the\nresponse as data rather than treating it as a flagged failure condition that biases retry behavior. (Incorrect)\nErrors should still be clearly identified as errors. Removing is_error: true obscures failure states and can lead\nto incorrect reasoning about tool outputs.\nD. Add an error classification step in the agentic loop that intercepts tool errors before Claude sees them,\ntags each as \"retry,\" \"try_alternative,\" or \"escalate,\" and adds that recommendation to the tool result.\n(Incorrect)\nWhile potentially helpful, this adds an external classification layer rather than following the documented\nguidance. The recommendation is for tools themselves to return informative, actionable error messages that\nexplain the failure and next step."}, {"n": 123, "q": "Your code review prompts include both implementation changes and the corresponding test file, but the LLM's\nreview comments fail to point out untested code paths.\nAnalysis reveals the model correctly flags functions that have no tests at all, but fails to identify when conditional\nbranches or error-handling paths within tested functions that have no tests at all, but fails to identify when\nconditional branches or error-handling paths within tested functio\nlack coverage.\nWhat's the most effective way to improve detection of branch-level coverage gaps without overcomplicating the\npipeline?", "o": [{"k": "A", "v": "Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then cross-\nreference each against test assertions in a second pass."}, {"k": "B", "v": "Include few-shot examples showing code with an uncovered branch paired with the review comment\nidentifying the specific missing test case."}, {"k": "C", "v": "Add explicit instructions directing the model to enumerate each conditional branch and exception path, then\nverify each has a corresponding test assertion."}, {"k": "D", "v": "Restructure the prompt to interleave implementation and tests, presenting each function followed\nimmediately by its test cases"}], "a": "B", "e": "B. Include few-shot examples showing code with an uncovered branch paired with the review comment\nidentifying the specific missing test case. (Correct)\nFew-shot examples are the most effective way to improve the model's ability to recognize branch-level test\ncoverage gaps and generalize that reasoning to new code. By demonstrating examples where conditional\nbranches or error-handling paths are untested—and showing the expected review comments—the model\nlearns the pattern it should look for during review without adding significant pipeline complexity.\nA. Implement a multi-pass pipeline where separate LLM calls first extract all conditional branches, then\ncross-reference each against test assertions in a second pass. (Incorrect)\nThis may improve accuracy but substantially increases system complexity, latency, and cost. The question\nasks for improvement without overcomplicating the pipeline.\nC. Add explicit instructions directing the model to enumerate each conditional branch and exception path,\nthen verify each has a corresponding test assertion. (Incorrect)\nInstructions can help, but they are generally less effective than examples at teaching nuanced reasoning\npatterns such as identifying branch-level coverage gaps.\nD. Restructure the prompt to interleave implementation and tests, presenting each function followed\nimmediately by its test cases. (Incorrect)\nImproving code-test proximity may aid review, but it does not directly teach the model how to identify missing\ncoverage for specific branches or error paths."}, {"n": 124, "q": "After deploying the automated review, you notice high precision but low recall - real bugs are slipping through\nundetected. Investigation reveals your review prompt instructs Claude to \"only report high-confidence issues you\nare certain about\" and \"err on the side of not commenting.\" Developers appreciate the low noise, but a race\ncondition that caused a production outage was visible in a reviewed PR and went unreported. You need to\nsubstantially improve bug detection while keeping false positive rates manageable for your team. What is the most\neffective approach?", "o": [{"k": "A", "v": "Expand the context window by including related test files, recent git history, and the module's dependency\ngraph alongside the diff, giving Claude richer signals to assess issue severity."}, {"k": "B", "v": "Remove the conservative filtering instructions and prompt Claude to report all potential issues, then apply a\nprogrammatic filter to deduplicate and suppress categories that historically generate false positives."}, {"k": "C", "v": "Split the review into a finding stage where Claude's goal is coverage - flagging every potential issue with\nconfidence and severity metadata - and a separate thresholds those findings."}, {"k": "D", "v": "Add detailed few-shot examples demonstrating bug categories Claude should flag - race conditions, null\ndereferences, error handling gaps - while keeping confidence filtering instruction to maintain current precision\nlevels."}], "a": "C", "e": "C. Split the review into a finding stage where Claude's goal is coverage—flagging every potential issue\nwith confidence and severity metadata—and a separate filtering stage that applies team-specific\nthresholds to those findings. (Correct)\nThe core problem is that the prompt's conservative filtering instructions are suppressing recall, causing\ngenuine bugs (such as the race condition) to go unreported. Separating issue detection from issue filtering is\nthe most effective solution:\nStage 1 (Detection): Maximize recall by identifying all plausible issues and assigning confidence/severity\nscores.\nStage 2 (Filtering): Apply team-specific thresholds to control noise and maintain manageable false-positive\nrates.\nThis architecture avoids forcing the model to simultaneously optimize for both recall and precision, which\noften leads to missed bugs.\nA. Expand the context window by including related test files, recent git history, and the module's\ndependency graph alongside the diff, giving Claude richer signals to assess issue severity. (Incorrect)\nMore context can help in some cases, but it does not address the primary issue: the prompt explicitly tells\nClaude to suppress anything it is not certain about.\nB. Remove the conservative filtering instructions and prompt Claude to report all potential issues, then\napply a programmatic filter to deduplicate and suppress categories that historically generate false\npositives. (Incorrect)\nThis improves recall but relies on coarse category-level filtering rather than evaluating each finding's\nconfidence and severity. It is less flexible and effective than a dedicated detection-and-filtering pipeline.\nD. Add detailed few-shot examples demonstrating bug categories Claude should flag—race conditions,\nnull dereferences, error handling gaps—while keeping confidence filtering instructions to maintain current\nprecision levels. (Incorrect)\nExamples may help identify more bug patterns, but the conservative instructions would still suppress many\nfindings, leaving the recall problem largely unresolved."}, {"n": 125, "q": "Your automated reviewer uses a single prompt covering security issues, API design, and business logic\ncorrectness. Your evaluation suite shows strong recall findings (82%) but poor recall for business logic edge cases\nin quiz scoring (34%). When you add few-shot examples of logic bugs to the prompt, logic recall is 41% but API\ndesign recall drops to 68%. How should you address this trade-off to improve detection across both categories?", "o": [{"k": "A", "v": "Split the review into separate focused prompts - one for security and API design, another for business logic -\neach with dedicated examples, then combine findings before posting."}, {"k": "B", "v": "Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a single\nprompt and eliminate the recall trade-off."}, {"k": "C", "v": "Provide the full repository as context instead of just the changed files and surrounding code, giving the\nmodel deeper visibility into business logic."}, {"k": "D", "v": "Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as\ndivision-by-zero in score calculation or grading thresholds."}], "a": "A", "e": "A. Split the review into separate focused prompts - one for security and API design, another for business\nlogic - each with dedicated examples, then combine findings before posting. (Correct)\nThe results show a classic prompt-capacity trade-off: adding business-logic examples improves logic recall\nbut reduces API design recall. By separating concerns into specialized review passes, each prompt can focus\non its domain with targeted instructions and examples without competing for attention or context. The\nfindings can then be merged into a single review output, improving overall recall across categories.\nB. Upgrade to a more capable model tier, since its stronger reasoning will handle both concern types in a\nsingle prompt and eliminate the recall trade-off. (Incorrect)\nA stronger model may help, but it does not fundamentally solve the prompt specialization problem. The trade-\noff can still persist when multiple review objectives compete within one prompt.\nC. Provide the full repository as context instead of just the changed files and surrounding code, giving the\nmodel deeper visibility into business logic. (Incorrect)\nMore context increases cost and complexity and may even dilute attention. The observed issue stems from\nbalancing multiple review goals, not a lack of repository-wide context.\nD. Replace the few-shot examples with a detailed checklist of specific logic edge cases to verify, such as\ndivision-by-zero in score calculation or grading thresholds. (Incorrect)\nChecklists can help for known cases but are less effective than dedicated, specialized review passes. They\nalso do not address the underlying competition between business-logic and API-design review objectives\nwithin a single prompt."}, {"n": 126, "q": "Your agent is handling a billing dispute. After calling get_customer and lookup_order, it identifies that the dispute\ninvolves a promotional pricing ero\napproval—beyond the agent's authorization level. How should the workflow handle this mid-process escalation?", "o": [{"k": "A", "v": "Persist the complete conversation and tool response history to a database, then call escalate_to_human with\na reference I"}, {"k": "D", "v": "Call escalate_to_human passing only the customer's original message."}, {"k": "B", "v": "Compile a structured handoff with customer details, order info, and the identified issue before calling\nescalate_to_human"}, {"k": "C", "v": "Attempt the refund with process refund anyway, escalating only if the system rejects the transaction."}], "a": "B", "e": "B. Compile a structured handoff with customer details, order info, and the identified issue before calling\nescalate_to_human. ✅ (Correct)\nWhen an agent determines that a case requires human approval or exceeds its authorization level, it should\ncreate a structured handoff containing all relevant context gathered during the investigation. This enables\nthe human agent to continue from the current state without repeating work and ensures a smooth transition.\nA. Persist the complete conversation and tool response history to a database, then call escalate_to_human\nwith a reference ID. ❌ (Incorrect)\nWhile storing history may be useful, providing only a reference ID does not ensure the human agent receives a\nclear summary of the issue or the investigation already performed.\nC. Attempt the refund with process_refund anyway, escalating only if the system rejects the transaction.\n❌ (Incorrect)\nThe scenario states that the refund amount exceeds the agent's authorization level. The agent should respect\nauthorization boundaries and escalate rather than attempting the action.\nD. Call escalate_to_human passing only the customer's original message. ❌ (Incorrect)\nPassing only the original message omits the customer information, order details, and findings already\ncollected, forcing the human agent to repeat the investigation."}, {"n": 127, "q": "Your agent has called lookup_order multiple times while investigating a customer's return requests. Each response\nincludes 40+ fields (items, shipping details, payment info, status history). Tool outputs now represent the majority\nof the conversation's context. The customer mentions two more orders they want to discuss. What's the effective\napproach before making additional lookups?97", "o": [{"k": "A", "v": "Extract only return-relevant fields (items, purchase date, return window, status) from each existing order\nresponse, removing verbose details"}, {"k": "B", "v": "Proceed with additional lookups without modifying the existing tool output context"}, {"k": "C", "v": "Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the\nconversation continues"}, {"k": "D", "v": "Have the model generate a natural language summary of each order's key details, replacing structured\nresponses with prose descriptions"}], "a": "A", "e": "A. Extract only return-relevant fields (items, purchase date, return window, status) from each existing\norder response, removing verbose details. ✅ (Correct)\nAs tool outputs begin to dominate the context window, the best approach is to compress and retain only the\ninformation relevant to the current task. Since the conversation is focused on return requests, fields such as\nitems, purchase date, return eligibility, and order status should be preserved, while unrelated details like\npayment information, full shipping records, and extensive status history can be removed. This maintains the\nnecessary context while conserving tokens for future interactions and tool calls.\nB. Proceed with additional lookups without modifying the existing tool output context. ❌ (Incorrect)\nContinuing to accumulate large tool responses wastes context window space and increases the risk of losing\nimportant information later in the conversation.\nC. Move all tool responses to a vector database with semantic indexing, retrieving relevant portions as the\nconversation continues. ❌ (Incorrect)\nWhile retrieval systems can be useful for long-term memory, this is a more complex solution than necessary.\nThe immediate issue is excessive tool output, which can be addressed more effectively through targeted\ncontext reduction.\nD. Have the model generate a natural language summary of each order's key details, replacing structured\nresponses with prose descriptions. ❌ (Incorrect)\nNatural language summaries may omit important fields and are generally less reliable than retaining a\ncompact, structured representation of the relevant data."}, {"n": 128, "q": "Production logs show that when the agent handles complex billing disputes requiring 6+ tool calls, it sometimes\nexhausts its max_turns limit after gathering data and before completing resolution or escalating. The team's goal\nis to guarantee that every customer interaction ends with either a completed resolution or a human escalation,\nregardless of how the agent loop terminates. Which approach achieves this guarantee?", "o": [{"k": "A", "v": "Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop\nended without a completed resolution or escalation, programmatically call escalate_to_human with the\naccumulated conversation context and tool results."}, {"k": "B", "v": "Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic\nescalation once the agent reaches 80% of its remaining actions."}, {"k": "C", "v": "Add system prompt instructions telling the agent to call escalate_to_human with a summary of its findings\nwhenever it determines it cannot resolve the dispute."}, {"k": "D", "v": "Split the workflow into two sequential agent invocations — a first agent gathers information via\nget_customer and lookup_order, then the second agent uses that data and handles process_refund or\nescalate_to_human, each with separate turn budgets."}], "a": "A", "e": "A. Add orchestration-layer code that checks the agent's outcome after each loop termination - if the loop\nended without a completed resolution or escalation, programmatically call escalate_to_human with the\naccumulated conversation context and tool results. ✅ (Correct)\nThis is the only option that guarantees every interaction ends in either a successful resolution or a human\nescalation. By enforcing the check outside the agent loop, the system remains robust even if the agent\nexhausts its max_turns, encounters unexpected behavior, or fails to explicitly escalate. The orchestration\nlayer acts as a reliable fallback that ensures no case is left unresolved.\nB. Implement a pre-tool-use hook that counts tool invocations and terminates the loop with an automatic\nescalation once the agent reaches 80% of its remaining actions. ❌ (Incorrect)\nThis may reduce the likelihood of hitting the turn limit, but it does not guarantee resolution or escalation in all\ntermination scenarios.\nC. Add system prompt instructions telling the agent to call escalate_to_human with a summary of its\nfindings whenever it determines it cannot resolve the dispute. ❌ (Incorrect)\nPrompt instructions improve behavior but cannot provide a hard guarantee, especially when the agent\nreaches max_turns before making that decision.\nD. Split the workflow into two sequential agent invocations — a first agent gathers information via\nget_customer and lookup_order, then the second agent uses that data and handles process_refund or\nescalate_to_human, each with separate turn budgets. ❌ (Incorrect)\nThis may reduce turn-limit issues but still does not guarantee that one of the agents will successfully resolve\nor escalate every case. An external enforcement mechanism is still required."}, {"n": 129, "q": "The document analysis agent has a single analyze_document tool that takes a document and a free-text\ninstruction parameter. During evaluation, requests like \"key financial metrics\" often return narrative summaries,\nwhile \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports analysis\nresults require re-requests with clarified instructions. What's the most effective way to improve reliability?", "o": [{"k": "A", "v": "Enhance the tool description with detailed examples showing how different instruction phrasings should\nmap to different output formats"}, {"k": "B", "v": "Keep the single tool but add an analysis type enum parameter requiring explicit selection between\nextraction, summarization, and verification"}, {"k": "C", "v": "Have the coordinator pre-classify each analysis request before passing instructions to the document\nanalysis agent"}, {"k": "D", "v": "Split the generic tool into purpose specific tools—extract data points, summarize content, verify claim\nagainst source—each with"}], "a": "D", "e": "D. Split the generic tool into purpose-specific tools—extract data points, summarize content, verify claims\nagainst source—each with clearly defined inputs and outputs. (Correct)\nThe root cause is that a single tool with a free-text instruction parameter has ambiguous semantics, leading\nto inconsistent outputs. Splitting it into purpose-specific tools removes this ambiguity by giving each tool a\nclear responsibility and expected output format. This makes tool selection more reliable and reduces the need\nfor re-requests or clarification by downstream agents.\nA. Enhance the tool description with detailed examples showing how different instruction phrasings should\nmap to different output formats. (Incorrect)\nExamples may improve performance, but the tool still relies on interpreting free-text instructions, leaving\nambiguity and inconsistency in place.\nB. Keep the single tool but add an analysis type enum parameter requiring explicit selection between\nextraction, summarization, and verification. (Incorrect)\nAn enum helps reduce ambiguity, but the tool still combines multiple responsibilities. Purpose-specific tools\ngenerally provide clearer semantics and more reliable behavior.\nC. Have the coordinator pre-classify each analysis request before passing instructions to the document\nanalysis agent. ❌ (Incorrect)\nThis shifts the classification burden elsewhere but does not solve the underlying issue that the tool itself\nperforms multiple distinct tasks with overlapping behavior."}, {"n": 130, "q": "In production, you observe that simple fact-checking queries (e.g., \"What year was the Paris Climate Agreement\nsigned?\") traverse all four subagents sequentially, consuming 40+ seconds and significant tokens per query.\nComplex comparative research benefits from the full pipeline. Your query distribution is diverse and evolving as\nusers discover new applications. What's the most effective approach to optimize for varying query complexity?", "o": [{"k": "A", "v": "Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its\nassessment of query requirements."}, {"k": "B", "v": "Train a query complexity classifier on labeled historical data to predict optimal subagent combinations,\nretraining periodically as query patterns evolve."}, {"k": "C", "v": "Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries through\nthe complete pipeline to ensure research thoroughness."}, {"k": "D", "v": "Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs.\nanalytical) and maps each category to a predefined combination."}], "a": "B", "e": "A. Have the coordinator analyze each query and dynamically decide which subagents to invoke based on its\nassessment of query requirements. (Incorrect)\nThis relies on runtime LLM judgment for every request, which adds latency and inconsistency. It is less\nefficient than a learned routing policy and does not scale well as query patterns diversify.\nB. Train a query complexity classifier on labeled historical data to predict optimal subagent combinations,\nretraining periodically as query patterns evolve. (Correct)\nA trained classifier provides fast, consistent routing decisions based on learned patterns from historical data.\nIt reduces latency by avoiding full LLM-based orchestration per query and adapts over time through retraining\nas usage patterns shift.\nC. Create a fast-path for factual questions that bypasses subagents entirely, routing all other queries\nthrough the complete pipeline to ensure research thoroughness. (Incorrect)\nThis improves performance for a subset of queries but creates a rigid binary system that cannot handle\nintermediate or evolving query complexities effectively.\nD. Implement pattern-based routing that categorizes queries by structure (single-fact vs. comparative vs.\nanalytical) and maps each category to a predefined combination. (Incorrect)\nRule-based pattern routing is brittle and struggles to generalize to new or ambiguous query types, requiring\nfrequent manual updates as usage evolves."}, {"n": 131, "q": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had\nidentified relevant sources, the document analyzer had partially completed extraction, and the synthesizer had\nbegun pattern identification. You need to resume processing without repeating work or losing fidelity of prior\nfindings. What state management approach best balances information fidelity with context efficiency when\nrestoring agent state?", "o": [{"k": "A", "v": "Index all agent outputs in a shared vector store. When resuming, each agent queries the store using\nsemantic search to retrieve relevant prior findings."}, {"k": "B", "v": "Have each agent maintain its own persistent state file and reload it independently at the start of each\nsession."}, {"k": "C", "v": "Have each agent persist a structured export to a known location. On resume, the coordinator loads the\nmanifest and injects relevant state into agent prompts."}, {"k": "D", "v": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to\nagents when resuming."}], "a": "C", "e": "C. Have each agent persist a structured export to a known location. On resume, the coordinator loads the\nmanifest and injects relevant state into agent prompts. ✅ (Correct)\nThis approach preserves structured, deterministic intermediate state from each agent, which is critical for\nresuming a partially completed multi-agent pipeline without redoing work. The coordinator can reconstruct\nthe workflow precisely by loading a manifest of completed and partial results, then selectively passing only\nthe required context back into each agent.\nIt avoids redundant computation, prevents loss of fidelity, and keeps context usage efficient by not\nreintroducing full logs or relying on probabilistic retrieval mechanisms.\nA. Index all agent outputs in a shared vector store. When resuming, each agent queries the store using\nsemantic search to retrieve relevant prior findings. ❌ (Incorrect)\nVector search introduces non-deterministic retrieval, which can miss exact intermediate structured outputs\nneeded for correct continuation of a pipeline.\nB. Have each agent maintain its own persistent state file and reload it independently at the start of each\nsession. ❌ (Incorrect)\nThis leads to fragmented state ownership, making cross-agent coordination harder and increasing the risk of\ninconsistencies in shared workflow context.\nD. Persist the coordinator's conversation log containing all task delegations and responses, providing this\nto agents when resuming. ❌ (Incorrect)\nRaw logs are unstructured and inefficient, and may include irrelevant context that wastes tokens and\nreduces clarity when resuming execution."}, {"n": 132, "q": "Your agent has analyzed a complex service module—reading 23 source files, tracing request flows, and\nidentifying error handling patterns. A developer needs to develop two testing strategies before committing to one:\nend-to-end tests with mocked external services vs. snapshot tests capturing expected outputs. The developer\nneeds to independently develop both approaches to evaluate trade-offs. How should you manage the sessions?", "o": [{"k": "A", "v": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}, {"k": "B", "v": "Export the analysis session's key findings to a file, then create two new sessions that reference this file."}, {"k": "C", "v": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}, {"k": "D", "v": "Start two fresh sessions, having each re-read the relevant source files before beginning."}], "a": "A", "e": "A. Resume the analysis session with fork_session enabled, creating a separate branch for each testing\nstrategy. (Correct)\nForking the session is the most effective way to support parallel, independent exploration while preserving\nthe full analysis context in-memory. Since the agent has already completed a heavy analysis phase (23\nsource files, request flows, error handling), that state should not be recomputed or exported—it should be\nreused directly.\nWith fork_session, each branch inherits the same authoritative context and can independently explore end-to-\nend tests vs snapshot tests without interference, ordering bias, or redundant reprocessing. This makes it ideal\nfor evaluating trade-offs under identical starting conditions.\nB. Export the analysis session's key findings to a file, then create two new sessions that reference this file.\n(Incorrect)\nThis introduces unnecessary serialization and reconstruction overhead. It also risks losing subtle contextual\nrelationships present in the live session state.\nC. Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially.\n(Incorrect)\nSequential execution prevents independent evaluation and introduces bias from the order of exploration.\nD. Start two fresh sessions, having each re-read the relevant source files before beginning. (Incorrect)\nThis wastes computation by repeating the expensive 23-file analysis instead of reusing already established\ncontext."}, {"n": 133, "q": "Production monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator\ninvokes the web search subagent, then invokes the document analysis subagent and waits again. These tasks are\nindependent—neither requires the other's output. What is the most effective way to run these subagents\nconcurrently?", "o": [{"k": "A", "v": "Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution time."}, {"k": "B", "v": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate\ncoordinator."}, {"k": "C", "v": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single\nresponse message."}, {"k": "D", "v": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel\nexecution at the same time."}], "a": "C", "e": "C. Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single\nresponse message. (Correct)\nThis enables true concurrent execution at the tool-calling layer. Since the web search and document\nanalysis subagents are independent, issuing both tool calls in the same coordinator response allows the\nruntime to execute them in parallel instead of waiting for one to finish before starting the other. This directly\nremoves the sequential bottleneck without changing model quality or adding unnecessary system complexity.\nA. Switch both subagents to use a Haiku-tier model instead of Sonnet to reduce their individual execution\ntime. (Incorrect)\nThis reduces per-task latency but does not address the core inefficiency, which is sequential execution, not\nmodel speed.\nB. Create an async orchestration layer outside the agent that spawns parallel threads, each running a\nseparate coordinator. (Incorrect)\nThis introduces unnecessary architectural complexity and duplicates coordination logic when parallelism can\nalready be achieved within a single coordinator response.\nD. Add detailed instructions to the coordinator's system prompt explaining the performance benefits of\nparallel execution at the same time. (Incorrect)\nPrompt instructions alone cannot guarantee parallel execution; only structured multi-tool invocation can\nenforce concurrency."}, {"n": 134, "q": "An engineer used the agent yesterday to analyze a legacy authentication module, identifying two distinct\nrefactoring approaches: extracting a microservice versus refactoring in-place. Today, they want to explore both\napproaches in depth—having the agent propose specific code changes for each—before deciding which to\nimplement. What's the most effective way to structure this exploration?", "o": [{"k": "A", "v": "Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork."}, {"k": "B", "v": "Resume yesterday's session and explore both approaches sequentially within the same conversation thread."}, {"k": "C", "v": "Resume yesterday's session to explore the first approach, then start a new session for the second, manually\nrecreating the original context."}, {"k": "D", "v": "Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish context."}], "a": "B", "e": "A. Use fork_session to create two branches from yesterday's analysis, exploring one approach in each fork.\n(Incorrect)\nForking is best when you need parallel exploration of competing directions without shared context. In this\ncase, both refactoring approaches are being evaluated from the same analytical baseline and are meant to be\ncompared within a single continuous reasoning flow. Forking adds unnecessary fragmentation.\nB. Resume yesterday's session and explore both approaches sequentially within the same conversation\nthread. Correct)\nThis preserves full historical context from the original analysis while allowing structured, step-by-step\ncomparison of both refactoring strategies. Since both approaches depend on the same prior findings, keeping\nthem in one session ensures consistency, reduces duplication, and makes trade-off evaluation easier.\nC. Resume yesterday's session to explore the first approach, then start a new session for the second,\nmanually recreating the original context. (Incorrect)\nThis introduces avoidable overhead and risks inconsistencies when manually reconstructing context. It also\nbreaks continuity, making it harder to directly compare the two approaches under identical assumptions.\nD. Start two fresh sessions, manually providing a summary of yesterday's analysis findings to establish\ncontext. (Incorrect)\nThis is the least efficient option. It relies entirely on manual summarization, which can omit important details\nand lead to context drift. It also duplicates effort and reduces reliability compared to continuing the original\nsession."}, {"n": 135, "q": "An engineer asks your agent to add comprehensive tests to a legacy codebase with 200 files and minimal existing\ntest coverage. The engineer hasn't spent much time on the codebase, so they ask for help identifying which\nmodules to prioritize. How should the agent decompose this open-ended task?", "o": [{"k": "A", "v": "Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized plan for\nhigh-impact areas, and revise as dependencies are discovered."}, {"k": "B", "v": "Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-\nlevel directory regardless of code complexity or importance."}, {"k": "C", "v": "Systematically read all 200 files to create a complete function inventory before writing any tests, ensuring\nthe testing plan accounts for everything from the beginning."}, {"k": "D", "v": "Start writing tests for the first module alphabetically, using test failures and imports to discover related files\norganically."}], "a": "A", "e": "A. Use Glob and Grep to map codebase structure, identify heavily-coupled modules, create a prioritized\nplan for high-impact areas, and revise as dependencies are discovered. (Correct)\nThis is the most effective decomposition strategy because it uses lightweight exploration tools first to\nunderstand structure and coupling, then prioritizes testing based on impact and dependency density. It is\niterative and adapts as new relationships between modules are discovered, which is essential in large, poorly\ntested codebases.\nB. Create a fixed testing schedule upfront based on directory structure, allocating equal effort to each top-\nlevel directory regardless of code complexity or importance. (Incorrect)\nThis ignores differences in module complexity, risk, and coupling. Treating all directories equally leads to\ninefficient allocation of testing effort and misses high-risk areas that need deeper coverage.\nC. Systematically read all 200 files to create a complete function inventory before writing any tests,\nensuring the testing plan accounts for everything from the beginning. (Incorrect)\nWhile thorough, this is not scalable and delays actual testing work. It front-loads too much analysis and\ndefeats the purpose of incremental discovery, especially in large legacy systems.\nD. Start writing tests for the first module alphabetically, using test failures and imports to discover related\nfiles organically. (Incorrect)\nThis is an unstructured and arbitrary approach. Alphabetical ordering has no relation to system importance or\ndependency structure, so it risks focusing effort on low-impact areas first and missing critical modules early."}, {"n": 136, "q": "Your automated review calls the Claude API for each PR, using tool_use with a report_findings tool that returns a\nJSON array of finding objects (each with file_path, line_number, severity, category, and description). During testing\non a large PR touching 30+ files, the response hits the max_tokens limit and the output is truncated mid-JSON,\ncausing your pipeline's parser to fail. What is the most effective way to handle this?", "o": [{"k": "A", "v": "Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50\nwords each."}, {"k": "B", "v": "Switch from tool_use to prompting Claude to return findings as a markdown list."}, {"k": "C", "v": "Split the review into multiple API calls that each analyze a subset of the changed files, then merge the\nresulting findings arrays."}, {"k": "D", "v": "Add retry logic that detects truncated JSON and re-sends the request with instructions to report only critical\nand high severity findings."}], "a": "C", "e": "C. Split the review into multiple API calls that each analyze a subset of the changed files, then merge the\nresulting findings arrays. ✅ Correct\nWhy C is correct:\nBreaking the PR into smaller batches keeps each JSON response within token limits, preventing truncation\nand ensuring valid, parseable output.\nA. Increase max_tokens to the model's maximum and instruct Claude to keep finding descriptions under 50\nwords each ❌ Incorrect\nMay reduce truncation but does not guarantee the response will fit.\nB. Switch from tool_use to prompting Claude to return findings as a markdown list ❌ Incorrect\nLoses structured output and still does not solve token limit issues.\nD. Add retry logic that detects truncated JSON and re-sends the request with instructions to report only\ncritical and high severity findings ❌ Incorrect\nProduces incomplete reviews by omitting lower-severity findings."}, {"n": 137, "q": "You are setting up a non-interactive automated code review pipeline using Claude Code. You want Claude to\nanalyze a pulled Git diff (git diff) against the main branch and apply a custom set of code review instructions.\nHowever, you notice that when you run the pipeline, Claude only looks at the raw diff text itself and completely\nstops using its file-reading or code navigation tools. As a result, it fails to inspect the broader codebase repository\ncontext, which is critical because the diff modifies a core function called by many other external modules.\nWhich change to the CLI invocation will cause Claude to read related files in the repository while still successfully\napplying your custom review instructions?", "o": [{"k": "A", "v": "Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude\nCode's default prompt instead of overwriting the built-in guidance for using file-reading and code navigation\ntools."}, {"k": "B", "v": "Keep --system-prompt and add --allowedTools \"Read, Glob, Grep\" so that the non-interactive mode permits\nfile system tools that it otherwise disables."}, {"k": "C", "v": "Stop piping the diff via stdin and instead embed the diff contents inside the prompt string, so Claude Code\ntreats the invocation as an agentic session rather than a stream-processing one."}, {"k": "D", "v": "Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root,\nsince --system-prompt is incompatible with tool use under -p."}], "a": "A", "e": "A. Replace --system-prompt with --append-system-prompt so your review instructions are added to Claude\nCode's default prompt instead of overwriting the built-in guidance for using file-reading and code\nnavigation tools. ✅ Correct\nWhy A is correct:\n--system-prompt replaces Claude Code's default system instructions, which include guidance for using file-\nreading and code navigation tools. --append-system-prompt preserves those built-in instructions while adding\nyour custom review rules, allowing Claude to inspect related repository files.\nB. Keep --system-prompt and add --allowedTools \"Read, Glob, Grep\" ❌ Incorrect\nTools may be permitted, but replacing the default system prompt can remove the instructions that tell Claude\nto use them.\nC. Stop piping the diff via stdin and instead embed the diff contents inside the prompt string ❌ Incorrect\nChanging how the diff is provided does not restore the missing tool-use guidance.\nD. Remove --system-prompt entirely and place the review instructions in a CLAUDE.md file at the repo root\n❌ Incorrect\n--system-prompt is not inherently incompatible with tool use; the issue is overwriting the default prompt."}, {"n": 138, "q": "Your development team is using Claude Code to automate test generation across a large codebase. However,\ndevelopers are frequently rejecting the generated test suites because Claude creates a high volume of trivial\nassertions or tests that merely maximize line coverage without validating meaningful behavioral logic or edge\ncases.\nYou want to guide Claude to generate high-quality, production-ready tests directly without introducing high\nlatency or modifying the core pipeline script.\nWhich strategy best ensures that high-quality, meaningful tests are generated in the first place?", "o": [{"k": "A", "v": "Restrict test generation to directories where historical quality metrics show higher acceptance rates,\ndisabling it for areas where generated tests consistently require heavy editing."}, {"k": "B", "v": "Add post-generation coverage analysis that automatically filters out any generated test that doesn't\nincrease line coverage beyond what existing tests provide."}, {"k": "C", "v": "Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with intended\nuse cases, and examples distinguishing meaningful behavioral tests from trivial assertions."}, {"k": "D", "v": "Implement a two-phase generation where a second Claude call scores each test against quality criteria,\nfiltering out low-scoring tests before presenting results to developers."}], "a": "C", "e": "C. Document testing standards in CLAUDE.md including valuable test criteria, available fixtures with\nintended use cases, and examples distinguishing meaningful behavioral tests from trivial assertions. ✅\nCorrect\nWhy C is correct:\nCLAUDE.md provides persistent guidance that shapes test generation from the start. By documenting quality\nstandards, fixtures, and examples of meaningful behavioral tests, Claude is more likely to generate\nproduction-ready tests that validate logic and edge cases instead of chasing line coverage.\nA. Restrict test generation to certain directories ❌ Incorrect\nLimits where tests are generated but does not improve test quality.\nB. Add post-generation coverage analysis ❌ Incorrect\nCoverage increases do not guarantee meaningful or high-quality tests.\nD. Implement a second scoring call ❌ Incorrect\nCan filter poor tests but adds latency and modifies the pipeline, which the requirements explicitly avoid."}, {"n": 139, "q": "A developer uses Claude Code to refactor a function during their development session. Before committing, they\nask the same Claude session to review the code for issues. Later, a separate automated CI review catches several\nbugs that the same-session review missed. What best explains this discrepancy?", "o": [{"k": "A", "v": "The CI environment has access to the full codebase context while the local session only sees the current file"}, {"k": "B", "v": "The CI review uses a more specific prompt tailored for ca
