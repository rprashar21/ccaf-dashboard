<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCA-F Exam Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d1117;
    --panel: #131a24;
    --panel-2: #171f2c;
    --border: #232d3d;
    --text: #e7ebf1;
    --text-dim: #8b96a8;
    --accent: #5eead4;
    --accent-dim: #1c3d38;
    --indigo: #818cf8;
    --amber: #f5b878;
    --good: #5eead4;
    --good-bg: #12312c;
    --bad: #fb7185;
    --bad-bg: #341b23;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse 1200px 800px at 20% -10%, #16202e 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px 80px;}

  /* header */
  .top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand .tag{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); text-transform:uppercase; border:1px solid var(--accent-dim); background:var(--good-bg); padding:3px 8px; border-radius:4px;}
  .brand h1{font-size:20px; margin:0; font-weight:800; letter-spacing:-.01em;}
  .brand .sub{color:var(--text-dim); font-size:13px; margin-top:4px; font-family:var(--mono);}

  .stats{display:flex; gap:18px; align-items:center;}
  .stat{text-align:right;}
  .stat .num{font-family:var(--mono); font-size:22px; font-weight:700; line-height:1;}
  .stat .lbl{font-size:10.5px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:3px;}
  .stat.acc .num{color:var(--accent);}

  /* progress bar */
  .progress-track{height:6px; border-radius:4px; background:var(--panel-2); border:1px solid var(--border); overflow:hidden; margin-bottom:18px; display:flex;}
  .progress-fill-good{background:var(--good); height:100%;}
  .progress-fill-bad{background:var(--bad); height:100%;}

  /* controls row */
  .controls{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; align-items:center;}
  .filter-btn{
    font-family:var(--mono); font-size:11.5px; padding:6px 11px; border-radius:6px;
    border:1px solid var(--border); background:var(--panel); color:var(--text-dim); cursor:pointer;
    transition:all .15s;
  }
  .filter-btn:hover{border-color:#3a4759; color:var(--text);}
  .filter-btn.active{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .spacer{flex:1;}
  .icon-btn{
    font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:6px;
    border:1px solid var(--border); background:var(--panel); color:var(--text-dim); cursor:pointer;
  }
  .icon-btn:hover{color:var(--text); border-color:#3a4759;}

  /* overview grid */
  .grid-panel{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:22px;}
  .grid-panel .gp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .gp-head span{font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase;}
  .qgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(30px,1fr)); gap:6px;}
  .qdot{
    aspect-ratio:1; border-radius:5px; border:1px solid var(--border); background:var(--panel-2);
    color:var(--text-dim); font-family:var(--mono); font-size:10.5px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .1s;
  }
  .qdot:hover{transform:scale(1.12); border-color:#3a4759;}
  .qdot.current{outline:2px solid var(--indigo); outline-offset:1px;}
  .qdot.correct{background:var(--good-bg); border-color:#1f5147; color:var(--good);}
  .qdot.incorrect{background:var(--bad-bg); border-color:#5c2a37; color:var(--bad);}
  .qdot.bookmarked::after{content:''; position:absolute;}

  /* card */
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:26px 26px 22px; position:relative; overflow:hidden;}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg, var(--indigo), var(--accent)); opacity:.6;}
  .card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .qnum{font-family:var(--mono); color:var(--indigo); font-size:13px; font-weight:600;}
  .bookmark-toggle{background:none; border:none; cursor:pointer; font-size:17px; color:var(--text-dim); padding:2px;}
  .bookmark-toggle.on{color:var(--amber);}

  .stem{font-size:16.5px; line-height:1.55; margin:0 0 20px; font-weight:500;}

  .options{display:flex; flex-direction:column; gap:9px; margin-bottom:6px;}
  .opt{
    display:flex; gap:12px; align-items:flex-start; text-align:left;
    background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:12px 14px; cursor:pointer; font-family:var(--sans); font-size:14.5px; color:var(--text);
    line-height:1.45; transition:border-color .15s, background .15s;
  }
  .opt:hover:not(.locked){border-color:#3a4759; background:#1a2330;}
  .opt .k{font-family:var(--mono); font-weight:700; color:var(--text-dim); flex-shrink:0; width:18px;}
  .opt.locked{cursor:default;}
  .opt.selected-correct{background:var(--good-bg); border-color:var(--good);}
  .opt.selected-correct .k{color:var(--good);}
  .opt.selected-wrong{background:var(--bad-bg); border-color:var(--bad);}
  .opt.selected-wrong .k{color:var(--bad);}
  .opt.reveal-correct{border-color:var(--good); background:var(--good-bg);}
  .opt.reveal-correct .k{color:var(--good);}
  .opt .mark{margin-left:auto; font-family:var(--mono); font-size:12px; flex-shrink:0;}

  .explain{
    margin-top:16px; padding:15px 16px; border-radius:9px; background:#0f1420; border:1px solid var(--border);
    font-size:13.5px; line-height:1.6; color:#c4cddb; white-space:pre-wrap; display:none;
  }
  .explain.show{display:block;}
  .explain .et{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); margin-bottom:8px; display:block;}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:20px; gap:10px;}
  .nav-btn{
    font-family:var(--mono); font-size:13px; padding:9px 16px; border-radius:8px;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text); cursor:pointer;
  }
  .nav-btn:hover{border-color:#3a4759;}
  .nav-btn:disabled{opacity:.35; cursor:not-allowed;}
  .nav-btn.primary{background:var(--indigo); border-color:var(--indigo); color:#0d1117; font-weight:700;}
  .nav-btn.primary:hover{filter:brightness(1.08);}

  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state .big{font-size:32px; margin-bottom:10px;}

  @media (max-width:560px){
    .stats{gap:12px;}
    .card{padding:18px 16px;}
    .stem{font-size:15px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">
      <div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="tag">CCA-F</span>
          <h1>Claude Certified Architect — Foundations</h1>
        </div>
        <div class="sub" id="subline">148 questions · agentic loops, hooks, orchestration, tool design</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statAnswered">0</div><div class="lbl">Answered</div></div>
      <div class="stat"><div class="num" id="statCorrect" style="color:var(--good)">0</div><div class="lbl">Correct</div></div>
      <div class="stat acc"><div class="num" id="statAcc">—</div><div class="lbl">Accuracy</div></div>
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill-good" id="pfGood" style="width:0%"></div>
    <div class="progress-fill-bad" id="pfBad" style="width:0%"></div>
  </div>

  <div class="controls">
    <button class="filter-btn active" data-f="all">All 148</button>
    <button class="filter-btn" data-f="unanswered">Unanswered</button>
    <button class="filter-btn" data-f="incorrect">Missed</button>
    <button class="filter-btn" data-f="correct">Correct</button>
    <button class="filter-btn" data-f="bookmarked">★ Bookmarked</button>
    <div class="spacer"></div>
    <button class="icon-btn" id="shuffleBtn">⤮ Shuffle</button>
    <button class="icon-btn" id="resetBtn">↺ Reset</button>
  </div>

  <div class="grid-panel">
    <div class="gp-head"><span id="gridLabel">Question map</span></div>
    <div class="qgrid" id="qgrid"></div>
  </div>

  <div id="cardHost"></div>

</div>

<script>
const QUESTIONS = [{"n": 1, "q": "After the web search agent and document analysis agent complete their tasks, the coordinator invokes the\nsynthesis agent. However, the synthesis agent responds that it cannot complete the task because no research\nfindings were provided. What is the most likely cause of this issue?", "o": [{"k": "A", "v": "The synthesis agent needs tools that can fetch results directly from the other agents' conversation histories."}, {"k": "B", "v": "The synthesis agent's context window is not large enough to hold the combined outputs from both previous\nagents."}, {"k": "C", "v": "The subagents need to share a single API connection to enable automatic context sharing between\ninvocations."}, {"k": "D", "v": "The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt."}], "a": "D", "e": "A. The synthesis agent needs tools that can fetch results directly from the other agents' conversation\nhistories. ❌ Incorrect.\nAgents do not require direct access to each other’s histories. Proper orchestration passes outputs explicitly\nvia prompts.\nB. The synthesis agent's context window is not large enough to hold the combined outputs from both\nprevious agents. ❌ Incorrect.\nIf this were the issue, the agent would receive truncated data, not no data at all. The error indicates missing\ninputs entirely.\nC. The subagents need to share a single API connection to enable automatic context sharing between\ninvocations. ❌ Incorrect.\nAgent communication does not depend on shared API connections. Context must be explicitly passed by the\ncoordinator.\nD. The coordinator did not include the outputs from the previous agents in the synthesis agent's prompt. ✅\nCorrect.\nThe synthesis agent can only act on the information provided in its prompt. If prior outputs are not passed, it\nwill report missing research findings."}, {"n": 2, "q": "When researching \"renewable energy adoption,\" the web search agent returns recent statistics (2024: 35%\nadoption) while the document analysis agent extracts data from internal reports (2022: 18% adoption). The\nsynthesis agent incorrectly flags these as contradictory sources rather than recognizing the data shows growth\nover time. What change would best enable the synthesis agent to correctly interpret such temporal differences?", "o": [{"k": "A", "v": "Require subagents to include publication or data collection dates in their structured outputs."}, {"k": "B", "v": "Instruct the synthesis agent to always treat the most recent data as authoritative and place older findings in\na separate historical appendix."}, {"k": "C", "v": "Add a conflict resolution agent that automatically discards older data when newer data exists for the same\nmetric."}, {"k": "D", "v": "Configure the web search agent to only return results from the past 6 months"}], "a": "A", "e": "A. Require subagents to include publication or data collection dates in their structured outputs. Correct.\nProviding timestamps allows the synthesis agent to understand that the figures refer to different points in\ntime, enabling it to interpret the data as a trend (growth) rather than a contradiction.\nB. Instruct the synthesis agent to always treat the most recent data as authoritative and place older\nfindings in a separate historical appendix. Incorrect.\nThis approach hides useful context and does not help the agent understand relationships between data points\nover time.\nC. Add a conflict resolution agent that automatically discards older data when newer data exists for the\nsame metric. Incorrect.\nDiscarding older data removes valuable historical insight and prevents trend analysis.\nD. Configure the web search agent to only return results from the past 6 months. Incorrect.\nLimiting recency reduces context and does not address the core issue of interpreting time-based differences."}, {"n": 3, "q": "Users report that final reports sometimes lack depth on specific subtopics. Investigation shows that the document\nanalysis agent frequently identifies gaps—for instance, noting \"the retrieved sources discuss API authentication\nbut lack details on token refresh patterns\"—but under the current strict pipeline, this insight isn't actionable since\nsearch has already completed. What is the most effective architectural change?", "o": [{"k": "A", "v": "Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-\ninvokes analysis until sufficient."}, {"k": "B", "v": "Add a research planning agent before the search phase that decomposes topics into specific sub-questions."}, {"k": "C", "v": "Have the synthesis agent attach confidence scores to each section and flag areas with insufficient coverage\nfor manual review."}, {"k": "D", "v": "Have the coordinator review analysis output for gap indicators and re-invoke search with gap-informed\nqueries when gaps are detected."}], "a": "A", "e": "A. Have the analysis agent report specific gaps to the coordinator, which triggers targeted searches and re-\ninvokes analysis until sufficient.\nThis introduces a dynamic, agentic loop (or reflection pattern) into the workflow. Instead of a rigid, linear\npipeline where steps cannot be retraced, the system can now adapt based on what it discovers.\nThe Analysis Agent is the Expert: The document analysis agent is the one actively reading the text and\nidentifying exactly what is missing (e.g., \"missing token refresh patterns\").\nThe Coordinator Manages the Flow: By reporting these specific gaps back to the coordinator, the coordinator\ncan intelligently route the workflow back to the search agent with a highly targeted query, then pass the new\nfindings back to the analysis agent to close the loop."}, {"n": 4, "q": "Your multi-agent research pipeline crashed after processing 12 of 28 documents. The web search agent had\nidentified relevant sources, the document analyzer had partially complete and the synthesizer had begun pattern\nidentification. You need to resume processing without repeating work or losing fidelity of prior findings. What state\nmanagement approach be Information fidelity with context efficiency when restoring agent state?", "o": [{"k": "A", "v": "Have each agent persist a structured export to a known location. On resume, the coordinator loads the\nmanifest and injects relevant state into agent prompts."}, {"k": "B", "v": "Persist the coordinator's conversation log containing all task delegations and responses, providing this to\nagents when resuming."}, {"k": "C", "v": "Have each agent maintain its own persistent state file and reload it independently at the start of each\nsession."}, {"k": "D", "v": "Index all agent outputs in a shared vector store. When resuming each agent queries the store using semantic\nsearch to retrieve relevant prior findings."}], "a": "A", "e": "A. Have each agent persist a structured export to a known location. On resume, the coordinator loads the\nmanifest and injects relevant state into agent prompts. Correct.\nThis provides high information fidelity (structured, complete outputs) while maintaining context efficiency\n(only relevant pieces are re-injected into prompts). The coordinator remains in control of what each agent\nneeds, avoiding unnecessary bloat and duplication.\nB. Persist the coordinator's conversation log containing all task delegations and responses, providing this\nto agents when resuming. ❌ Incorrect.\nConversation logs are often verbose and unstructured, leading to context overload and inefficient prompt\nusage without guaranteed clarity.\nC. Have each agent maintain its own persistent state file and reload it independently at the start of each\nsession. ❌ Incorrect.\nThis decentralizes control and can lead to inconsistencies and coordination issues, especially when agents\nneed shared or aligned context.\nD. Index all agent outputs in a shared vector store. When resuming each agent queries the store using\nsemantic search to retrieve relevant prior findings. Incorrect.\nVector stores are useful for retrieval, but they introduce probabilistic recall and may miss or distort critical\nstructured state, reducing fidelity during recovery."}, {"n": 5, "q": "The synthesis agent completes its initial pass but flags that three key research questions remain unanswered\nbecause the web search and document analysis agents didn't find relevant information on those specific\nsubtopics. The coordinator currently proceeds directly to report generation, producing reports with incomplete\ncoverage. What change would most effectively improve research completeness?", "o": [{"k": "A", "v": "Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document\nanalysis with targeted queries before Invoking synthesis again."}, {"k": "B", "v": "Increase the initial breadth of queries sent to web search and document analysis to reduce the probability of\nmissing relevant information."}, {"k": "C", "v": "Have the report generation agent note which research questions couldn't be answered, so users understand\nthe limitations of the final output."}, {"k": "D", "v": "Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps\nwithout returning control to the coordinator."}], "a": "A", "e": "A. Have the coordinator evaluate synthesis output for gaps, then re-delegate to web search and document\nanalysis with targeted queries before invoking synthesis again. Correct.\nThis introduces an iterative feedback loop, where identified gaps are actively addressed. The coordinator\nmaintains control and ensures completeness before final report generation.\nB. Increase the initial breadth of queries sent to web search and document analysis to reduce the\nprobability of missing relevant information. Incorrect.\nBroader queries may help coverage but are inefficient and still won’t guarantee that specific gaps discovered\nlater are filled.\nC. Have the report generation agent note which research questions couldn't be answered, so users\nunderstand the limitations of the final output. Incorrect.\nThis improves transparency but does not solve the completeness problem.\nD. Give the synthesis agent direct access to web search tools so it can autonomously fill knowledge gaps\nwithout returning control to the coordinator. Incorrect.\nThis breaks separation of concerns and reduces system control. The coordinator should manage task\ndelegation, not the synthesis agent."}, {"n": 6, "q": "When analyzing complex legal cases that cite multiple precedents, the document analysis subagent processes\neach sequentially. A landmark case citing 12 precedents takes over 3 minutes to analyze completely. What's the\nmost effective way to reduce this latency while preserving the coordinator's ability to monitor and debug the\nsystem?", "o": [{"k": "A", "v": "Enable the document analysis subagent to spawn its own specialized subagents dynamically when it\nencounters cases with many citations"}, {"k": "B", "v": "Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of\nworker agents"}, {"k": "C", "v": "Create a recursive agent hierarchy where analysis agents subdivide work among child agents until reading\nsingle-precedent granularity"}, {"k": "D", "v": "Have the coordinator spawn parallel document analysis subagents, each handling a subset of precedents,\nthen aggregate results before synthesis"}], "a": "D", "e": "A. Enable the document analysis subagent to spawn its own specialized subagents dynamically when it\nencounters cases with many citations. Incorrect.\nThis decentralizes orchestration and makes the system harder to monitor and debug. The coordinator loses\nvisibility into dynamically spawned agents.\nB. Implement a message queue where precedent analysis tasks are processed asynchronously by a pool of\nworker agents. Incorrect.\nWhile this improves scalability, it introduces infrastructure complexity and reduces transparency for\ndebugging at the coordinator level.\nC. Create a recursive agent hierarchy where analysis agents subdivide work among child agents until\nreaching single-precedent granularity. Incorrect.\nThis further complicates the architecture and makes tracing execution paths difficult, reducing observability\nand control.\nD. Have the coordinator spawn parallel document analysis subagents, each handling a subset of\nprecedents, then aggregate results before synthesis. Correct.\nThis enables parallel processing to reduce latency while keeping orchestration centralized. The coordinator\nretains full visibility, making monitoring and debugging easier."}, {"n": 7, "q": "Introduction monitoring shows the research phase takes longer than expected. Analysis reveals the coordinator\ninvokes the web search subagent, waits for its response, then invokes the document analysis subagent and waits\nagain. These tasks are independent - neither requires the other's output. How should you modify the system to run\nthese subagents concurrently?", "o": [{"k": "A", "v": "Switch both subagents to use a Haiku tier model instead of to reduce their individual execution time."}, {"k": "B", "v": "Create an async orchestration layer outside the agent that spawns parallel threads, each running a separate\ncoordinator subagent pair, then aggregates results."}, {"k": "C", "v": "Add detailed instructions to the coordinator's system prompt explaining the performance benefits of parallel\nexecution and requesting it invoke both subagents at the same"}, {"k": "D", "v": "Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single\nresponse message rather than across separate conversation turns."}], "a": "D", "e": "A. Switch both subagents to use a Haiku tier model instead to reduce their individual execution time.\nIncorrect.\nThis may reduce latency per task, but it does not address the core issue of sequential execution vs.\nparallelism.\nB. Create an async orchestration layer outside the agent that spawns parallel threads, each running a\nseparate coordinator subagent pair, then aggregates results. Incorrect.\nThis overcomplicates the architecture and duplicates coordinators unnecessarily instead of fixing\nconcurrency within the existing flow.\nC. Add detailed instructions to the coordinator's system prompt explaining the performance benefits of\nparallel execution and requesting it invoke both subagents at the same time. Incorrect.\nInstructions alone are not reliable for enforcing concurrency. Execution behavior depends on how tool calls\nare structured, not just prompt wording.\nD. Structure the coordinator to emit both Task tool calls (for web search and document analysis) in a single\nresponse message rather than across separate conversation turns. Correct.\nIssuing both tool calls in one response enables true parallel execution, since the system can run them\nconcurrently instead of waiting for one to finish before starting the other."}, {"n": 8, "q": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent\nfindings are synthesized into a single confident statement (losing other times reports over hedge with excessive\nqualifications (becoming unhelpful). When the web search agent returns \"Industry analysts estimate $50B market\nsize (methodolo the document analysis agent returns \"peer-reviewed study estimates $358 (1578, 95% CI),\" the\ncoordinator either picks one arbitrarily or produces vague statements like \"the ma 6358-6508 depending on\nfactors.\" What systematic approach best addresses this?", "o": [{"k": "A", "v": "Configure subagents to only report findings meeting a high confidence threshold, filtering uncertain\ninformation before it reaches the coordinator."}, {"k": "B", "v": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis\nthat are corroborated by at least two independent sources."}, {"k": "C", "v": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established\nfindings from contested ones, preserving original source characterization and methodological context."}, {"k": "D", "v": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized\nprobability scores (0.0-1.0), then weight-average findings by their calculated reliability scores to produce a\nstatistically grounded synthesis."}], "a": "C", "e": "A. Configure subagents to only report findings meeting a high confidence threshold, filtering uncertain\ninformation before it reaches the coordinator. Incorrect.\nThis suppresses potentially valuable but uncertain insights and introduces bias by hiding ambiguity rather\nthan managing it.\nB. Add a verification subagent that cross-references findings across sources, only passing claims to\nsynthesis that are corroborated by at least two independent sources. Incorrect.\nWhile useful for validation, this approach still filters out uncertainty instead of representing it, and may\ndiscard novel or emerging insights.\nC. Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established\nfindings from contested ones, preserving original source characterization and methodological context.\nCorrect.\nThis directly addresses inconsistent handling of uncertainty by making it explicit and structured, allowing\nusers to understand both consensus and disagreement without losing context.\nD. Implement a confidence calibration layer that normalizes subagent uncertainty expressions to\nstandardized probability scores (0.0–1.0), then weight-average findings by their calculated reliability\nscores to produce a statistically grounded synthesis. Incorrect.\nThis introduces artificial precision and may oversimplify complex, qualitative uncertainty, potentially\nmisleading users."}, {"n": 9, "q": "A user is expanding the research system beyond its single web search agent by adding specialized data sources.\nThey add a financial API agent that returns structured JSON with margins, and growth rates; a news monitoring\nagent that returns prose summaries of recent developments; and a patent analysis agent that returns structured\nlists of technology synthesis agent combines these into executive briefings. Currently, it converts everything to\nbullet points, causing financial comparisons to lose tabular clarity and news summari narrative flow. What change\nwould most improve briefing quality?", "o": [{"k": "A", "v": "Update the synthesis agent to render each content type appropriately—financial data as tables, news as\nprose, and technical lists as structured points."}, {"k": "B", "v": "Add a format conversion layer between subagents and synthesis that transforms all outputs to a common\nintermediate representation (such as Markdown) to facilitate more flexible rendering."}, {"k": "C", "v": "Standardize all subagent outputs to JSON with fields for every data type to ensure programmatic\nconsistency across the pipeline."}, {"k": "D", "v": "Standardize all subagent outputs to prose summaries with a uniform character to maintain a consistent\nexecutive voice regardless of the source material."}], "a": "A", "e": "A. Update the synthesis agent to render each content type appropriately—financial data as tables, news as\nprose, and technical lists as structured points. Correct.\nThis preserves the natural structure and strengths of each data type, improving clarity, readability, and\nusefulness of the final briefing.\nB. Add a format conversion layer between subagents and synthesis that transforms all outputs to a\ncommon intermediate representation (such as Markdown) to facilitate more flexible rendering. Incorrect.\nWhile helpful for consistency, this does not guarantee appropriate presentation of different content types\nand may still lead to generic formatting.\nC. Standardize all subagent outputs to JSON with fields for every data type to ensure programmatic\nconsistency across the pipeline. Incorrect.\nThis improves structure but shifts complexity to the synthesis stage and does not inherently improve human-\nreadable output quality.\nD. Standardize all subagent outputs to prose summaries with a uniform character to maintain a consistent\nexecutive voice regardless of the source material. Incorrect.\nThis sacrifices important structure (like tables and lists), reducing clarity and effectiveness for data-heavy\ncontent."}, {"n": 10, "q": "The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate\ndescriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about\nwhen to delegate—it generates messages like “I’ll ask the web search agent to find sources on this topic”—but no\nsubagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with\nincomplete information. Logs show no errors. What is the most likely cause?", "o": [{"k": "A", "v": "Subagent context isolation means task descriptions from the coordinator don’t automatically reach\nsubagents; you need to configure explicit context forwarding in Claude AgentOptions."}, {"k": "B", "v": "The coordinator’s max_tokens setting is too low, causing the Task tool invocation to be truncated before the\nsubagent type parameter can be specified."}, {"k": "C", "v": "The coordinator’s allowed Tools configuration doesn’t include “Task”, so while it can reason about\ndelegation, cannot invoke the tool required to spawn subagents."}, {"k": "D", "v": "The AgentDefinitions are configured correctly, but the coordinator’s system prompt doesn’t explicitly list the\navailable subagent types, preventing the model from knowing they can be invoked."}], "a": "C", "e": "A. Subagent context isolation means task descriptions from the coordinator don’t automatically reach\nsubagents; you need to configure explicit context forwarding in Claude AgentOptions. Incorrect.\nEven with context isolation, subagents would still be invoked—the issue here is that no invocation happens at\nall, not that context is missing.\nB. The coordinator’s max_tokens setting is too low, causing the Task tool invocation to be truncated before\nthe subagent type parameter can be specified. Incorrect.\nToken limits might truncate responses, but this would typically produce malformed outputs or errors—not\nsilent absence of any tool calls.\nC. The coordinator’s allowed Tools configuration doesn’t include “Task”, so while it can reason about\ndelegation, it cannot invoke the tool required to spawn subagents. Correct.\nThe coordinator can plan and describe delegation, but without the Task tool enabled, it cannot actually\nexecute subagent calls—resulting in no errors but no execution.\nD. The AgentDefinitions are configured correctly, but the coordinator’s system prompt doesn’t explicitly\nlist the available subagent types, preventing the model from knowing they can be invoked. Incorrect.\nWhile listing agents can help, the model already demonstrates awareness (“I’ll ask the web search agent…”).\nThe problem is execution capability, not awareness."}, {"n": 11, "q": "In production, final reports frequently contain claims without proper source attribution. Investigation shows that\nwhile the web search and document analysis agents correctly attach citations to their outputs, the synthesis agent\nloses track of which sources support which conclusions when combining findings. What's the most effective\narchitectural change?", "o": [{"k": "A", "v": "Add a verification step where the report generator uses semantic similarity matching against original\nsources to reconstruct which claims came from which documents."}, {"k": "B", "v": "Have the coordinator inject source identifier prefixes into text before each handoff, then parse these\nprefixes at report generation to reconstruct citations."}, {"k": "C", "v": "Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze\nlogs and determine attributions before report generation."}, {"k": "D", "v": "Require all subagents to output structured claim-source mappings that the synthesis agent must preserve\nand merge when combining findings from multiple sources."}], "a": "D", "e": "A. Add a verification step where the report generator uses semantic similarity matching against original\nsources to reconstruct which claims came from which documents. Incorrect.\nThis relies on post-hoc inference, which is error-prone and can misattribute claims due to semantic ambiguity.\nB. Have the coordinator inject source identifier prefixes into text before each handoff, then parse these\nprefixes at report generation to reconstruct citations. Incorrect.\nThis is a fragile, text-based workaround that can break during transformations and doesn’t scale well.\nC. Maintain complete transcripts of all subagent interactions and add a citation-resolution agent to analyze\nlogs and determine attributions before report generation. Incorrect.\nThis adds unnecessary complexity and still depends on indirect reconstruction rather than preserving\nattribution explicitly.\nD. Require all subagents to output structured claim-source mappings that the synthesis agent must\npreserve and merge when combining findings from multiple sources. Correct.\nThis ensures end-to-end attribution fidelity by keeping claim-to-source relationships explicit and structured\nthroughout the pipeline, preventing loss during synthesis."}, {"n": 12, "q": "After the web search and document analysis subagents complete their tasks, the coordinator needs to spawn the\nsynthesis subagent to synthesize the findings. What is the correct approach for providing the synthesis subagent\nwith the information it needs?", "o": [{"k": "A", "v": "Provide the subagent with tool definitions that allow it to request outputs from other subagents via callbacks"}, {"k": "B", "v": "Include the complete findings from both subagents directly in the synthesis subagent's prompt"}, {"k": "C", "v": "Pass reference Identifiers and configure the subagent with read access to a shared memory store where\nother subagents deposited their results"}, {"k": "D", "v": "Spawn the subagent with only a brief task description, relying on automatic context inheritance from the\ncoordinator"}], "a": "C", "e": "A. Provide the subagent with tool definitions that allow it to request outputs from other subagents via\ncallbacks. Incorrect.\nThis introduces unnecessary coupling and complexity. Subagents shouldn’t need to actively fetch data from\nothers.\nB. Include the complete findings from both subagents directly in the synthesis subagent's prompt.\nIncorrect.\nWhile simple, this approach does not scale well for large outputs and can exceed context limits, reducing\nefficiency.\nC. Pass reference identifiers and configure the subagent with read access to a shared memory store where\nother subagents deposited their results. Correct.\nThis is the most scalable and production-ready approach. It preserves information fidelity while avoiding\ncontext bloat, allowing the synthesis agent to retrieve exactly what it needs.\nD. Spawn the subagent with only a brief task description, relying on automatic context inheritance from the\ncoordinator. Incorrect.\nThere is no automatic context inheritance—without explicit data access, the synthesis agent cannot function\nproperly."}, {"n": 13, "q": "The web search agent has gathered several relevant sources for a research topic. The document analysis agent\nnow needs to examine these sources. How does information flow between these two specialized subagents?", "o": [{"k": "A", "v": "\"The coordinator agent receives the web search agent's output and includes relevant findings in the prompt\nwhen invoking the document analysis agent."}, {"k": "B", "v": "The agents communicate through an event-driven message queue, with the document analysis agent\nsubscribing to web search completion events."}, {"k": "C", "v": "The web search agent directly invokes the document analysis agent, using the discovered sources as\nparameters."}, {"k": "D", "v": "Both agents access a shared memory store where the web search agent writes findings and the document\nanalysis agent reads them."}], "a": "A", "e": "A. The coordinator agent receives the web search agent's output and includes relevant findings in the\nprompt when invoking the document analysis agent. Correct.\nThis follows the standard orchestration pattern where the coordinator manages all data flow, explicitly\npassing outputs between subagents.\nB. The agents communicate through an event-driven message queue, with the document analysis agent\nsubscribing to web search completion events. Incorrect.\nThis introduces unnecessary infrastructure complexity and is not the typical agent orchestration model.\nC. The web search agent directly invokes the document analysis agent, using the discovered sources as\nparameters. Incorrect.\nSubagents should not invoke each other directly; this breaks centralized control and observability.\nD. Both agents access a shared memory store where the web search agent writes findings and the\ndocument analysis agent reads them. Incorrect.\nWhile possible in advanced systems, this is not the standard or simplest approach; it adds complexity without\nclear necessity in typical pipelines."}, {"n": 14, "q": "After the web search agent finds 25 sources (120K tokens of raw content), the document analysis agent extracts\nkey insights (15K tokens), and the synthesis agent produces a coherent narrative draft (3K tokens), the coordinator\nmust pass context to the report generation agent for the final output with proper source citations. What context-\npassing strategy provides the best balance of completeness and efficiency?", "o": [{"k": "A", "v": "Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and\ninsert citations after the report is generated."}, {"k": "B", "v": "Pass the full accumulated context from all prior agents."}, {"k": "C", "v": "Pass the synthesis draft along with a structured source index that maps key claims to their source URLs and\nant Irant excerpts."}, {"k": "D", "v": "Pass a condensed summary of all prior stages that preserves the main findings and attributes them to\nsources by name only."}], "a": "C", "e": "A. Pass only the synthesis draft and have a separate post-processing pipeline match claims to sources and\ninsert citations after the report is generated. Incorrect.\nThis relies on post-hoc reconstruction, which is error-prone and can lead to incorrect or missing citations.\nB. Pass the full accumulated context from all prior agents. Incorrect.\nThis ensures completeness but is highly inefficient (120K+ tokens) and risks exceeding context limits.\nC. Pass the synthesis draft along with a structured source index that maps key claims to their source URLs\nand relevant excerpts. Correct.\nThis provides the best balance of completeness and efficiency—retaining precise attribution while keeping\ncontext size manageable.\nD. Pass a condensed summary of all prior stages that preserves the main findings and attributes them to\nsources by name only. Incorrect.\nThis loses granularity and makes precise citation mapping difficult, reducing attribution fidelity."}, {"n": 15, "q": "Your search products tool queries an external catalog API that returns paginated results (50 items per request).\nProduction logs show queries frequently match 200+ products, and the design that auto-fetches all pages causes\n15-20 second delays. How should you redesign the pagination handling?", "o": [{"k": "A", "v": "Create separate search products and fetch more results tools for pagination."}, {"k": "B", "v": "Implement server-side relevance ranking and return only the top 50 most relevant items."}, {"k": "C", "v": "Add a max pages parameter (default: 2) that controls how many pages are fetched internally."}, {"k": "D", "v": "Return the first page with total match count and cursor for additional pages."}], "a": "D", "e": "A. Create separate search products and fetch more results tools for pagination. Incorrect.\nThis exposes pagination mechanics to the agent, increasing complexity and coupling tool usage with control\nflow.\nB. Implement server-side relevance ranking and return only the top 50 most relevant items. Incorrect.\nWhile this reduces latency, it removes access to the full result set, limiting flexibility when more results are\nactually needed.\nC. Add a max pages parameter (default: 2) that controls how many pages are fetched internally. Incorrect.\nThis is an improvement over fetching everything, but it still hides pagination control inside the tool and may\nfetch unnecessary data.\nD. Return the first page with total match count and cursor for additional pages. Correct.\nThis enables lazy loading and explicit control, allowing the agent to fetch more results only when needed—\nbalancing performance and completeness."}, {"n": 16, "q": "Your search Flights tool calls an external airline API that occasionally returns a 503 Service Unavailable error.\nWhat is the most effective way to handle this error in your tool implementation?", "o": [{"k": "A", "v": "Return an empty flight list as if the search succeeded but found no matching flights."}, {"k": "B", "v": "Log the error internally and return an empty response, letting the model continue without the flight data."}, {"k": "C", "v": "Return an error message in the tool result explaining the service is temporarily unavailable."}, {"k": "D", "v": "Automatically retry the request up to five times with exponential backoff before returning results to the\nagent."}], "a": "D", "e": "A. Return an empty flight list as if the search succeeded but found no matching flights. Incorrect.\nThis hides the failure and misleads the system into thinking no flights exist, which can lead to incorrect\nconclusions.\nB. Log the error internally and return an empty response, letting the model continue without the flight data.\nIncorrect.\nThis still suppresses the failure signal, preventing the agent from taking corrective action.\nC. Return an error message in the tool result explaining the service is temporarily unavailable. Incorrect.\nWhile transparent, this alone doesn’t attempt recovery and may degrade user experience unnecessarily.\nD. Automatically retry the request up to five times with exponential backoff before returning results to the\nagent. Correct.\nThis is the most effective approach—handles transient failures gracefully, improves reliability, and only\nsurfaces errors if retries fail."}, {"n": 17, "q": "Your MCP server implements a check_availability tool that queries an external calendar API. During testing, you\nencounter three error conditions:\n(1) the tool is called with a malformed request, missing the required user_email parameter\n(2) the calendar API returns a 404 because the specified user doesn't exist in the calendar system\n(3) the calendar API returns a 503 because the service is temporarily unavailable.\nHow should each error be reported according to MCP's error handling design?", "o": [{"k": "A", "v": "Report all three as tool results with isError: true"}, {"k": "B", "v": "Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true"}, {"k": "C", "v": "Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true"}, {"k": "D", "v": "Report all three as JSON-RPC protocol errors."}], "a": "C", "e": "A. Report all three as tool results with isError: true Incorrect.\nMalformed requests (error 1) are protocol-level issues, not tool execution results, so they should not be\nreported this way.\nB. Report errors 1 and 2 as JSON-RPC protocol errors, report error 3 as a tool result with isError: true\nIncorrect.\nA 404 (error 2) is a valid tool execution outcome (the user doesn’t exist), not a protocol error.\nC. Report error 1 as a JSON-RPC protocol error, report errors 2 and 3 as tool results with isError: true\nCorrect.\nError 1 (malformed request) → JSON-RPC protocol error (invalid input)\nError 2 (user not found) → Tool result with isError: true (valid execution, meaningful failure)\nError 3 (service unavailable) → Tool result with isError: true (transient external failure)\nD. Report all three as JSON-RPC protocol errors. ❌ Incorrect.\nOnly malformed requests should be protocol errors; external API responses are tool-level outcomes, not\nprotocol failures."}, {"n": 18, "q": "Your documents (query) tool returns results as \"Found 3 documents: Q2 Budget Proposal, Q2 Budget Forecast,\nAnnual Review\". You want the agent to document (4, multi) and doc (24, multi). What return format would best\nenable these multi-step workflows?", "o": [{"k": "A", "v": "URLs that users can click to open the document in their browser."}, {"k": "B", "v": "Structured data containing document IDs and metadata for each result."}, {"k": "C", "v": "A JSON array of document titles extracted from the search results."}, {"k": "D", "v": "More detailed human-readable descriptions including the size and authors."}], "a": "B", "e": "A. URLs that users can click to open the document in their browser. Incorrect.\nURLs are useful for users, but not ideal for agents performing multi-step workflows that require reliable\nreferencing and further operations.\nB. Structured data containing document IDs and metadata for each result. Correct.\nThis enables the agent to programmatically reference specific documents (via IDs) across multiple steps,\nmaking workflows like follow-up queries or document retrieval precise and reliable.\nC. A JSON array of document titles extracted from the search results. Incorrect.\nTitles alone are ambiguous and not stable identifiers, making it difficult for agents to reliably act on specific\ndocuments.\nD. More detailed human-readable descriptions including the size and authors. Incorrect.\nHelpful for users, but still unstructured and not suitable for precise multi-step agent operations."}, {"n": 19, "q": "Your agent has access to 50+ specialized API connectors for different external services. As the connector library\ngrew, tool selection accuracy dropped to 58%. You design a search_connectors(description) tool that finds\nmatching connectors, but in testing agents frequently skip searching and call connectors directly (often\nincorrectly), or search select wrong connectors from the filtered results.\nHow should you design the tool composition pattern to address both issues?", "o": [{"k": "A", "v": "Design connectors with built-in compatibility validation that return descriptive errors for mismatched\nrequests."}, {"k": "B", "v": "Design a find_and_execute(description, params) composite tool that searches and immediately executes the\nbest matching connector."}, {"k": "C", "v": "Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements. Add\nfew-shot examples showing the correct search-then-use workflow."}, {"k": "D", "v": "Design search_connectors to dynamically add matched connectors to the agent's available tools. Connectors\nstart unavailable and persist once discovered."}], "a": "D", "e": "A. Design connectors with built-in compatibility validation that return descriptive errors for mismatched\nrequests. Incorrect.\nThis helps with error handling after a wrong choice is made, but does not improve initial tool selection\naccuracy.\nB. Design a find_and_execute(description, params) composite tool that searches and immediately executes\nthe best matching connector. Incorrect.\nThis removes transparency and control, making debugging harder and preventing the agent from reasoning\nabout tool choice.\nC. Enhance all connector descriptions with detailed usage samples, edge cases, and input requirements.\nAdd few-shot examples showing the correct search-then-use workflow. Incorrect.\nWhile helpful, this still relies on the agent to follow instructions and does not enforce correct behavior,\nespecially at scale with 50+ tools.\nD. Design search_connectors to dynamically add matched connectors to the agent's available tools.\nConnectors start unavailable and persist once discovered. Correct.\nThis enforces the search-first pattern by limiting available tools initially and reducing the decision space,\nimproving both discovery and correct selection."}, {"n": 20, "q": "Your publish article tool calls an external CMS API that occasionally returns transient errors (network timeouts,\n503s) and non-transient errors (403 permission denied, 422 validation failure).\nCurrently, every error is returned directly to the agent, which leads to the agent retrying non-transient errors and\nwasting turns on failures that will never succeed. How should you partition error-handling responsibility between\nthe tool implementation and the agent?", "o": [{"k": "A", "v": "Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and only\nsurface a failure to the agent after a fixed number of retry attempts have been exhausted."}, {"k": "B", "v": "Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and surface\nnon-transient errors (permission denied, validation fallures) to the agent with descriptive messages so it can\ntake corrective action."}, {"k": "C", "v": "Surface all errors to the agent immediately with detailed context, and let the agent decide which errors to\nretry and how many times-keeping the tool implementation stateless and simple."}, {"k": "D", "v": "Implement a universal error handler that catches all exceptions and returns a generic \"tool unavailable-try\nagain later\" message, shielding the agent from error complexity."}], "a": "B", "e": "A. Handle all errors inside the tool: Implement retries with exponential backoff for every error type, and\nonly surface a failure to the agent after a fixed number of retry attempts have been exhausted. ❌\nIncorrect.\nThis wastes time retrying non-transient errors (e.g., 403, 422) that will never succeed and hides useful\nfeedback from the agent.\nB. Handle transient errors (timeouts, 503s) with automatic retries inside the tool implementation, and\nsurface non-transient errors (permission denied, validation failures) to the agent with descriptive messages\nso it can take corrective action. ✅ Correct.\nThis cleanly separates responsibility:\nTool handles recoverable/transient issues automatically\nAgent receives actionable errors it can fix (permissions, input validation)\nC. Surface all errors to the agent immediately with detailed context, and let the agent decide which errors\nto retry and how many times—keeping the tool implementation stateless and simple. ❌ Incorrect.\nThis pushes retry logic to the agent, leading to inefficient behavior and wasted turns.\nD. Implement a universal error handler that catches all exceptions and returns a generic \"tool unavailable\n—try again later\" message, shielding the agent from error complexity. ❌ Incorrect.\nThis removes critical detail, preventing the agent from taking corrective actions when possible."}, {"n": 21, "q": "Your remove_team_member tool uses a dry_run: boolean parameter for previewing impacts before execution.\nProduction monitoring shows the agent bypasses the preview step in 15% of calls by calling with dry_run=false\ndirectly. You need to ensure every removal is preceded by a preview that the user explicitly confirms. What is the\nmost reliable approach?", "o": [{"k": "A", "v": "Add server-side validation that permits dry_run=false only when a dry_run=true call with identical\nparameters occurred within the past 60 seconds."}, {"k": "B", "v": "Replace with two tools: preview_remove_member returns impact details and a single-use confirmation token;\nexecute_remove_member requires that token, binding execution to the specific previewed action."}, {"k": "C", "v": "Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for\napproval before forwarding any calls to annotated tools."}, {"k": "D", "v": "Add detailed instructions and few-shot examples to the tool description requiring the agent to always call\nwith dry_run=true first and wait for user confirmation before calling with dry_run=false."}], "a": "B", "e": "A. Add server-side validation that permits dry_run=false only when a dry_run=true call with identical\nparameters occurred within the past 60 seconds. ❌ Incorrect.\nThis approach is brittle because it depends on timing and does not guarantee that the user actually reviewed\nor confirmed the preview.\nB. Replace with two tools: preview_remove_member returns impact details and a single-use confirmation\ntoken; execute_remove_member requires that token, binding execution to the specific previewed action.\n✅ Correct.\nThis enforces the correct workflow at the system level by requiring a valid preview step and tying execution\nto an explicit confirmation, making bypass impossible.\nC. Annotate the tool as requiring confirmation and configure the orchestration layer to prompt the user for\napproval before forwarding any calls to annotated tools. ❌ Incorrect.\nThis depends on orchestration behavior and is not strictly enforced, so it can still be bypassed or\nmisconfigured.\nD. Add detailed instructions and few-shot examples to the tool description requiring the agent to always\ncall with dry_run=true first and wait for user confirmation before calling with dry_run=false. ❌ Incorrect.\nInstruction-based approaches are not reliable for enforcement, as demonstrated by the existing bypass rate."}, {"n": 22, "q": "Your expense reimbursement agent processes employee requests using a process reimbursement tool. Company\npolicy requires that reimbursements above $500 must be approved before funds are disbursed. The agent handles\nhundreds of requests daily, and you need the threshold enforcement to be tamper-proof regardless of how the\nagent is prompted ensures the $500 approval threshold cannot be bypassed?", "o": [{"k": "A", "v": "The process reimbursement tool accepts an approved by manager parameter. The system prompt instructs\nthe agent to only set this to true after confirming that a manager approved the request. A nightly audit script\nreviews all reimbursements where approved by manager was set to true."}, {"k": "B", "v": "Provide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed system\nprompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post ToolUse\nhook that logs which tool was called for auditing."}, {"k": "C", "v": "The process reimbursement tool accepts amount and details, and internally enforces the threshold; amounts\n<$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the tool to create\na pending approval request and return a status indicating manager review is pending."}, {"k": "D", "v": "Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process\nreimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires\napproval: true flag, which the tool checks before disbursing."}], "a": "C", "e": "A. The process reimbursement tool accepts an approved by manager parameter. The system prompt\ninstructs the agent to only set this to true after confirming that a manager approved the request. A nightly\naudit script reviews all reimbursements where approved by manager was set to true. ❌ Incorrect.\nThis relies on the agent following instructions and post-hoc auditing, which is not tamper-proof and allows\nbypass at execution time.\nB. Provide two tools: auto reimburse (hard-coded limit of $500) and manager approval. Include detailed\nsystem prompt instructions telling the agent to check the amount and use the appropriate tool. Add a Post\nToolUse hook that logs which tool was called for auditing. ❌ Incorrect.\nAgain depends on agent behavior and correct tool selection. Logging helps auditing but does not prevent\nmisuse.\nC. The process reimbursement tool accepts amount and details, and internally enforces the threshold;\namounts <$500 are auto-disbursed and the tool returns a success confirmation. Amounts >$500 cause the\ntool to create a pending approval request and return a status indicating manager review is pending. ✅\nCorrect.\nThis enforces the rule inside the tool itself, making it impossible to bypass regardless of how the agent is\nprompted.\nD. Implement the threshold check in a PreToolUse hook that inspects the amount parameter before process\nreimbursement executes. If the amount exceeds $500, the hook modifies the context to add a requires\napproval: true flag, which the tool checks before disbursing. ❌ Incorrect.\nPreToolUse hooks can be bypassed or misconfigured and still rely on downstream logic. Enforcement should\nreside directly within the tool for full reliability."}, {"n": 23, "q": "Your order management system requires tools for three distinct operations: issuing refunds (requires amount and\nreason), canceling orders (requires reason), and res (requires shipping address). Each operation shares an order id\nparameter but has different additional requirements. You notice during testing that with your current frequently\nomits required parameters or includes irrelevant ones. What design change will most effectively improve\nparameter accuracy?", "o": [{"k": "A", "v": "Split into three separate tools (each defining only the parameters required for that specific operation."}, {"k": "B", "v": "Keep one unified tool with all parameters marked optional, but add few-shot examples in the system prompt\nshowing correct parameter combinations for each operation."}, {"k": "C", "v": "Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like amount\nare required only when the operation type is \"refund\"."}, {"k": "D", "v": "Keep one unified tool with a nested operation object parameter whose internal structure varies by operation\ntype, documented in the tool description."}], "a": "A", "e": "A. Split into three separate tools (e.g., issue_refund, cancel_order, reship_order), each defining only the\nparameters required for that specific operation. ✅ Correct.\nThis reduces ambiguity and ensures the agent only sees relevant parameters per operation, leading to much\nhigher accuracy.\nB. Keep one unified tool with all parameters marked optional, but add few-shot examples in the system\nprompt showing correct parameter combinations for each operation. ❌ Incorrect.\nExamples help, but the schema remains ambiguous, so errors will still occur.\nC. Keep one unified tool but add JSON Schema if-then-else conditionals to enforce that parameters like\namount are required only when the operation type is \"refund\". ❌ Incorrect.\nWhile technically valid, this increases complexity and is less reliable than simply separating tools.\nD. Keep one unified tool with a nested operation object parameter whose internal structure varies by\noperation type, documented in the tool description. ❌ Incorrect.\nThis adds complexity and cognitive load, making it harder for the agent to consistently provide correct\nparameters."}, {"n": 24, "q": "Your portfolio value tool returns the total value of a user's investment portfolio. You're deciding between returning\na structured JSON object with explicit fields versus returning information as a formatted text string. What is the\nprimary advantage of using structured output with defined fields?", "o": [{"k": "A", "v": "Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API\ncosts."}, {"k": "B", "v": "The agent can reliably extract specific values without parsing free form text, reducing errors in subsequent\noperations."}, {"k": "C", "v": "Structured JSON is processed deterministically by the model, significantly improving accuracy when\nextracting values."}, {"k": "D", "v": "JSON schemas automatically validate that the underlying API returned correct data before the agent\nprocesses it."}], "a": "B", "e": "A. Structured JSON consumes significantly fewer tokens than natural language, substantially reducing API\ncosts. ❌ Incorrect.\nToken usage depends on the content; JSON is not inherently more compact than text and may sometimes use\nmore tokens.\nB. The agent can reliably extract specific values without parsing free form text, reducing errors in\nsubsequent operations. ✅ Correct.\nStructured output provides clear, predictable fields, making it easy for the agent to use the data accurately\nin downstream steps.\nC. Structured JSON is processed deterministically by the model, significantly improving accuracy when\nextracting values. ❌ Incorrect.\nThe model is still probabilistic; JSON improves structure, but not deterministic processing.\nD. JSON schemas automatically validate that the underlying API returned correct data before the agent\nprocesses it. ❌ Incorrect.\nSchemas define structure, but they do not guarantee correctness of the actual data returned by the API."}, {"n": 25, "q": "Your scheduling agent uses get_available_slots(date, provider_id) to retrieve open appointment times, then\nbook_appointment(provider_id, slot_time, patient_id) to reserve a slot. tickets show that 15% of booking attempts\nfall with \"slot no longer available\" because another user booked the slot between the availability check and the\nbooking call. How should you r these tools?", "o": [{"k": "A", "v": "Modify book_appointment to return detailed failure information including currently available alternative\nslots when the requested slot is unavailable, enabling the agent to retry with a di time."}, {"k": "B", "v": "Keep both tools but add retry logic to the agent's system prompt, instructing it to call get_available_slots\nagain and select a different time if booking fails."}, {"k": "C", "v": "Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring the\nagent to call it between checking availability and booking."}, {"k": "D", "v": "Combine both tools into a single find_and_book_appointment that atomically checks availability and books,\nreturning either the confirmed booking or available alternatives."}], "a": "D", "e": "A. Modify book_appointment to return detailed failure information including currently available alternative\nslots when the requested slot is unavailable, enabling the agent to retry with a different time. ❌ Incorrect.\nThis improves recovery but does not fix the race condition between availability check and booking.\nB. Keep both tools but add retry logic to the agent's system prompt, instructing it to call\nget_available_slots again and select a different time if booking fails. ❌ Incorrect.\nThis still suffers from the same race condition and relies on agent behavior rather than fixing the underlying\nissue.\nC. Add a hold_slot(provider_id, slot_time) tool that creates a 60 second temporary reservation, requiring\nthe agent to call it between checking availability and booking. ❌ Incorrect.\nThis reduces the issue but introduces additional complexity and still requires multiple steps that can fail.\nD. Combine both tools into a single find_and_book_appointment that atomically checks availability and\nbooks, returning either the confirmed booking or available alternatives. ✅ Correct.\nThis eliminates the race condition by making the operation atomic, ensuring consistency and reliability."}, {"n": 26, "q": "Your agent has a log_workout tool that accepts exercise_type (string), value (number), and measurement (string).\nProduction monitoring shows the agent frequently passes mismatched combinations-using measurement: \"reps\"\nfor cardio exercises like running, or measurement: \"miles\" for strength exercises like bench press. Your exercises\nnaturally divide into two categories: cardio (measured in time or distance) and strength (measured in reps and\nsets). 23% of tool calls have invalid combinations. What approach would most effectively reduce these errors?", "o": [{"k": "A", "v": "Implement server-side validation returning descriptive errors for invalid combinations, allowing the agent to\nretry with corrections."}, {"k": "B", "v": "Add enum constraints on measurement limiting values to \"minutes\", \"miles\", \"reps\", or \"sets\" to prevent\narbitrary measurement strings."}, {"k": "C", "v": "Add explicit examples to the tool description showing valid combinations (e.g., \"For running: use minutes or\nmiles. For push-ups: use reps\") with constraints for each exercise category."}, {"k": "D", "v": "Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and\nlog_strength_workout (with reps and sets parameters)."}], "a": "D", "e": "A. Implement server-side validation returning descriptive errors for invalid combinations, allowing the\nagent to retry with corrections. ❌ Incorrect.\nThis catches errors after they occur but does not prevent them, leading to wasted turns and inefficiency.\nB. Add enum constraints on measurement limiting values to \"minutes\", \"miles\", \"reps\", or \"sets\" to prevent\narbitrary measurement strings. ❌ Incorrect.\nThis restricts values but does not prevent invalid combinations (e.g., still allows \"miles\" for bench press).\nC. Add explicit examples to the tool description showing valid combinations (e.g., \"For running: use minutes\nor miles. For push-ups: use reps\") with constraints for each exercise category. ❌ Incorrect.\nHelpful guidance, but not enforceable—agents can still make mistakes.\nD. Split into log_cardio_workout (with duration_minutes or distance_miles parameters) and\nlog_strength_workout (with reps and sets parameters). ✅ Correct.\nThis enforces correctness at the schema level by eliminating invalid parameter combinations entirely,\nsignificantly reducing errors."}, {"n": 27, "q": "Your MCP server includes archive_file(file_id) and delete_file(file_id) tools. Production logs show the agent calls\ndelete_file when users ask to \"remove old backups,\" policy requires archiving backup files. Both tools currently\nhave minimal descriptions: \"Archives a file\" and \"Deletes a file.\" Which change most directly improves tool\nselection?", "o": [{"k": "A", "v": "Add a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes."}, {"k": "B", "v": "Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an error\nmessage suggesting archive_file."}, {"k": "C", "v": "Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to\ndelete_file."}, {"k": "D", "v": "Add few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\"\nshould use archive_file."}], "a": "C", "e": "A. Add a confirmation step that requires users to type \"CONFIRM DELETE\" before delete_file executes. ❌\nIncorrect.\nThis prevents accidental execution but does not improve the agent’s tool selection decision.\nB. Implement server-side validation that rejects delete_file calls for files tagged as backups, returning an\nerror message suggesting archive_file. ❌ Incorrect.\nThis enforces policy after the wrong choice is made but does not directly improve initial selection.\nC. Expand tool descriptions to clarify use cases, adding guidance like \"Do not use for backup files\" to\ndelete_file. ✅ Correct.\nClear, specific descriptions directly influence the agent’s tool selection reasoning, making it less likely to\nchoose the wrong tool.\nD. Add few-shot examples to the system prompt demonstrating that requests involving \"backup\" or \"old\"\nshould use archive_file. ❌ Incorrect.\nHelpful, but less direct and less reliable than improving the tool descriptions themselves."}, {"n": 28, "q": "Your CRM agent's delete_contact tool handles requests like \"delete the duplicate entry for Acme Corp.\" The\ndatabase contains similarly named records (e.g., \"Acme Corp,\" \"Acme Corporation,\" \"ACME Corp Inc.\"), and\nanalytics show 8% of deletions are reversed within 24 hours due to misidentified records. Users have also\ncomplained that the current multi-step confirmation flow adds too much friction to routine cleanup tasks. Which\napproach most effectively reduces the error rate while maintaining workflow efficiency?", "o": [{"k": "A", "v": "Present matched records with differentiating fields and require single-click confirmation of the intended\ntarget before executing deletion."}, {"k": "B", "v": "Require users to supply the exact record ID from the CRM Interface rather than using natural language\nreferences to contact names."}, {"k": "C", "v": "Deploy automated duplicate detection that identifies and merges probable duplicates, removing the need for\nmanual deletion requests."}, {"k": "D", "v": "Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down the\ndeletion workflow."}], "a": "A", "e": "A. Present matched records with differentiating fields and require single-click confirmation of the intended\ntarget before executing deletion. ✅ Correct.\nThis directly addresses ambiguity by showing clear distinctions between similar records while keeping the\nworkflow fast with a lightweight confirmation step.\nB. Require users to supply the exact record ID from the CRM interface rather than using natural language\nreferences to contact names. ❌ Incorrect.\nThis reduces errors but adds significant friction and hurts usability for routine tasks.\nC. Deploy automated duplicate detection that identifies and merges probable duplicates, removing the\nneed for manual deletion requests. ❌ Incorrect.\nHelpful as a separate improvement, but it doesn’t solve incorrect deletions during manual requests.\nD. Implement soft-delete with a 30-day recovery window so users can undo mistakes without slowing down\nthe deletion workflow. ❌ Incorrect.\nThis mitigates impact after errors occur but does not reduce the error rate itself."}, {"n": 29, "q": "After Implementing tool use with strict schema definitions, JSON syntax errors are eliminated, but 5% of\nextractions still have valid JSON with empty arrays or null values for required fields like citations and\nmethodology. Spot-checking reveals that source documents contain this information, but in varied formats—Inline\ncitations vs. bibliographies, methodology sections vs. details embedded in Introductions. What's the most effective\nway to address these failures?", "o": [{"k": "A", "v": "Modify your schema to make citations and methodology optional, and flag Incomplete records for manual\nreview rather than falling validation."}, {"k": "B", "v": "Build a regex-based post-processing layer that scans source documents for citation patterns and\nmethodology keywords, populating empty fields when the model falls to extract."}, {"k": "C", "v": "Add few-shot examples demonstrating extractions from documents with varied structures—showing how to\nidentify citations in different formats and locate methodology details across section types."}, {"k": "D", "v": "Implement retry logic that re-sends requests when validation detects empty required fields."}], "a": "C", "e": "A. Modify your schema to make citations and methodology optional, and flag incomplete records for\nmanual review rather than failing validation. ❌ Incorrect.\nThis lowers data quality standards and avoids solving the extraction problem.\nB. Build a regex-based post-processing layer that scans source documents for citation patterns and\nmethodology keywords, populating empty fields when the model  solve ambiguity—it’s different\nfrom “unclear”.\nB. Allow empty arrays for pros/cons as valid output, and add \"unclear\" as the sentiment enum ✅ Correct.\nThis prevents fabrication by allowing explicitly empty outputs when no details are present, and “unclear”\nhandles ambiguous or sarcastic sentiment appropriately.\nC. Add an extraction_confidence field (0.0–1.0) for each value, and filter outputs where any confidence falls\nbelow a threshold. ❌ Incorrect.\nThis adds complexity but doesn’t prevent fabrication or resolve ambiguity in outputs.\nD. Allow null values for pros/cons, and add \"unclear\" to the sentiment enum. ❌ Incorrect.\nNulls are less consistent than empty arrays for structured outputs and can complicate downstream\nprocessing."}, {"n": 31, "q": "Your extraction system implements automatic retries when validation fails. On each retry, the specific validation\nerror is appended to the prompt. This retry-with-error-feedback approach resolves most failures within 2-3\nattempts. For which failure pattern would additional retries be LEAST effective?", "o": [{"k": "A", "v": "The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in the\ninput"}, {"k": "B", "v": "The model extracts citation counts as locale-formatted strings (\"1234\") when the schema requires integers"}, {"k": "C", "v": "The model extracts dates as ISO 8601 datetime strings (\"2003-03-15T00:00:00Z\") when the schema requires\nonly the date portion."}, {"k": "D", "v": "The model extracts keywords as a nested object organized by category when the schema requires a flat\narray of strings"}], "a": "A", "e": "A. The model extracts \"et al.\" for co-authors when the full list exists only in an external document not in\nthe input ✅ Correct.\nRetries won’t help because the required information is not present in the input context. The model cannot\nrecover missing data through repeated attempts.\nB. The model extracts citation counts as locale-formatted strings (\"1234\") when the schema requires\nintegers ❌ Incorrect.\nThis is a formatting issue that can be corrected through retries with validation feedback.\nC. The model extracts dates as ISO 8601 datetime strings (\"2003-03-15T00:00:00Z\") when the schema\nrequires only the date portion (YYYY-MM-DD) ❌ Incorrect.\nAlso a format mismatch, which retries can fix easily.\nD. The model extracts keywords as a nested object organized by category when the schema requires a flat\narray of strings ❌ Incorrect.\nThis is a structural mismatch that can typically be corrected with retry feedback."}, {"n": 32, "q": "Your invoice extraction uses tool use with strict JSON schemas. JSON syntax errors never occur, but 12% of\nextractions fail semantic validation--for example, line Item amounts don't extracted total, or vendor IDs don't\nmatch valid formats. These failures currently route to manual review. What's the most effective approach to\nreduce manual review volume while m accuracy?", "o": [{"k": "A", "v": "Retry the extraction up to 3 times when validation fallis, accepting the first result that passes validation."}, {"k": "B", "v": "Implement post-processing logic that automatically corrects common amors, such as recalculating totais\nfrom line items when sums don't match."}, {"k": "C", "v": "When validation falls, make a follow-up request with the document, extraction, and validation errors for\nmodel correction."}, {"k": "D", "v": "Add stricter schema constraints with detailed field descriptions to prevent the model from generating invalid\nvalues initially."}], "a": "C", "e": "A. Retry the extraction up to 3 times when validation fails, accepting the first result that passes validation.\n❌ Incorrect.\nRetries without targeted feedback often repeat the same mistakes and don’t reliably fix semantic\ninconsistencies.\nB. Implement post-processing logic that automatically corrects common errors, such as recalculating\ntotals from line items when sums don't match. ❌ Incorrect.\nWhile useful for specific cases, this is narrow and brittle, and doesn’t address broader validation failures like\nincorrect IDs.\nC. When validation fails, make a follow-up request with the document, extraction, and validation errors for\nmodel correction. ✅ Correct.\nThis provides targeted feedback, enabling the model to fix specific issues, significantly reducing manual\nreview while maintaining accuracy.\nD. Add stricter schema constraints with detailed field descriptions to prevent the model from generating\ninvalid values initially. ❌ Incorrect.\nSchema improvements help upfront, but they cannot fully prevent semantic errors like mismatched totals."}, {"n": 33, "q": "Your team is extracting structured data from 50,000 legacy legal contracts under a two-week deadline. Initial\ntesting with 500 sample documents shows 82% pass JSON schema first attempt, while the remaining 18% fall due\nto diverse issues—missing required fields, malformed dates, and incorrectly identified parties. Documents that fail\ntypically need refinements targeting their specific failure modes before extraction succeeds. Which batch\nprocessing strategy is the most cost-efficient while still meeting the deadline?", "o": [{"k": "A", "v": "Split documents into 10 sequential batches of 5,000 each, analysing results and refining prompts between\nbatches to improve extraction quality progressively."}, {"k": "B", "v": "Submit all 50,000 documents via batch API, then submit failed extractions in successive batches—refining\nprompts between each batch—until all documents pass validation."}, {"k": "C", "v": "Use the real-time API for all 50,000 documents since the batch API's 24-hour processing window creates\nunacceptable deadline risk."}, {"k": "D", "v": "Process 2,000 sample documents via real time API to identify failure patterns and refine prompts, then batch\nprocess all 50,000 with the optimized prompts."}], "a": "B", "e": "A. Split documents into 10 sequential batches of 5,000 each,
