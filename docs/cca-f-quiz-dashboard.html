patterns with predefined default interpretations, having the\nassistant respond with those defaults without stating the assumptions made."}], "a": "B", "e": "A. Limit the assistant to one clarifying question per turn, using conversation history to accumulate answers\nover multiple exchanges rather than requesting everything upfront. ❌ Incorrect.\nThis reduces immediate friction, but it can make resolution slower and still prolong ambiguity across multiple\nturns, potentially frustrating users who want faster outcomes.\nB. Modify the system prompt to instruct the assistant to make reasonable assumptions from available\ncontext, state those assumptions explicitly, and offer to adjust if the interpretation is wrong. ✅ Correct.\nThis best balances usability and accuracy: the assistant provides immediate value, avoids overload of\nquestions, and maintains transparency so users can correct assumptions quickly if needed.\nC. Add a preprocessing step using a smaller model to classify request ambiguity on a 1-5 scale, routing\nhigh-ambiguity requests to a clarification dialog and low-ambiguity requests directly to the assistant. ❌\nIncorrect.\nThis adds system complexity and still risks unnecessary gating or misclassification, increasing friction or\nincorrect routing.\nD. Create a lookup table of common request patterns with predefined default interpretations, having the\nassistant respond with those defaults without stating the assumptions made. ❌ Incorrect.\nHidden assumptions reduce trust and can lead to incorrect outputs without user awareness or correction."}, {"n": 73, "q": "Users frequently refine their search criteria mid-conversation. You notice a pattern: when users say things like\n\"Actually, let's raise the budget to $650K\" or \"I'd prefer a condo now instead of a house,\" the assistant sometimes\ncontinues referencing the original preferences in later responses—even though the updates are clearly present in\nthe conversation history. Context usage is only at 35% capacity. Which solution most reliably ensures the model\nuses the current preferences?", "o": [{"k": "A", "v": "Maintain a structured state object with current preferences, update it on changes, and include it in each\nrequest."}, {"k": "B", "v": "Implement conversation pruning to remove turns containing outdated preferences, ensuring only current\nones remain in context."}, {"k": "C", "v": "Include few-shot examples showing the assistant correctly acknowledging and applying preference changes\nin responses."}, {"k": "D", "v": "Add system prompt instructions emphasizing that the model should always prioritize the most recently\nstated preferences over earlier ones."}], "a": "A", "e": "A. Maintain a structured state object with current preferences, update it on changes, and include it in each\nrequest. ✅ Correct.\nThis is the most reliable solution because it externalizes “truth” into a single authoritative state, preventing\nthe model from having to infer which preference is current across many turns.\nB. Implement conversation pruning to remove turns containing outdated preferences, ensuring only current\nones remain in context. ❌ Incorrect.\nPruning is risky because earlier messages may still contain important constraints or rationale; removing them\ncan break continuity and lead to unintended loss of context.\nC. Include few-shot examples showing the assistant correctly acknowledging and applying preference\nchanges in responses. ❌ Incorrect.\nExamples help behavior, but they do not guarantee consistent override of earlier conflicting context in long\nconversations.\nD. Add system prompt instructions emphasizing that the model should always prioritize the most recently\nstated preferences over earlier ones. ❌ Incorrect.\nThis is helpful but not reliable enough on its own—models can still misinterpret or fail to consistently resolve\nconflicts without a structured state."}, {"n": 74, "q": "Your conversational AI tutor has a 2,800-token system prompt containing teaching methodology, persona\nguidelines, and detailed written instructions for adapting explanations to different proficiency levels. User testing\nreveals that in conversations exceeding 12 turns (approximately 4,000 tokens of conversation history), the\nassistant increasingly ignores the proficiency-adaptation guidelines, defaulting to intermediate-level explanations\nregardless of the learner's stated level. What's the most effective approach to ensure consistent adherence to\nthese guidelines throughout extended conversations?", "o": [{"k": "A", "v": "Inject a condensed reminder of the proficiency requirements into the conversation as a system message\nevery 4-5 turns."}, {"k": "B", "v": "Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate responses at\neach proficiency level, showing concrete differences in vocabulary, complexity, and explanation depth."}, {"k": "C", "v": "Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final section\nimmediately before the conversation history begins."}, {"k": "D", "v": "After each assistant response, make a separate API call to evaluate whether the difficulty level matched the\nlearner's profile, regenerating responses that don't align."}], "a": "B", "e": "A. Inject a condensed reminder of the proficiency requirements into the conversation as a system message\nevery 4–5 turns. ❌ Incorrect.\nThis is a mitigation strategy, but it’s operationally inefficient and still treats the symptom (drift over long\ncontext) rather than improving how the model reliably learns and applies the rule in the first place.\nB. Replace the verbose proficiency guidelines with few-shot examples demonstrating appropriate\nresponses at each proficiency level, showing concrete differences in vocabulary, complexity, and\nexplanation depth. ✅ Correct.\nThis is the most effective fix because few-shot examples strongly anchor behavior. Instead of relying on long,\nabstract instructions that degrade in influence over long contexts, the model gets clear behavioral patterns\nit can consistently imitate, improving adherence across extended conversations.\nC. Restructure the system prompt to place the proficiency-adaptation rules in a clearly-marked final\nsection immediately before the conversation history begins. ❌ Incorrect.\nThis can slightly improve recall but does not address the core weakness of long, abstract rule blocks losing\neffectiveness over time.\nD. After each assistant response, make a separate API call to evaluate whether the difficulty level matched\nthe learner's profile, regenerating responses that don't align. ❌ Incorrect.\nThis is expensive, slow, and unnecessary when prompt design improvements can solve the issue."}, {"n": 75, "q": "After deploying an updated system prompt that improves response quality, users with multi-session conversations\nspanning several weeks report that the assistant now contradicts its earlier statements and has a noticeably\ndifferent communication style. New users don't experience these issues.\nWhat's the best approach to resolve this?", "o": [{"k": "A", "v": "Regenerate summaries of existing conversations using the new prompt and replace the stored histories to\nalign past context with current behavior."}, {"k": "B", "v": "Add a transition message when sessions resume explaining that the assistant has been updated and behavior\nmay differ."}, {"k": "C", "v": "Version system prompts and associate each conversation with the prompt version under which it started,\napplying updates only to new conversations."}, {"k": "D", "v": "Add instructions to the new system prompt directing the assistant to maintain consistency with any prior\nstatements in the conversation history."}], "a": "C", "e": "A. Regenerate summaries of existing conversations using the new prompt and replace the stored histories\nto align past context with current behavior. ❌ Incorrect.\nThis rewrites history and can distort or erase what users actually said, creating continuity risks and potential\ninaccuracies.\nB. Add a transition message when sessions resume explaining that the assistant has been updated and\nbehavior may differ. ❌ Incorrect.\nThis improves transparency but does not solve the core problem of inconsistent behavior across sessions.\nC. Version system prompts and associate each conversation with the prompt version under which it started,\napplying updates only to new conversations. ✅ Correct.\nThis is the most robust solution because it preserves behavioral consistency within a conversation over time,\navoiding contradictions caused by mid-stream prompt changes.\nD. Add instructions to the new system prompt directing the assistant to maintain consistency with any prior\nstatements in the conversation history. ❌ Incorrect.\nThis helps slightly, but it cannot reliably override changes in underlying behavior introduced by prompt\nupdates."}, {"n": 76, "q": "The coordinator agent has AgentDefinitions configured for all four specialized subagents, each with appropriate\ndescriptions, prompts, and tool restrictions. During testing, you notice the coordinator correctly reasons about\nwhen to delegate—it generates messages like \"I'll ask the web search agent to find sources on this topic\"—but no\nsubagent execution ever occurs. The coordinator then proceeds as if the delegation happened and continues with\nincomplete information. Logs show no errors. What is the most likely cause?", "o": [{"k": "A", "v": "The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before the\nsubagent type parameter can be specified."}, {"k": "B", "v": "The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about delegation,\nit cannot invoke the tool required to spawn subagents."}, {"k": "C", "v": "Subagent context isolation means task descriptions from the coordinator don't automatically reach\nsubagents; you need to configure explicit context forwarding in ClaudeAgentOptions."}, {"k": "D", "v": "The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly list the\navailable subagent types, preventing the model from knowing they can be invoked."}], "a": "B", "e": "A. The coordinator's max_tokens setting is too low, causing the Task tool invocation to be truncated before\nthe subagent type parameter can be specified. ❌ Incorrect.\nIf this were the cause, you’d typically see partial tool calls or parsing errors in logs—not silent absence of tool\nexecution.\nB. The coordinator's allowedTools configuration doesn't include \"Task\", so while it can reason about\ndelegation, it cannot invoke the tool required to spawn subagents. ✅ Correct.\nThis exactly matches the symptom: the model plans to delegate (reasoning is fine), but cannot execute the\ntool call, so no subagent runs and no errors appear at the reasoning level.\nC. Subagent context isolation means task descriptions from the coordinator don't automatically reach\nsubagents; you need to configure explicit context forwarding in ClaudeAgentOptions. ❌ Incorrect.\nThis would affect what subagents receive, not whether they are spawned at all.\nD. The AgentDefinitions are configured correctly, but the coordinator's system prompt doesn't explicitly\nlist the available subagent types, preventing the model from knowing they can be invoked. ❌ Incorrect.\nThe model is clearly aware of delegation (it verbalizes it), so discovery is not the issue—execution capability\nis.\nKey idea: reasoning about tools ≠ permission to use tools; missing tool authorization leads to silent non-\nexecution."}, {"n": 77, "q": "Production reviews reveal inconsistent handling of uncertainty in final reports. Sometimes conflicting subagent\nfindings are synthesized into a single confident statement (losing nuance), while other times reports over-hedge\nwith excessive qualifications (becoming unhelpful). When the web search agent returns \"industry analysts\nestimate $50B market size (methodology varies)\" and the document analysis agent returns \"peer-reviewed study\nestimates $35B (±$7B, 95% CI),\" the coordinator either picks one arbitrarily or produces vague statements like\n\"the market may be $35B-$50B depending on factors.\" What systematic approach best addresses this?", "o": [{"k": "A", "v": "Implement a confidence calibration layer that normalizes subagent uncertainty expressions to standardized\nprobability scores (0.0-1.0), then weight-average findings by their calibrated confidence."}, {"k": "B", "v": "Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established\nfindings from contested ones, preserving original source characterizations and methodological context."}, {"k": "C", "v": "Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain\ninformation before it reaches the coordinator."}, {"k": "D", "v": "Add a verification subagent that cross-references findings across sources, only passing claims to synthesis\nthat are corroborated by at least two independent sources."}], "a": "B", "e": "A. Implement a confidence calibration layer that normalizes subagent uncertainty expressions to\nstandardized probability scores (0.0-1.0), then weight-average findings by their calibrated confidence. ❌\nIncorrect.\nThis forces incompatible uncertainty types (market estimates, confidence intervals, analyst opinions) into a\nsingle numeric scale, which can distort meaning and oversimplify fundamentally different methodologies.\nB. Instruct the synthesis agent to structure reports with explicit sections distinguishing well-established\nfindings from contested ones, preserving original source characterizations and methodological context. ✅\nCorrect.\nThis directly addresses the root problem: loss of nuance. It preserves multiple viewpoints, uncertainty types,\nand methodological differences, while still producing a coherent, structured report instead of collapsing\neverything into a misleading single value or vague range.\nC. Configure subagents to only report findings meeting a high-confidence threshold, filtering uncertain\ninformation before it reaches the coordinator. ❌ Incorrect.\nThis removes the very uncertainty signals needed for proper synthesis and biases outputs toward false\ncertainty.\nD. Add a verification subagent that cross-references findings across sources, only passing claims to\nsynthesis that are corroborated by at least two independent sources. ❌ Incorrect.\nThis is too restrictive for domains like market sizing where disagreement is meaningful and expected, not a\nsign of invalid data."}, {"n": 78, "q": "You've configured the system so that all four subagents have access to the complete set of 18 tools. During\ntesting, agents frequently call tools outside their specialization—the synthesis agent attempts web searches, and\nthe report generator tries to analyze documents. What is the primary cause of this poor tool selection behavior?", "o": [{"k": "A", "v": "Choosing from 18 tools instead of 4-5 relevant ones increases decision complexity beyond reliable selection\nthresholds."}, {"k": "B", "v": "The agents' role descriptions in their system prompts conflict with having access to tools outside that role."}, {"k": "C", "v": "The tool definitions consume too much context window space, leaving insufficient room for task content."}, {"k": "D", "v": "The coordinator cannot track which capabilities each subagent has, leading to misrouted tasks."}], "a": "A", "e": "A. Choosing from 18 tools instead of 4–5 relevant ones increases decision complexity beyond reliable\nselection thresholds. ✅ Correct.\nThis is the core issue: as the number of available tools grows, especially across multiple unrelated domains,\nthe model’s tool selection accuracy degrades due to increased choice entropy and decision load. Even if\neach tool is well-described, having too many options in the same context makes it harder for the model to\nreliably pick the correct one, leading to cross-role tool misuse.\nWhy the others are not correct:\nB. Role-description conflict ❌ Incorrect\nRole prompts influence behavior, but they don’t inherently break tool selection when tools are available.\nC. Context window usage ❌ Incorrect\nThere’s no indication of truncation or missing tool definitions—this is a selection problem, not a capacity\nproblem.\nD. Coordinator tracking issue ❌ Incorrect\nThe failure happens at the subagent decision level, not because the coordinator lacks awareness of tools."}, {"n": 79, "q": "The coordinator provides detailed step-by-step instructions to the web search subagent, specifying exact search\nqueries, source priorities, and date filters. Production monitoring reveals three issues: (1) the subagent reports\n\"insufficient results\" rather than trying alternative approaches when pre-specified searches fail, (2) research\nquality drops for emerging topics that don't match expected patterns, and (3) the subagent rarely surfaces\nvaluable tangential sources. What's the most effective way to improve subagent adaptability?", "o": [{"k": "A", "v": "Specify research goals and quality criteria (coverage breadth, source diversity, recency) rather than\nprocedural steps, letting the subagent determine its search strategy."}, {"k": "B", "v": "Add explicit fallback directives to the detailed instructions: \"If specified searches yield fewer than N results,\nattempt alternative query formulations before reporting failure.\""}, {"k": "C", "v": "Remove procedural details entirely, delegating with simple goals like \"research X thoroughly\" and relying on\nthe subagent's general capabilities."}, {"k": "D", "v": "Implement a topic classification step where the coordinator categorizes requests as \"well-defined\" or\n\"exploratory\" and uses different instruction styles for each category."}], "a": "A", "e": "A. Specify research goals and quality criteria (coverage breadth, source diversity, recency) rather than\nprocedural steps, letting the subagent determine its search strategy. ✅ Correct.\nThis is the most effective fix because it shifts from over-constrained instructions (procedural control) to\nobjective-driven autonomy, allowing the subagent to adapt when initial queries fail and to explore tangential\nbut relevant sources.\nB. Add explicit fallback directives to the detailed instructions: \"If specified searches yield fewer than N\nresults, attempt alternative query formulations before reporting failure.\" ❌ Incorrect.\nThis helps slightly, but it still locks behavior into predefined contingencies and doesn’t generalize to novel or\nemerging topics.\nC. Remove procedural details entirely, delegating with simple goals like \"research X thoroughly\" and\nrelying on the subagent's general capabilities. ❌ Incorrect.\nToo vague—removing structure entirely reduces reliability and makes output quality inconsistent.\nD. Implement a topic classification step where the coordinator categorizes requests as \"well-defined\" or\n\"exploratory\" and uses different instruction styles for each category. ❌ Incorrect.\nThis adds complexity and still relies on rigid instruction modes rather than enabling adaptive search behavior."}, {"n": 80, "q": "The synthesis agent receives summarized findings from the web search and document analysis agents, then\npasses a consolidated summary to the report generator. During testing, you discover the generated reports make\nfactual claims without proper citations—the report generator cannot attribute statements to their original sources\nbecause that metadata was lost during the summarization steps. What's the most effective approach to ensure\nproper source attribution in the final reports?", "o": [{"k": "A", "v": "Have each agent output structured data separating content summaries from source metadata (URLs,\ndocument names, page numbers)."}, {"k": "B", "v": "Have the report generator query the web search agent to re-locate sources for claims in the final report."}, {"k": "C", "v": "Skip summarization and pass full raw outputs from web search and document analysis directly to the report\ngenerator."}, {"k": "D", "v": "Instruct the synthesis agent to embed source references inline within its summary text using a consistent\ncitation format."}], "a": "A", "e": "A. Have each agent output structured data separating content summaries from source metadata (URLs,\ndocument names, page numbers). ✅ Correct.\nThis is the most reliable solution because it preserves provenance as first-class data, ensuring citations are\nnever lost during summarization. The report generator can then deterministically map claims back to their\noriginal sources.\nB. Have the report generator query the web search agent to re-locate sources for claims in the final report.\n❌ Incorrect.\nThis is inefficient and unreliable because it requires reverse-matching claims to sources, which can be\nambiguous or fail entirely.\nC. Skip summarization and pass full raw outputs from web search and document analysis directly to the\nreport generator. ❌ Incorrect.\nThis avoids the problem but is not scalable and leads to context bloat and degraded performance.\nD. Instruct the synthesis agent to embed source references inline within its summary text using a\nconsistent citation format. ❌ Incorrect.\nThis helps, but it still risks losing or breaking attribution during downstream transformations and does not\nenforce structured traceability."}, {"n": 81, "q": "A user is expanding the research system beyond its single web search agent by adding specialized data sources.\nThey add a financial API agent that returns structured JSON with revenue, margins, and growth rates; a news\nmonitoring agent that returns prose summaries of recent developments; and a patent analysis agent that returns\nstructured lists of technology areas. The synthesis agent combines these into executive briefings. Currently, it\nconverts everything to bullet points, causing financial comparisons to lose tabular clarity and news summaries to\nlose narrative flow. What change would most improve briefing quality?", "o": [{"k": "A", "v": "Update the synthesis agent to render each content type appropriately—financial data as tables, news as\nprose"}, {"k": "B", "v": "Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence"}, {"k": "C", "v": "Add a format conversion layer between subagents and synthesis that transforms all outputs to a common\nintermediate representation"}, {"k": "D", "v": "Standardize all subagent outputs to prose summaries with inline citations"}], "a": "A", "e": "A. Update the synthesis agent to render each content type appropriately—financial data as tables, news as\nprose ✅ Correct.\nThis works because it preserves the native structure of each data type at the point where it matters most\n(final synthesis). Financial data remains comparable in tabular form, news retains narrative coherence, and\npatents stay structured as categorized lists. The key improvement is that the synthesis layer becomes\nformat-aware instead of flattening everything into bullets, which is exactly what was causing quality loss.\nWhy the others are not correct:\nB. Standardize all subagent outputs to JSON with fields for claim, evidence, source, and confidence ❌\nIncorrect\nThis forces unrelated data types into a single schema and strips meaningful presentation structure like tables\nand narratives.\nC. Add a format conversion layer between subagents and synthesis ❌ Incorrect\nThis risks over-normalization into a lowest-common-denominator format, reducing expressiveness.\nD. Standardize all subagent outputs to prose summaries with inline citations ❌ Incorrect\nThis removes structure from financial and analytical data, reducing precision and comparability."}, {"n": 82, "q": "When the agent calls lookup order and receives order details showing the item was purchased 45 days ago, how\ndoes the agentic loop determine whether to call process refund escalate to human next?", "o": [{"k": "A", "v": "The agent executes the remaining steps in a tool sequence planned at the start of the request."}, {"k": "B", "v": "The order details are added to the conversation and the model reasons about which action to take."}, {"k": "C", "v": "The agent follows a pre-configured decision tree mapping order attributes to specific tool calls."}, {"k": "D", "v": "The orchestration layer automatically routes to the next tool based on the order's status field."}], "a": "B", "e": "B. The order details are added to the conversation and the model reasons about which action to take. ✅\nCorrect.\nIn an agentic loop, tool results (like “purchased 45 days ago”) are fed back into the model’s context, and the\nmodel re-evaluates the situation dynamically. It then decides whether to proceed with process_refund,\nescalate to a human, or take another action based on policy and the updated information.\nWhy the others are not correct:\nA. Fixed tool sequence planned at the start ❌ Incorrect\nAgentic systems are not static workflows; they adapt after each observation.\nC. Pre-configured decision tree ❌ Incorrect\nThis is rule-based automation, not LLM-driven reasoning.\nD. Orchestration layer automatically routes next tool call ❌ Incorrect\nThat removes the model’s reasoning role and turns it into deterministic routing."}, {"n": 83, "q": "The agent verifies customer identity through a multi-step process before resetting passwords. During testing, you\nnotice that after the customer answers the third verification question, the agent asks them to provide their name\nagain, as if the earlier exchange never happened. What's the most likely cause of this behavior?", "o": [{"k": "A", "v": "Claude's memory retention is limited to two conversational turns by default, requiring explicit configuration\nto extend it."}, {"k": "B", "v": "The prompt lacks instructions telling Claude to remember information across multiple exchanges."}, {"k": "C", "v": "The verification tool is clearing the agent's internal state after each successful validation step."}, {"k": "D", "v": "The conversation history isn't being passed in subsequent API requests."}], "a": "D", "e": "A. Claude's memory retention is limited to two conversational turns by default, requiring explicit\nconfiguration to extend it. ❌ Incorrect.\nThere is no fixed “two-turn memory limit” like this; context is determined by what the application sends, not a\nbuilt-in short memory window.\nB. The prompt lacks instructions telling Claude to remember information across multiple exchanges. ❌\nIncorrect.\nSystem prompts don’t control memory persistence. The model does not “forget” within context unless\ninformation is missing from input.\nC. The verification tool is clearing the agent's internal state after each successful validation step. ❌\nIncorrect.\nTools do not automatically reset conversational context unless explicitly designed to do so—and that would\nbe an application-level bug, not the most likely general cause.\nD. The conversation history isn't being passed in subsequent API requests. ✅ Correct.\nThis is the most likely cause. The model is stateless, so if prior messages aren’t included in each request, it\nbehaves as if earlier verification steps never happened—leading to repeated questions like asking for the\nname again."}, {"n": 84, "q": "When implementing your lookup_order MCP tool, the backend sometimes returns errors (e.g., \"Order not found\" or\ntemporary database failures). What is the correct pattern for communicating these errors back to the agent?", "o": [{"k": "A", "v": "Log the error server-side and return an empty result to avoid confusing the model"}, {"k": "B", "v": "Throw an exception from the tool handler so the agent framework can catch and log it"}, {"k": "C", "v": "Return the error message in the tool result content with the isError flag set to true"}, {"k": "D", "v": "Return a success response with a \"status\" field indicating the error type"}], "a": "C", "e": "A. Log the error server-side and return an empty result to avoid confusing the model ❌ Incorrect.\nThis hides critical failure information, making it impossible for the agent to distinguish “no data” from “system\nfailure.”\nB. Throw an exception from the tool handler so the agent framework can catch and log it ❌ Incorrect.\nExceptions are useful internally, but the agent still needs a structured tool response; raw exceptions don’t\nreliably propagate useful context to the model.\nC. Return the error message in the tool result content with the isError flag set to true ✅ Correct.\nThis is the proper MCP pattern: the tool explicitly signals failure using isError: true, while still providing a\nreadable error message so the agent can decide whether to retry, escalate, or inform the user.\nD. Return a success response with a \"status\" field indicating the error type ❌ Incorrect.\nThis is misleading because it treats failures as successful responses, which confuses downstream reasoning\nand tool orchestration."}, {"n": 85, "q": "Evaluation shows 94% extraction accuracy on short meeting transcripts (<30 minutes) but only 68% on longer\ntranscripts (>60 minutes) where discussions meander and key information is scattered throughout. Transcripts of\nboth lengths fit within the model's context window. What pattern most effectively improves accuracy on complex,\nlengthy documents?", "o": [{"k": "A", "v": "Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered Information."}, {"k": "B", "v": "Split lengthy transcripts Into chunks, extract from each chunk separately, then merge and deduplicate the\nresults."}, {"k": "C", "v": "Upgrade to a more capable model tier for the extraction task,"}, {"k": "D", "v": "Add a pre-extraction step where the model summarizes key discussions and conclusions before performing\nstructured extraction."}], "a": "B", "e": "A. Add few-shot examples demonstrating correct extraction from lengthy meetings with scattered\ninformation. ❌ Incorrect.\nExamples help somewhat, but they do not fundamentally solve the challenge of maintaining attention and\nconsistency across long, meandering documents.\nB. Split lengthy transcripts into chunks, extract from each chunk separately, then merge and deduplicate\nthe results. ✅ Correct.\nChunking reduces cognitive load per extraction pass and improves recall of scattered details. Merging and\ndeduplication then reconstruct the final structured output more reliably than processing the entire long\ntranscript in one pass.\nC. Upgrade to a more capable model tier for the extraction task. ❌ Incorrect.\nA stronger model may help marginally, but the core issue is long-document attention and information\ndistribution, which chunking addresses more directly and efficiently.\nD. Add a pre-extraction step where the model summarizes key discussions and conclusions before\nperforming structured extraction. ❌ Incorrect.\nSummarization can omit details needed for extraction, especially when important information is scattered or\nmentioned briefly."}, {"n": 86, "q": "Your system has been running for 3 weeks and human reviewers have corrected 847 extractions. Analysis reveals\na recurring pattern: when recipes use informal measurements like \"a handful\" or \"a splash,\" the model either\ninvents specific amounts or leaves fields empty—accounting for 23% of all corrections. How should you use this\nfeedback to improve extraction accuracy?", "o": [{"k": "A", "v": "Update your JSON schema to add a \"measurement_type\" enum field (precise/informal)."}, {"k": "B", "v": "Add few-shot examples to your prompt demonstrating correct handling of informal measurements—\nextracting them verbatim rather than converting or omitting them."}, {"k": "C", "v": "Implement a post-processing layer that uses pattern matching to detect informal measurement phrases in\nsource text and automatically populate values when the extraction is empty."}, {"k": "D", "v": "Fine-tune the model on the 847 corrected extractions."}], "a": "B", "e": "A. Update your JSON schema to add a \"measurement_type\" enum field (precise/informal). ❌ Incorrect.\nThis may help classify outputs, but it does not teach the model how to correctly extract informal\nmeasurements instead of hallucinating or omitting them.\nB. Add few-shot examples to your prompt demonstrating correct handling of informal measurements—\nextracting them verbatim rather than converting or omitting them. ✅ Correct.\nThis directly targets the observed failure mode by showing the model the desired behavior on real edge cases,\nimproving consistency without forcing unsupported normalization.\nC. Implement a post-processing layer that uses pattern matching to detect informal measurement phrases\nin source text and automatically populate values when the extraction is empty. ❌ Incorrect.\nPattern matching is brittle and does not address cases where the model invents incorrect quantities instead\nof leaving fields empty.\nD. Fine-tune the model on the 847 corrected extractions. ❌ Incorrect.\nFine-tuning is expensive and unnecessary for a narrow, well-defined extraction issue that can be effectively\ncorrected through targeted prompting examples.\nKey idea: use real correction data to create targeted few-shot examples that teach the desired extraction\nbehavior on recurring edge cases."}, {"n": 87, "q": "Production monitoring shows that follow-up queries like \"summarize what we learned about market trends\"\nconsistently take 40+ seconds. Investigation reveals the coordinator spawns the synthesis subagent for each\nsummarization request, passing 80K+ tokens of accumulated findings. The coordinator already has these findings\nin its context from orchestrating the research. What's the most effective way to improve response time for these\nfollow-up summaries?", "o": [{"k": "A", "v": "Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the\nsame research findings."}, {"k": "B", "v": "Have the coordinator handle straightforward summarization requests directly using its existing context,\nreserving subagent spawning for complex analy"}, {"k": "C", "v": "Spawn the synthesis subagent with reduced context and have it request specific findings from the\ncoordinator on-demand."}, {"k": "D", "v": "Pre-generate and cache summaries at multiple granularities whenever new findings accumulate."}], "a": "B", "e": "A. Enable prompt caching on the synthesis subagent to reduce the overhead of repeatedly transferring the\nsame research findings. ❌ Incorrect.\nCaching helps with repeated prompt transfer costs, but it still requires spawning the subagent and processing\na huge context for relatively simple follow-up summaries.\nB. Have the coordinator handle straightforward summarization requests directly using its existing context,\nreserving subagent spawning for complex analysis tasks. ✅ Correct.\nThis avoids unnecessary orchestration overhead. Since the coordinator already possesses the accumulated\nfindings in-context, simple summarization can be done immediately without rehydrating 80K+ tokens into\nanother agent call.\nC. Spawn the synthesis subagent with reduced context and have it request specific findings from the\ncoordinator on-demand. ❌ Incorrect.\nThis adds coordination complexity and multiple back-and-forth exchanges, which can increase latency rather\nthan reduce it.\nD. Pre-generate and cache summaries at multiple granularities whenever new findings accumulate. ❌\nIncorrect.\nUseful for some systems, but over-engineered here and inefficient if many summaries are never requested."}, {"n": 88, "q": "The document analysis agent has a single analyze_document tool that takes a document and a free-text\ninstruction parameter. During evaluation, requests like \"extract the key financial metrics\" often return narrative\nsummaries, while \"summarize the methodology\" sometimes returns raw data tables. The synthesis agent reports\nthat 35% of analysis results require re-requests with clarified instructions. What's the most effective way to\nimprove reliability?", "o": [{"k": "A", "v": "Enhance the tool description with detailed examples showing how different instruction phrasings should\nmap to different output formats"}, {"k": "B", "v": "Keep the single tool but add an analysis_type enum parameter requiring explicit selection between\nextraction, summarization, and verification modes"}, {"k": "C", "v": "Split the generic tool into purpose-specific tools - extract_data_points, summarize_content,\nverify_claim_against_source - each with defined input/output contracts"}, {"k": "D", "v": "Have the coordinator pre-classify each analysis request before passing instructions to the document\nanalysis agent"}], "a": "C", "e": "A. Enhance the tool description with detailed examples showing how different instruction phrasings should\nmap to different output formats ❌ Incorrect.\nExamples help somewhat, but the core problem is that the tool itself is overloaded with multiple\nresponsibilities and ambiguous behavior.\nB. Keep the single tool but add an analysis_type enum parameter requiring explicit selection between\nextraction, summarization, and verification modes ❌ Incorrect.\nThis improves clarity, but the tool still mixes fundamentally different workflows and output contracts into one\ninterface.\nC. Split the generic tool into purpose-specific tools — extract_data_points, summarize_content,\nverify_claim_against_source — each with defined input/output contracts ✅ Correct.\nThis most effectively improves reliability because each tool has a clear purpose, constrained behavior, and\npredictable output format, dramatically reducing ambiguity and re-requests.\nD. Have the coordinator pre-classify each analysis request before passing instructions to the document\nanalysis agent ❌ Incorrect.\nThis shifts ambiguity upstream but does not solve the underlying problem of a single overloaded tool with\ninconsistent outputs."}, {"n": 89, "q": "The system routes documents with extraction confidence below 85% to human review. A quarterly audit reveals\nthat 12% of high-confidence extractions (>85%) also contain errors—cases where the model finds plausible-but-\nincorrect values. Error sources vary: comparison tables showing competitor specs, appendices referencing\ndifferent product variants, and ambiguous phrasing the model misinterprets. You need a sustainable strategy to\ncatch these high-confidence errors and measure whether improvements reduce the error rate over time. What\napproach is most effective?", "o": [{"k": "A", "v": "Implement heuristic rules that flag documents containing comparison tables or appendices for review\nregardless of confidence score."}, {"k": "B", "v": "Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions weekly,\nenabling error rate measurement and novel pattern detection."}, {"k": "C", "v": "Add a verification pass that re-extracts from each high-confidence document, flagging cases where the two\nextraction attempts produce different results."}, {"k": "D", "v": "Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human review."}], "a": "B", "e": "A. Implement heuristic rules that flag documents containing comparison tables or appendices for review\nregardless of confidence score. ❌ Incorrect.\nThis targets only currently known failure patterns and will miss new classes of high-confidence errors over\ntime.\nB. Implement stratified random sampling reviewing a fixed percentage of high-confidence extractions\nweekly, enabling error rate measurement and novel pattern detection. ✅ Correct.\nThis is the most sustainable and statistically sound approach. It both:\nmeasures the true ongoing error rate in “trusted” outputs, and\nsurfaces emerging failure patterns that confidence scores miss.\nIt creates a continuous quality-monitoring feedback loop rather than patching isolated issues.\nC. Add a verification pass that re-extracts from each high-confidence document, flagging cases where the\ntwo extraction attempts produce different results. ❌ Incorrect.\nUseful for detecting instability, but repeated extraction can still confidently reproduce the same wrong\nanswer.\nD. Lower the confidence threshold from 85% to 70%, routing a larger volume of extractions to human\nreview. ❌ Incorrect.\nThis increases operational cost dramatically without specifically addressing hidden high-confidence errors."}, {"n": 90, "q": "Your extraction uses tool use with a JSON schema where property_type is defined as an enum: ['house',\n'apartment', \"condo\", \"townhouse\"]. After deployment, 8% of extractions fall schema validation. Investigation\nreveals listings mention many uncommon property types—\"studio\", \"loft\", \"duplex\", \"mobile home\", \"tiny house\",\n\"converted warehouse\"—and new types continue appearing regularly. What's the most effective long-term\nsolution?", "o": [{"k": "A", "v": "Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when\n\"other\" is selected."}, {"k": "B", "v": "Change property_type from an enum to a free-form string and implement a normalization step in post-\nprocessing."}, {"k": "C", "v": "Add few-shot examples to your prompt demonstrating how to map unexpected property types to the closest\nexisting enum value."}, {"k": "D", "v": "Continuously expand the enum to include newly observed property types and add monitoring for additional\nedge cases."}], "a": "A", "e": "A. Add an \"other\" value to your enum with a separate property_type_detail string field for specifics when\n\"other\" is selected. ✅ Correct.\nThis is the most robust long-term solution because it preserves schema validity while still allowing the system\nto capture new or uncommon property types without breaking validation. It also keeps structured consistency\nfor downstream systems.\nB. Change property_type from an enum to a free-form string and implement a normalization step in post-\nprocessing. ❌ Incorrect.\nThis sacrifices schema control and pushes complexity downstream, increasing inconsistency and processing\nburden.\nC. Add few-shot examples to your prompt demonstrating how to map unexpected property types to the\nclosest existing enum value. ❌ Incorrect.\nThis leads to forced misclassification and will not scale as new property types continue to appear.\nD. Continuously expand the enum to include newly observed property types and add monitoring for\nadditional edge cases. ❌ Incorrect.\nThis is operationally expensive and does not scale in dynamic domains where new categories appear\nfrequently."}, {"n": 91, "q": "Your extraction system parses e-commerce product descriptions to extract specifications like dimensions, weight,\nand materials into JSON. Despite having a well-defined schema, the model inconsistently extracts the \"materials\"\nfield—sometimes returning \"cotton blend\", other times \"Cotton/Polyester mix\", and occasionally omitting the field\nwhen material information is clearly present in the source. What's the most effective way to improve extraction\nconsistency?", "o": [{"k": "A", "v": "Set temperature to 0 to eliminate randomness and ensure deterministic outputs"}, {"k": "B", "v": "Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability"}, {"k": "C", "v": "Make the \"materials\" field required instead of optional in the schema to force the model to always extract a\nvalue"}, {"k": "D", "v": "Add few-shot examples showing 2-3 complete Input-output pairs with standardized material description\nformats"}], "a": "D", "e": "A. Set temperature to 0 to eliminate randomness and ensure deterministic outputs ❌ Incorrect.\nLower temperature improves consistency slightly, but it does not solve schema interpretation differences or\nmissing-field behavior when the model is uncertain.\nB. Switch to a more capable model tier since inconsistent extraction indicates insufficient model capability\n❌ Incorrect.\nThis is not primarily a capability issue; the model already sees the information but is inconsistent in\nnormalization and extraction behavior.\nC. Make the \"materials\" field required instead of optional in the schema to force the model to always\nextract a value ❌ Incorrect.\nForcing requirement does not guarantee correctness; it often increases hallucination when the model tries to\nfill missing or ambiguous data.\nD. Add few-shot examples showing 2–3 complete input-output pairs with standardized material description\nformats ✅ Correct.\nThis directly teaches the model the expected normalization pattern (e.g., “cotton blend” vs “cotton/polyester\nmix”) and when to consistently extract rather than omit, which is the core failure mode."}, {"n": 92, "q": "Documents arrive continuously throughout business hours and need structured data extracted. To reduce costs,\nyou want to use the Message Batches API (50% discount, up-to-24-hour processing window). Your SLA specifies\nthat extraction results must be available within 30 hours of document arrival with 99.9% reliability. Which batching\nstrategy is most appropriate?", "o": [{"k": "A", "v": "Submit batches every 4 hours containing documents from that window"}, {"k": "B", "v": "Submit batches every 6 hours containing documents from that window"}, {"k": "C", "v": "Submit a single batch at end of day containing all documents from that day"}, {"k": "D", "v": "Use the real-time API for all documents instead of batch processing"}], "a": "C", "e": "A. Submit batches every 4 hours containing documents from that window ❌ Incorrect\nThis is more frequent than necessary for a 30-hour SLA and reduces batching efficiency without improving\nreliability in a meaningful way.\nB. Submit batches every 6 hours containing documents from that window ❌ Incorrect\nStill unnecessarily frequent; it increases operational overhead without providing measurable SLA benefits\ncompared to less frequent batching.\nC. Submit a single batch at end of day containing all documents from that day ✅ Correct\nThis is the most efficient strategy. With a 24-hour batch processing window, end-of-day batching still\ncomfortably meets the 30-hour SLA while maximizing cost savings and operational simplicity.\nD. Use the real-time API for all documents instead of batch processing ❌ Incorrect\nThis guarantees speed but significantly increases cost and ignores the requirement to optimize for batch\nprocessing efficiency."}, {"n": 93, "q": "Your extraction pipeline processes restaurant menus and must output structured JSON with fields for item names,\ndescriptions, prices, and dietary tags. Some menus use inconsistent formatting—prices as \"$12\" vs \"12.00\", dietary\ninfo as icons vs text. What's the most reliable approach?", "o": [{"k": "A", "v": "Extract data as-is and normalize formats in post-processing code after Claude returns."}, {"k": "B", "v": "Define a strict output schema and include format normalization rules in your prompt."}, {"k": "C", "v": "Use separate extraction calls for each field to ensure consistent handling of each type."}, {"k": "D", "v": "Request multiple extraction attempts per document and select the most common format."}], "a": "B", "e": "B. Define a strict output schema and include format normalization rules in your prompt. ✅ Correct\nThis is the most reliable approach because it enforces structure through the schema while also guiding the\nmodel to normalize inconsistent inputs (like “$12” vs “12.00” and icon-based vs text-based dietary tags) at the\npoint of extraction. That reduces downstream ambiguity and avoids relying on post-processing fixes.\nWhy the others are not correct:\nA. Extract data as-is and normalize formats in post-processing code after Claude returns. ❌ Incorrect\nThis shifts complexity downstream and risks inconsistencies if extraction itself is already noisy or incomplete.\nC. Use separate extraction calls for each field to ensure consistent handling of each type. ❌ Incorrect\nThis increases cost and latency and can introduce cross-field inconsistency instead of improving reliability.\nD. Request multiple extraction attempts per document and select the most common format. ❌ Incorrect\nMajority voting does not guarantee correctness and is inefficient for structured extraction tasks."}, {"n": 94, "q": "Your system extracts event metadata (date, location, organizer, attendee_count) from news articles using a JSON\nschema with all nullable fields. During evaluation, you observe the model frequently generates plausible but\nincorrect values for fields not mentioned in the article-for example, outputting \"500\" for attendee_count when the\nsource contains no attendance information. What's the most effective way to reduce these false extractions?", "o": [{"k": "A", "v": "Make all schema fleids required (non-nullable) with strict validation rules to ensure the model only outputs\nverifiable data."}, {"k": "B", "v": "Add prompt instructions to return null for any field where information is not directly stated in the source."}, {"k": "C", "v": "Upgrade to a more capable model tier with improved instruction-following to reduce hallucination\ntendencies."}, {"k": "D", "v": "Add a post-processing step using a second LLM call to verify each extracted value exists in the source\ndocument."}], "a": "B", "e": "A. Make all schema fields required (non-nullable) with strict validation rules to ensure the model only\noutputs verifiable data. ❌ Incorrect\nMaking fields required doesn’t prevent hallucination; it often makes it worse because the model is forced to\ninvent values instead of leaving them blank.\nB. Add prompt instructions to return null for any field where information is not directly stated in the source.\n✅ Correct\nThis directly targets the root failure mode (hallucinating absent fields). It enforces a clear extraction rule: only\nextract explicitly supported data, otherwise return null, which is the correct behavior for structured\ninformation extraction.\nC. Upgrade to a more capable model tier with improved instruction-following to reduce hallucination\ntendencies. ❌ Incorrect\nA better model may reduce errors slightly, but the fundamental issue is missing extraction constraints, not\nmodel capability.\nD. Add a post-processing step using a second LLM call to verify each extracted value exists in the source\ndocument. ❌ Incorrect\nThis adds cost and latency and still relies on probabilistic verification rather than preventing hallucination at\nthe source."}, {"n": 95, "q": "Your research assistant helps users analyze academic papers over extended conversations. User testing reveals a\nrecurring issue: after conversations exceed 60K tokens, users ask follow-up questions requiring precise numerical\ndetails from papers discussed earlier—sample sizes, exact p-values, specific inclusion criteria. Your current\napproach summarizes paper discussions after 8 turns to stay within context limits. Users report that responses to\nthese precision-dependent questions are often hedged or inaccurate. What's the most effective architectural\nchange?", "o": [{"k": "A", "v": "Implement retrieval that re-injects relevant paper sections when the user's question suggests they need\nspecific numerical details."}, {"k": "B", "v": "Maintain a structured database of key facts extracted from each paper (sample sizes, statistics, methods)\nand retrieve relevant entries into context when precision-dependent questions are detected."}, {"k": "C", "v": "Keep source text from methodology and results sections in context permanently, while summarizing only the\nconversational discussion and interpretation portions."}, {"k": "D", "v": "Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve all\nnumerical details and statistical values."}], "a": "B", "e": "A. Implement retrieval that re-injects relevant paper sections when the user's question suggests they need\nspecific numerical details. ❌ Incorrect\nThis helps, but it is reactive and depends on correct detection at query time; it doesn’t ensure consistent\navailability of critical structured facts across the session.\nB. Maintain a structured database of key facts extracted from each paper (sample sizes, statistics,\nmethods) and retrieve relevant entries into context when precision-dependent questions are detected. ✅\nCorrect\nThis is the most effective architectural change. It separates stable factual data (structured facts store) from\nconversational history, ensuring that precise values like p-values and sample sizes remain accessible even\nafter summarization or long-context drift.\nC. Keep source text from methodology and results sections in context permanently, while summarizing\nonly the conversational discussion and interpretation portions. ❌ Incorrect\nThis is inefficient and quickly exhausts context window limits, especially across many papers.\nD. Use a separate Claude call with explicit instructions to generate higher-fidelity summaries that preserve\nall numerical details and statistical values. ❌ Incorrect\nEven high-fidelity summaries can introduce omission or distortion; it is not as reliable as structured fact\nextraction and storage."}, {"n": 96, "q": "Your fitness coaching assistant uses a system prompt with detailed conditional logic: \"If the user mentions being a\nbeginner, provide step-by-step form instructions. If they use terms like 'progressive overload' or 'superset',\nrespond concisely. If they ask about injury history, always recommend consulting a physician.\" During evaluation,\nyou find the assistant correctly adapts to explicit expertise declarations but struggles when users don't clearly\nstate their level—often defaulting to overly detailed responses regardless of contextual cues like technical\nterminology. Which change to the system prompt would most directly address this failure to pick up on implicit\nexpertise signals?", "o": [{"k": "A", "v": "Add an explicit instruction for the model to ask a clarifying question about experience level whenever the\nuser's expertise isn't immediately clear from their first message."}, {"k": "B", "v": "Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise,\nmirroring their terminology.\" Keep only the safety-critical conditional about injury consultations."}, {"k": "C", "v": "Implement a pre-conversation intake that asks users to rate their experience level, then inject that rating into\nthe system prompt as context for all subsequent responses."}, {"k": "D", "v": "Add more conditional branches to cover additional expertise signals, such as \"If user mentions specific rep\nranges or asks about periodization, treat as advanced.\""}], "a": "B", "e": "A. Add an explicit instruction for the model to ask a clarifying question about experience level whenever\nthe user's expertise isn't immediately clear from their first message. ❌ Incorrect\nThis reduces responsiveness and forces unnecessary clarification questions, even when the model could\nreasonably infer expertise from context.\nB. Replace most conditionals with a general principle: \"Adapt explanation depth to match user expertise,\nmirroring their terminology.\" Keep only the safety-critical conditional about injury consultations. ✅\nCorrect\nThis directly fixes the core issue: over-reliance on brittle rules. A general adaptive principle allows the model\nto infer expertise from implicit signals (terminology, phrasing, specificity) instead of only explicit declarations.\nC. Implement a pre-conversation intake that asks users to rate their experience level, then inject that\nrating into the system prompt as context for all subsequent responses. ❌ Incorrect\nThis improves clarity but adds friction and fails when users provide inaccurate or inconsistent self-\nassessments.\nD. Add more conditional branches to cover additional expertise signals,such as \"If user mentions specific\nrep ranges or asks about periodization, treat as advanced.\" ❌ Incorrect\nThis increases prompt complexity and still won’t scale to the full range of implicit cues users naturally\nexpress."}, {"n": 97, "q": "You're building a security scanning workflow. When engineers need to locate all occurrences of a dangerous\nfunction like eval() across a large codebase, which tool should your agent use for content search?", "o": [{"k": "A", "v": "Use Grep to search for the pattern \"eval(\" across all files in the codebase."}, {"k": "B", "v": "Use Glob with a pattern like **/*eval to find files, then Read each matching file."}, {"k": "C", "v": "Use Bash to run ls -R | grep eval to recursively list files containing eval."}, {"k": "D", "v": "Read the project's main entry file and follow import statements to trace where eval might be used."}], "a": "A", "e": "A. Use Grep to search for the pattern \"eval(\" across all files in the codebase. ✅ (Correct)\nGrep is specifically designed for content searching within files. It can efficiently scan a large codebase and\nlocate every occurrence of a pattern such as eval(, making it the most appropriate tool for security analysis\nand code auditing.\nB. Use Glob with a pattern like **/*eval to find files, then Read each matching file. ❌ (Incorrect)\nGlob searches file names and paths, not file contents. It would miss occurrences of eval( inside files whose\nnames do not contain \"eval\".\nC. Use Bash to run ls -R | grep eval to recursively list files containing eval. ❌ (Incorrect)\nThis searches file names returned by ls, not the contents of files.\nD. Read the project's main entry file and follow import statements to trace where eval might be used. ❌\n(Incorrect)\nThis is inefficient and unreliable for finding all occurrences across a large codebase. It may miss many uses of\neval()."}, {"n": 98, "q": "agent has identified that caching logic spans 15 files including decorators, middleware, and service classes\n(~8,000 lines total). What's next step for building understanding while managing context constraints?", "o": [{"k": "A", "v": "Use Glob to find files matching common caching patterns (cache.py, caching/), prioritize the largest files by\nreading them first, then check smaller files for gaps."}, {"k": "B", "v": "Use the Read tool to sequentially load all 15 files, building complete understanding across the full caching\nimplementation."}, {"k": "C", "v": "Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific line\nranges with minimal surrounding context."}, {"k": "D", "v": "Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the\ninterface, then trace specific invalidation implementations."}], "a": "D", "e": "D. Analyze imports and class hierarchies to identify the base cache class, Read that file to understand the\ninterface, then trace specific invalidation implementations. ✅ (Correct)\nWhen the logic spans many files (~8,000 lines), the goal is to build understanding efficiently while respecting\ncontext limits. Starting with the core abstraction (the base cache class or interface) provides a high-level\nunderstanding of how the caching system is structured. From there, you can trace the specific\nimplementations and invalidation paths that matter, rather than reading thousands of lines indiscriminately.\nA. Use Glob to find files matching common caching patterns, prioritize the largest files by reading them\nfirst, then check smaller files for gaps. ❌ (Incorrect)\nFile size is not a reliable indicator of importance. Large files may contain unrelated logic.\nB. Use the Read tool to sequentially load all 15 files, building complete understanding across the full\ncaching implementation. ❌ (Incorrect)\nThis is inefficient and likely to exceed context constraints. Understanding should be built incrementally.\nC. Use Grep to search for \"invalidate\" and \"expire\" patterns across all files, then Read only those specific\nline ranges with minimal surrounding context. ❌ (Incorrect)\nWhile useful for targeted investigation, this can miss the broader architecture and relationships needed to\nunderstand the caching system correctly."}, {"n": 99, "q": "Today she wants to continue that specific investigation. She's worked on three other codebases since then and\nknows the session was dive\". How should she resume?", "o": [{"k": "A", "v": "Start fresh and re-read the same files"}, {"k": "B", "v": "Use --resume auth-deep-dive to load that specific session by name"}, {"k": "C", "v": "Use --continue to pick up where the most recent conversation left off"}, {"k": "D", "v": "Use --session-id with the UUID from yesterday's session transcript file"}], "a": "B", "e": "B. Use --resume auth-deep-dive to load that specific session by name ✅ (Correct)\nWhen returning to a specific investigation after working on other projects, using --resume with the session\nname is the most direct way to continue that exact context. It restores the relevant conversation and state\nassociated with the named session.\nA. Start fresh and re-read the same files ❌ (Incorrect)\nThis discards existing context and wastes time rebuilding understanding.\nC. Use --continue to pick up where the most recent conversation left off ❌ (Incorrect)\n--continue resumes the most recent session, which may be one of the other codebases worked on since then.\nD. Use --session-id with the UUID from yesterday's session transcript file ❌ (Incorrect)\nWhile a session ID could identify a session, the question specifically indicates the session is already known by\nname, making --resume auth-deep-dive the appropriate approach."}, {"n": 100, "q": "\"You're the Lead Data Scientist/Engineer on a critical project. Something is not completely right with technical\ndetails or the data, and it negative impacts expected outputs. They need to independently develop both\napproaches to evaluation data... How do you manage this scenario?\"", "o": [{"k": "A", "v": "Start two fresh sessions, having each re-read the relevant source files before beginning."}, {"k": "B", "v": "Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially."}, {"k": "C", "v": "Resume the analysis session with fork_session enabled, creating a separate branch for each testing strategy."}, {"k": "D", "v": "Export the analysis session's key findings to a file, then create two new sessions that reference this file."}], "a": "C", "e": "C. Resume the analysis session with fork_session enabled, creating a separate branch for each testing\nstrategy. ✅ (Correct)\nForking the existing session allows both testing strategies to start from the same investigation context and\nunderstanding of the codebase. Each branch can then evolve independently, making it easy to compare\napproaches without losing prior analysis or mixing the reasoning paths.\nA. Start two fresh sessions, having each re-read the relevant source files before beginning. ❌ (Incorrect)\nThis duplicates work and loses the benefit of the existing analysis context.\nB. Continue in the original session, developing end-to-end tests first, then snapshot tests sequentially. ❌\n(Incorrect)\nSequential development makes comparison harder and mixes the reasoning for the two approaches.\nD. Export the analysis session's key findings to a file, then create two new sessions that reference this file.\n❌ (Incorrect)\nWhile possible, it is less efficient than directly forking the existing session and maintaining full contextual\ncontinuity."}, {"n": 101, "q": "A security audit requires updating your authentication library from v2 to v3. The migration guide documents\nbreaking changes: authenticate() now returns a Promise instead of accepting a callback, the User type has\nrestructured fields, and three deprecated methods were removed. Grep shows the library is imported in 45 files\nacross several modules. What's the most effective approach?", "o": [{"k": "A", "v": "Paste the migration guide's breaking changes into your prompt and use direct execution to update all usages\nacross the 45 files."}, {"k": "B", "v": "Enter plan mode to explore library usage across modules, map affected code paths, then create a migration\nstrategy before implementing."}, {"k": "C", "v": "Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears."}, {"k": "D", "v": "Create a custom slash command encapsulating the migration transformations, then execute it against each\nfile without prior codebase exploration."}], "a": "B", "e": "B. Enter plan mode to explore library usage across modules, map affected code paths, then create a\nmigration strategy before implementing. ✅ (Correct)\nA major library upgrade with breaking changes affecting 45 files should be approached systematically. Plan\nmode helps analyze how the authentication library is used across the codebase, identify callback-based\nimplementations that must be converted to Promises, understand dependencies on the restructured User\ntype, and locate uses of deprecated methods. Creating a migration strategy before making changes reduces\nrisk and ensures consistency across all modules.\nA. Paste the migration guide's breaking changes into your prompt and use direct execution to update all\nusages across the 45 files. ❌ (Incorrect)\nDirectly modifying dozens of files without first understanding usage patterns can introduce widespread errors\nand inconsistent implementations.\nC. Update the dependency version, run the test suite, and use Claude Code to fix each failure as it appears.\n❌ (Incorrect)\nThis is a reactive approach that depends on test coverage and may miss affected code paths that are not\nexercised by tests.\nD. Create a custom slash command encapsulating the migration transformations, then execute it against\neach file without prior codebase exploration. ❌ (Incorrect)\nAutomating changes without understanding the codebase can apply incorrect transformations and create\nadditional issues."}, {"n": 102, "q": "During testing, you observe that in extended exploration sessions (30+ minutes), the agent starts giving\ninconsistent answers about context discussed earlier. Engineers report having to repeat context about modules\nthey've already explored. What's the most effective approach to address this?", "o": [{"k": "A", "v": "Create summaries of all source files before exploration begins, loading only these compressed\nrepresentations into context."}, {"k": "B", "v": "Switch to a higher-capacity model tier to provide more context window space for accumulated exploration\ndata."}, {"k": "C", "v": "Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh,\nuncontaminated context."}, {"k": "D", "v": "Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent questions."}], "a": "D", "e": "D. Have the agent maintain a scratchpad file that records key findings, referencing it for subsequent\nquestions. ✅ (Correct)\nIn long exploration sessions, context window limitations can cause earlier discoveries to be forgotten or\nsummarized away. Maintaining a persistent scratchpad of important findings, module relationships, decisions,\nand observations allows the agent to consistently reference prior work without requiring engineers to\nrepeatedly provide the same context.\nA. Create summaries of all source files before exploration begins, loading only these compressed\nrepresentations into context. ❌ (Incorrect)\nSummaries can omit important implementation details and are not a complete substitute for maintaining\nevolving investigation knowledge.\nB. Switch to a higher-capacity model tier to provide more context window space for accumulated\nexploration data. ❌ (Incorrect)\nA larger context window may help temporarily, but it does not solve the underlying problem of managing\nknowledge across lengthy investigations.\nC. Implement automatic context clearing every 15 minutes to ensure the agent starts with fresh,\nuncontaminated context. ❌ (Incorrect)\nClearing context would worsen the problem by causing the agent to lose even more information from the\nongoing investigation."}, {"n": 103, "q": "old_string parameter cannot find unique text to match — the file has repetitive docstrings, variable names, and\nstructural patterns. What is a reliable way to complete this insertion?", "o": [{"k": "A", "v": "Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness"}, {"k": "B", "v": "Use Read to load the file, add the function at the appropriate location, then Write the updated file"}, {"k": "C", "v": "Use Edit's replace_all parameter to target a common pattern and embed the new function in the replacement\ntext"}, {"k": "D", "v": "Use Bash to append the function definition to the end of the file using heredoc syntax"}], "a": "B", "e": "B. Use Read to load the file, add the function at the appropriate location, then Write the updated file ✅\n(Correct)\nWhen old_string cannot uniquely identify a match due to repetitive patterns, the most reliable approach is to\nfirst read the full file, understand its structure, and then rewrite or update the file explicitly. This avoids\nambiguity and ensures the insertion happens in the correct location without relying on fragile string matching.\nA. Use Edit with an extremely long old_string capturing 30+ lines of context to guarantee uniqueness ❌\n(Incorrect)\nThis is brittle and error-prone; large context strings still may not guarantee uniqueness in repetitive files.\nC. Use Edit's replace_all parameter to target a common pattern and embed the new function in the\nreplacement text ❌ (Incorrect)\nUsing replace_all on common patterns risks unintended modifications across multiple unrelated locations.\nD. Use Bash to append the function definition to the end of the file using heredoc syntax ❌ (Incorrect)\nBlindly appending code can place the function in an incorrect location and break file structure or\ndependencies."}, {"n": 104, "q": "You need to add a date validation check ensuring event dates are in the future. This requires adding a conditional\nstatement to one existing function in a single file. What is the most appropriate approach?", "o": [{"k": "A", "v": "Enter plan mode to analyze how the validation might impact other parts of the reservation flow"}, {"k": "B", "v": "Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic"}, {"k": "C", "v": "Use direct execution to make the change"}, {"k": "D", "v": "Enter plan mode first to create a detailed implementation strategy before making the change"}], "a": "C", "e": "C. Use direct execution to make the change ✅ (Correct)\nSince this is a small, localized change (adding a single validation check inside one existing function in one\nfile), it does not require broader architectural analysis or a multi-step plan. Direct execution is appropriate for\nquick, low-risk modifications.\nA. Enter plan mode to analyze how the validation might impact other parts of the reservation flow ❌\n(Incorrect)\nThis is unnecessary overhead for a simple, isolated validation change.\nB. Start with extended thinking mode enabled to ensure thorough reasoning about the validation logic ❌\n(Incorrect)\nWhile reasoning is useful, extended planning modes are not needed for a straightforward conditional check.\nD. Enter plan mode first to create a detailed implementation strategy before making the change ❌\n(Incorrect)\nPlanning is better suited for multi-file or system-wide changes, not a single-function update."}, {"n": 105, "q": "Your team's CLAUDE.md includes a rule: \"Use 4-space indentation and always run Prettier formatting.\" Despite\nthis, code reviews reveal that roughly 30% of files Claude Code generates use inconsistent formatting —\nsometimes 2-space indentation, sometimes missing trailing commas. Adding emphasis (\"IMPORTANT: You MUST\nuse Prettier formatting\") reduces violations to about 15%, but doesn't eliminate them. What is the most effective\nway to ensure all generated code is consistently formatted?", "o": [{"k": "A", "v": "Extract the formatting rules into a dedicated skill that Claude loads automatically when generating code,\nwith more detailed examples of correct formatting."}, {"k": "B", "v": "Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting\nstandards and prompts Claude to fix violations."}, {"k": "C", "v": "Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file\nClaude modifies."}, {"k": "D", "v": "Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching file\ntypes."}], "a": "C", "e": "C. Configure a Post ToolUse hook with an Edit|Write matcher that automatically runs Prettier on each file\nClaude modifies. ✅ (Correct)\nThe most reliable way to enforce consistent formatting is to remove reliance on the model remembering\nrules and instead enforce formatting through an automatic post-processing step. A Post ToolUse hook that\nruns Prettier guarantees every modified file is formatted correctly, regardless of how the code was\ngenerated.\nA. Extract the formatting rules into a dedicated skill that Claude loads automatically when generating\ncode, with more detailed examples of correct formatting. ❌ (Incorrect)\nMore instructions and examples improve compliance slightly but do not guarantee consistent formatting.\nB. Add a Stop hook with a prompt-based check that evaluates whether generated code follows formatting\nstandards and prompts Claude to fix violations. ❌ (Incorrect)\nThis adds extra reasoning cycles but is still LLM-dependent and not deterministic.\nD. Split the formatting rules into path-scoped .claude/rules/ files that load when Claude works on matching\nfile types. ❌ (Incorrect)\nThis improves organization but does not enforce formatting automatically or reliably."}, {"n": 106, "q": "You've asked Claude Code to build a PDF report generation feature. The initial implementation queries the\ndatabase correctly, but the output has formatting issues: table columns are too narrow causing content truncation,\ndates display without proper formatting, and page break handling is incorrect. You've noticed these issues interact\n— changing column widths affects how dates render, and page breaks depend on content height. What's the most\neffective approach for iterating toward a working solution?", "o": [{"k": "A", "v": "Address the column width issue first with specific measurements, verify it works, then fix date formatting\nwithin the corrected columns, then adjust page breaks— testing after each change."}, {"k": "B", "v": "Provide all three issues in a single detailed message with exact specifications for each, allowing Claude to\naddress them together in one update."}, {"k": "C", "v": "Show Claude an example of a correctly formatted report and ask it to match that output, rather than listing\nthe specific technical issues."}, {"k": "D", "v": "Start fresh with a detailed prompt specifying all formatting requirements upfront."}], "a": "A", "e": "A. Address the column width issue first with specific measurements, verify it works, then fix date\nformatting within the corrected columns, then adjust page breaks— testing after each change. ✅ (Correct)\nWhen issues are interdependent (layout, formatting, and pagination affecting each other), the most\neffective strategy is iterative isolation. Fixing one constraint at a time (starting with structural layout like\ncolumn widths) prevents cascading side effects and makes it easier to understand what each change impacts\nbefore moving to the next issue.\nB. Provide all three issues in a single detailed message with exact specifications for each, allowing Claude\nto address them together in one update. ❌ (Incorrect)\nThis can lead to unstable results because multiple interacting constraints are modified at once, making\ndebugging harder.\nC. Show Claude an example of a correctly formatted report and ask it to match that output, rather than\nlisting the specific technical issues. ❌ (Incorrect)\nExample-based prompting helps, but it does not resolve underlying structural dependencies in layout logic.\nD. Start fresh with a detailed prompt specifying all formatting requirements upfront. ❌ (Incorrect)\nRestarting loses iteration context and still doesn’t address the need for step-by-step validation of\ninterdependent issues."}, {"n": 107, "q": "You're implementing a caching layer for API responses to speed up the /products endpoint. You have a rough idea\n—Redis with a 5-minute TTL—but you're new to production caching and aren't sure what other considerations a\nrobust implementation requires. What's the most effective way to start your iterative workflow?", "o": [{"k": "A", "v": "Ask Claude to interview you about the caching requirements before implementing, surfacing considerations\nlike invalidation strategies, cache layers, consistency guarantees, and failure modes."}, {"k": "B", "v": "Use plan mode to analyze the current/products endpoint implementation, then provide your caching\nrequirements once Claude explains how the existing code is structured."}, {"k": "C", "v": "Start with a minimal request: \"Add Redis caching to/products with 5-minute TTL.\" Add features and fix issues\nthrough follow-up prompts as problems surface during testing."}, {"k": "D", "v": "Write a specification with your known requirements and \"TBD\" markers for uncertain areas, having Claude\npropose solutions for each TBD as it implements."}], "a": "A", "e": "A. Ask Claude to interview you about the caching requirements before implementing, surfacing\nconsiderations like invalidation strategies, cache layers, consistency guarantees, and failure modes. ✅\n(Correct)\nWhen you’re unsure about production-grade caching design, the most effective starting point is to first\nsurface missing requirements and constraints. An interactive clarification step helps uncover critical\nconsiderations like cache invalidation, stale data handling, consistency models, key design, TTL trade-offs,\nand failure modes before any implementation begins. This leads to a more robust and less error-prone design.\nB. Use plan mode to analyze the current /products endpoint implementation, then provide your caching\nrequirements once Claude explains how the existing code is structured. ❌ (Incorrect)\nUnderstanding the endpoint is useful, but jumping into code analysis before clarifying caching requirements\ncan miss key architectural decisions.\nC. Start with a minimal request: \"Add Redis caching to /products with 5-minute TTL.\" Add features and fix\nissues through follow-up prompts as problems surface during testing. ❌ (Incorrect)\nThis reactive approach often leads to brittle caching logic and repeated rework.\nD. Write a specification with your known requirements and \"TBD\" markers for uncertain areas, having\nClaude propose solutions for each TBD as it implements. ❌ (Incorrect)\nWhile structured, it still assumes you already know what to specify, which is not true in this scenario."}, {"n": 108, "q": "You're implementing a complex graph traversal algorithm with specific performance requirements and edge cases\nto handle (disconnected nodes, cycles, weighted edges).\nYou want to structure your workflow for efficient iterative refinement with Claude. What approach will most\neffectively enable progressive improvement across multiple iterations?", "o": [{"k": "A", "v": "Write a test suite covering expected behavior, edge cases, and performan
